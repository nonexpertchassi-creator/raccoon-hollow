<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#231c14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23a8763e%22/%3E%3C/svg%3E">
<title>너구리 만물상</title>
<style>
/* 조선시대 만물상 — 한지색 바탕에 먹색. 아트가 아니라 자리만 잡아둔 것. */
:root{
  --paper:#e8ddc8; --paper2:#ddd0b6; --line:#c4b291;
  --ink:#2b241b; --ink2:#5a4e3d; --ink3:#8a7a63;
  --gold:#a8763e; --jade:#4a7c59; --red:#a34a3a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:#1a150f;color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);
  box-shadow:0 0 60px rgba(0,0,0,.6)}

/* 상단 */
header{padding:10px 14px 8px;border-bottom:1.5px solid var(--line);flex-shrink:0;position:relative}
/* 머리띠 단추 — 손가락으로 누르는 물건이라 44px은 되어야 한다 */
#knobs{position:absolute;top:10px;right:12px;display:flex;gap:6px}
#knobs button{width:44px;height:44px;border-radius:12px;
  border:1.5px solid var(--line);background:rgba(0,0,0,.12);font-size:20px;line-height:1;
  cursor:pointer;color:inherit;padding:0}
#mute.off{opacity:.55}
.title{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--gold)}
.money{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;
  line-height:1.15;transition:transform .12s}
.money.pop{transform:scale(1.09)}
.sub{font-size:11.5px;color:var(--ink3);display:flex;gap:12px;margin-top:1px}

/* 로그 띠 — 높이를 **못 박는다.**
 * 글이 한 줄이었다 두 줄이었다 하면 이 띠가 늘었다 줄고, 그만큼 아래 캔버스가
 * 밀려서 마을 전체가 위아래로 튄다. 두 줄이 들어가는 높이로 고정하고,
 * 더 길면 두 줄에서 자른다. */
#guest{padding:8px 14px;background:var(--paper2);border-bottom:1.5px solid var(--line);
  font-size:13px;height:60px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  overflow:hidden}
#guest .say{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.5}
#guest .face{font-size:19px;flex:0 0 auto}
#guest .say{color:var(--ink2)} #guest .say b{color:var(--ink)}
#guest.ask{background:#f2e4bd;animation:blink 1.4s ease}
/* 쥐가 들었다 — 몇 초짜리 사건이라 눈에 안 띄면 그냥 지나친다 */
#guest.pest{background:#efd0c6;animation:blink .5s ease infinite}
#guest.catch{background:#dbe8cf}
@keyframes blink{0%{background:#ffe89a}100%{background:#f2e4bd}}

/* 탭 */
nav{display:flex;gap:5px;padding:8px 10px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;border:1.5px solid var(--line);border-bottom:none;
  background:var(--paper2);color:var(--ink2);border-radius:8px 8px 0 0;
  padding:7px 13px;font:700 12.5px inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--paper);color:var(--ink);border-color:var(--gold);
  box-shadow:inset 0 2.5px 0 var(--gold)}
nav button.locked{opacity:.5}

/* 본문 */
main{flex:1;overflow-y:auto;padding:10px 12px 16px;border-top:1.5px solid var(--line);
  margin-top:-1.5px}
.shopnote{font-size:11.5px;color:var(--ink3);margin:2px 2px 10px}

.item{background:var(--paper2);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden}
.item .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(168,118,62,.16);
  width:0;transition:width .1s linear}
.item .row{position:relative;display:flex;align-items:center;gap:10px}
.item .nm{font-weight:800;font-size:15px}
.item .lv{font-size:11px;color:var(--ink3);font-weight:600}
.item .stat{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;line-height:1.45}
.item .stat b{font-size:13px;color:var(--ink)}
.up{margin-top:8px;position:relative;width:100%;border:0;border-radius:8px;
  padding:9px;font:800 13px inherit;cursor:pointer;background:var(--gold);color:#fff8ec;
  transition:filter .12s,transform .06s}
.up:active{transform:translateY(1px)}
.up:disabled{background:#c9bb9f;color:#8d8069;cursor:default}
.up.ms{background:var(--jade)}
/* 묶음 강화. 6시간에 레벨업 클릭이 1945번 나와서 붙였다. */
.ups{display:flex;gap:6px;margin-top:8px}
.ups .up{margin-top:0}
.up.bulk{width:auto;flex:0 0 auto;padding:9px 13px;background:var(--ink2)}
.up.bulk:disabled{background:#c9bb9f;color:#8d8069}

/* 마을 장면. 목록 대신 이게 기본 화면이 된다. */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#8b9e74;overflow:hidden}
#cv{display:block;touch-action:none}
#autobar{padding:0 12px}
#autobar button{width:100%;margin:8px 0 0;border:0;background:var(--gold);color:#fff8ec;
  border-radius:9px;padding:9px;font:800 12.5px inherit;cursor:pointer}
#autobar button:disabled{background:#c9bb9f;color:#8d8069}

/* 가게를 누르면 아래에서 올라오는 창 */
#panel{position:fixed;inset:0;background:rgba(26,21,15,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
#panel[hidden]{display:none}
#panel .sheet{width:100%;max-width:480px;max-height:78%;overflow-y:auto;
  background:var(--paper);border-radius:16px 16px 0 0;padding:12px 12px 20px;
  border-top:2px solid var(--gold);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;margin-bottom:10px}
.sheethead b{font-size:16px}
.sheethead button{margin-left:auto;border:0;background:var(--paper2);color:var(--ink2);
  border-radius:8px;padding:7px 13px;font:800 12.5px inherit;cursor:pointer}

.maxed{margin-top:8px;padding:8px;border-radius:8px;background:var(--paper);
  text-align:center;font:700 12px inherit;color:var(--ink3)}
/* 승급 — 마을이 다 찬 뒤의 다음 목표 */
.promo{margin-top:12px;border:1.5px solid var(--gold);border-radius:12px;
  padding:12px;background:var(--paper2)}
.promo.done{text-align:center;font:800 13px inherit;color:var(--gold);border-style:dashed}
.promo .ph{font:800 14px inherit;margin-bottom:3px}
.promo .ph b{color:var(--gold)}
.promo .pd{font-size:11.5px;color:var(--ink3);margin-bottom:9px}
.promo .req{font-size:12px;color:var(--ink3);padding:3px 0;font-weight:700}
.promo .req.on{color:var(--jade)}
.promo button{margin-top:9px}

/* 손님 도감 */
.gh2{font:800 13px inherit;color:var(--ink2);margin-bottom:9px}
.gh2 b{color:var(--gold)}
.grow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 11px;font-size:12.5px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper2);margin-bottom:7px}
.grow.off{border-style:dashed;background:transparent;color:var(--ink3)}
.grow .gf{font-size:19px;width:24px;text-align:center}
.grow.off .gf{color:var(--ink3);font-weight:800}
.grow .gn{font-weight:800;min-width:46px}
.grow .gr{font-weight:800;color:var(--gold)}
.grow .gr.top{color:var(--jade)}
.grow .gl{margin-left:auto;color:var(--ink3);font-size:11px}
.grow .gsub{flex-basis:100%;color:var(--ink2);font-size:11.5px;margin-left:31px}
.grow .gsub.gnum{color:var(--ink3);font-size:10.5px;margin-top:1px}

/* 마을 의뢰 · 젬 */
#gems{color:var(--jade);font-weight:800}
.qrow{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper2);padding:10px 11px;margin-bottom:7px}
.qrow .qbar{position:absolute;left:0;top:0;bottom:0;background:rgba(60,140,110,.18);
  transition:width .3s}
.qrow .qin{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px}
.qrow .qv{font-weight:800;min-width:76px}
.qrow .qw{font-weight:800;color:var(--gold)}
.qrow .qg{margin-left:auto;font-weight:800;color:var(--jade)}
.qrow .qn{position:relative;margin-top:4px;font-size:11px;color:var(--ink3);font-weight:700}
/* 기간제 이벤트 — 의뢰 창 맨 위 */
.evt{position:relative;overflow:hidden;border:1.5px solid var(--gold);border-radius:12px;
  background:var(--paper2);padding:11px 12px;margin-bottom:10px}
.evt .ebar{position:absolute;left:0;top:0;bottom:0;background:rgba(168,118,62,.17);transition:width .3s}
.evt .eh{position:relative;display:flex;align-items:center;gap:8px;font:800 14px inherit}
.evt .eh .et{margin-left:auto;font-size:11.5px;color:var(--gold)}
.evt .ed{position:relative;font-size:12px;color:var(--ink2);margin-top:3px}
.evt .er{position:relative;font-size:11px;color:var(--ink3);font-weight:700;margin-top:4px}
.evt.off{border-style:dashed;border-color:var(--line);text-align:center;color:var(--ink3);
  font:700 12px inherit;padding:14px}
.skins{font-size:11.5px;color:var(--ink3);font-weight:700;margin:-3px 0 10px}
.skins b{color:var(--jade)}
.qempty{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;
  font:700 12px inherit;color:var(--ink3);margin-bottom:7px}
.gup{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper2);padding:9px 11px;margin-bottom:7px;font-size:12.5px}
.gup .uf{font-size:19px;width:24px;text-align:center}
.gup .un{font-weight:800}
.gup .ud{flex-basis:100%;color:var(--ink2);font-size:11px;margin-left:33px;margin-top:-4px}
.gup{flex-wrap:wrap}
.gup button{margin-left:auto;border:0;background:var(--jade);color:#fff8ec;border-radius:8px;
  padding:8px 12px;font:800 12px inherit;cursor:pointer;white-space:nowrap}
.gup button:disabled{background:#c9bb9f;color:#8d8069}
.gup.done{border-style:dashed;background:transparent;color:var(--ink3)}
/* 버튼 줄. 앞선 규칙의 width:100%를 반드시 풀어야 한다 —
 * 안 풀면 한쪽이 396px를 먹고 다른 쪽이 40px로 눌려 글자가 줄바꿈되며
 * 줄 높이가 141px까지 늘어난다. */
#autobar{display:flex;gap:7px;padding:0 12px}
#autobar button{flex:1;width:auto;min-width:0;white-space:nowrap}
#autobar button.ghost{flex:0 0 auto;background:var(--paper2);color:var(--ink2);
  border:1.5px solid var(--line)}

.locked-item{background:transparent;border:1.5px dashed var(--line);color:var(--ink3)}
.locked-item .nm{color:var(--ink2)}
.open-btn{background:var(--jade)}
.hint{font-size:11.5px;color:var(--ink3);text-align:center;padding:18px 10px;line-height:1.6}

/* 마을 */
.village{display:grid;gap:8px}
.plot{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--paper2);
  display:flex;align-items:center;gap:11px}
.plot.ruin{border-style:dashed;background:transparent;opacity:.75}
.plot .sign{font-size:22px;width:34px;text-align:center;color:var(--gold);font-weight:800}
.plot.ruin .sign{color:var(--ink3)}
.plot .nm{font-weight:800;font-size:15px}
.plot .ds{font-size:11.5px;color:var(--ink3)}
.plot .act{margin-left:auto}
.plot button{border:0;background:var(--jade);color:#fff;border-radius:8px;padding:8px 13px;
  font:800 12.5px inherit;cursor:pointer}
.plot button:disabled{background:#c9bb9f;color:#8d8069}
/* 자동 강화. 손으로 1986번 누르던 걸 없애는 물건이라 마을 화면 맨 위에 둔다. */
.autobox{border:1.5px solid var(--gold);border-radius:10px;padding:11px 12px;
  background:var(--paper2);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.autobox .nm{font-weight:800;font-size:14px}
.autobox .ds{font-size:11.5px;color:var(--ink3)}
.autobox button{margin-left:auto;border:0;background:var(--gold);color:#fff8ec;
  border-radius:8px;padding:8px 13px;font:800 12.5px inherit;cursor:pointer;white-space:nowrap}
.autobox button:disabled{background:#c9bb9f;color:#8d8069}
.autobox.on{border-style:solid;border-color:var(--jade);color:var(--jade);
  font-weight:700;font-size:12.5px;display:block}

#log{font-size:11.5px;color:var(--ink3);padding:10px 2px 0;line-height:1.75}
#log div{padding:1px 0}
#log .ask{color:var(--gold);font-weight:700}
#log .shop{color:var(--jade);font-weight:700}
#log .milestone{color:var(--red);font-weight:700}

#float{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:5}
.fly{position:absolute;font:800 14px inherit;color:var(--jade);animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-38px)}}

#offline{position:fixed;inset:0;background:rgba(26,21,15,.82);display:flex;align-items:center;
  justify-content:center;z-index:20;padding:20px}
#offline .card{background:var(--paper);border:2px solid var(--gold);border-radius:14px;
  padding:22px;max-width:330px;text-align:center}
#offline h3{margin:0 0 8px;font-size:17px}
#offline p{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.6}
#offline button{width:100%;border:0;background:var(--gold);color:#fff8ec;border-radius:9px;
  padding:12px;font:800 14px inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="knobs">
      <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
    </div>
    <div class="title">너구리 만물상</div>
    <div class="money" id="money">0</div>
    <div class="sub">
      <span id="ips">초당 0</span>
      <span id="gems">💎 0</span>
      <span id="shopcount"></span>
    </div>
  </header>
  <div id="guest"><span class="face">🐰</span><span class="say">토끼가 가게를 기웃거린다…</span></div>
  <div id="autobar"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="panel" hidden><div class="sheet">
  <div class="sheethead"><b id="ptitle"></b><button id="pclose">닫기</button></div>
  <div id="pbody"></div>
</div></div>
<div id="float"></div>

<script type="module">
import { Sim, fmt, josa, itemById, shopById } from './sim.js';
import { SHOPS, GUESTS, STOCK_CAP, MILESTONE_EVERY, AUTO_COST,
         QUEST, GEM, GEM_UPGRADES, EVENTS } from './content.js';
import { Store } from './core/store.js';
import { Juice, Sfx } from './core/juice.js';
import { Engine } from './core/engine.js';
import { Village } from './iso.js';

const $ = (s) => document.querySelector(s);
/* 저장 열쇠 v2 — 돈 단위 개편(경→억)으로 옛 저장과 물가가 안 맞는다.
 * 조냥이 든 지갑으로 새 물가에 들어오면 전부 공짜가 되므로 새로 시작한다. */
const SAVE = 'rs:save2';

const saved = Store.get(SAVE);
const sim = new Sim(saved?.state || null);

/* 오프라인 수익 — 방치형의 심장 */
if (saved?.at) {
  const away = (Date.now() - saved.at) / 1000;
  const r = sim.offline(away);
  if (r && r.earned > 0) showOffline(r);
}

function showOffline(r) {
  const el = document.createElement('div');
  el.id = 'offline';
  const h = Math.floor(r.seconds / 3600), m = Math.round((r.seconds % 3600) / 60);
  el.innerHTML = `<div class="card">
    <h3>다녀오신 동안</h3>
    <p>${h ? h + '시간 ' : ''}${m}분 동안 너구리들이 계속 만들었습니다.<br>
    ${r.capped ? '<b>(최대 4시간까지만 쌓입니다)</b>' : ''}</p>
    <div style="font-size:26px;font-weight:800;color:var(--gold);margin-bottom:16px">
      🪙${fmt(r.earned)}</div>
    <button id="ok">받기</button></div>`;
  document.body.appendChild(el);
  el.querySelector('#ok').onclick = () => { Sfx.coin(); el.remove(); };
}

/* ── 가게를 누르면 올라오는 창 ──
 * 장면이 기본 화면이 되면서 목록은 여기로 들어왔다. 강화·칸 열기는
 * 손가락으로 정확히 눌러야 하는 조작이라 캔버스보다 DOM이 낫다. */
let openShopId = null;
let panelKind = null;      // 'shop' | 'guests' | 'quests'

/** 손님 도감 열기 */
function openGuests() {
  panelKind = 'guests'; openShopId = null;
  $('#ptitle').textContent = '손님 도감';
  $('#pbody').innerHTML = guestsHTML();
  $('#panel').hidden = false;
  Sfx.click();
}

/** 마을 의뢰 열기 */
function openQuests() {
  panelKind = 'quests'; openShopId = null;
  $('#ptitle').textContent = '마을 의뢰';
  $('#pbody').innerHTML = questsHTML();
  $('#panel').hidden = false;
  bindQuests();
  Sfx.click();
}

function openPanel(id, isOpen) {
  const shop = shopById(id);
  if (!isOpen) {
    // 아직 무너진 집 — 다음 차례고 돈이 되면 바로 되살린다
    const next = sim.nextShop();
    if (next && next.id === id && sim.openShop(id)) {
      Sfx.win(); Juice.shake(7);
    } else {
      Sfx.deny();
    }
    return;
  }
  openShopId = id; panelKind = 'shop';
  $('#ptitle').textContent = `${shop.sign} ${shop.name}`;
  $('#pbody').innerHTML = shopHTML(shop);
  $('#panel').hidden = false;
  bindShop();
  Sfx.click();
}

function closePanel() { openShopId = null; panelKind = null; $('#panel').hidden = true; }
$('#pclose').onclick = () => { Sfx.click(); closePanel(); };
$('#panel').onclick = (e) => { if (e.target.id === 'panel') closePanel(); };

function shopHTML(s) {
  /* ★ 지금 매대가 있는 칸까지만 보여준다.
   *
   * 매대를 가게마다 8칸으로 늘리자 "? ? ?"가 네 줄씩 늘어섰다. 그중 절반은
   * 승급하기 전엔 아예 못 여는 칸이라, 똑같이 생긴 수수께끼 줄이 화면만
   * 채우고 알려주는 건 없었다. 못 여는 칸은 줄 하나로 접고, 여는 방법
   * (승급)은 아래 승급 칸이 이미 말하고 있다. */
  const cap = sim.stallCap(s.id);
  const hidden = s.items.length - cap;
  const rows = s.items.slice(0, cap).map((it) => {
    if (sim.isOpen(it.id)) {
      const lv = sim.lv(it.id), st = sim.items[it.id];
      const cost = sim.levelCost(it.id);
      const max = sim.maxLv(it.id), atMax = sim.atMax(it.id);
      const toMs = MILESTONE_EVERY - (lv % MILESTONE_EVERY);
      const ms = !atMax && toMs <= 3;
      return `<div class="item" data-id="${it.id}">
        <div class="bar"></div>
        <div class="row">
          <div><div class="nm">${sim.itemName(it.id)}</div><div class="lv">Lv.${lv}/${max}${
            atMax ? ' · 만렙' : ms ? ` · ${toMs}레벨 뒤 값이 2배` : ''}</div></div>
          <div class="stat"><b>🪙${fmt(sim.price(it.id))}</b><br>
            재고 <span class="stk">${st.stock}</span>/${sim.capOf(it.id)} · ${sim.craftTime(it.id).toFixed(1)}초</div>
        </div>
        ${atMax ? '<div class="maxed">더 올릴 수 없다 — 가게를 승급해야 한다</div>' : `<div class="ups">
          <button class="up ${ms ? 'ms' : ''}" data-up="${it.id}" data-n="1"
            ${sim.money >= cost ? '' : 'disabled'}>레벨업 🪙${fmt(cost)}</button>
          <button class="up bulk" data-up="${it.id}" data-n="10"
            ${sim.money >= sim.levelCostMany(it.id, 10) ? '' : 'disabled'}>×10</button>
          <button class="up bulk" data-up="${it.id}" data-n="max"
            ${sim.money >= cost ? '' : 'disabled'}>최대</button>
        </div>`}
      </div>`;
    }
    if (sim.asked.includes(it.id)) {
      return `<div class="item locked-item"><div class="row">
        <div><div class="nm">${sim.itemName(it.id)}</div><div class="lv">손님이 찾던 물건</div></div></div>
        <button class="up open-btn" data-open="${it.id}"
          ${sim.money >= it.cost ? '' : 'disabled'}>칸 열기 🪙${fmt(it.cost)}</button></div>`;
    }
    return `<div class="item locked-item"><div class="row">
      <div><div class="nm">? ? ?</div><div class="lv">아직 아무도 찾지 않았다</div></div></div></div>`;
  }).join('');
  const more = hidden > 0
    ? `<div class="maxed" style="margin:7px 0">승급하면 매대 ${hidden}칸이 더 생긴다</div>` : '';
  return `<div class="shopnote">${s.desc}</div>${rows}${more}${staffHTML(s)}${promoteHTML(s)}`;
}

/* 직원 — 점장 혼자 만들고 팔다가, 마당이 커지면(승급) 일손을 들인다.
 * 직원 한 명 = 이 가게 진열대 +10칸. */
function staffHTML(s) {
  const n = sim.staffOf(s.id), max = sim.staffMax(s.id);
  if (max === 0) {
    return `<div class="item locked-item"><div class="row">
      <div><div class="nm">일손 들이기</div>
      <div class="lv">가게를 승급하면 직원 자리가 생긴다</div></div></div></div>`;
  }
  const cost = sim.staffCost(s.id);
  const full = n >= max;
  return `<div class="item"><div class="row">
    <div><div class="nm">일손 ${'🦝'.repeat(n + 1)}</div>
    <div class="lv">점장 1 + 직원 ${n}/${max} · 계산 중에도 생산이 안 멈춘다</div></div></div>
    ${full ? '' : `<button class="up" data-hire="${s.id}"
      ${sim.money >= cost ? '' : 'disabled'}>직원 들이기 🪙${fmt(cost)}</button>`}
  </div>`;
}

/* 손님 도감.
 *
 * 단골 목록을 가게 창마다 붙였더니 다섯 곳에 똑같은 게 반복됐다. 손님은
 * 특정 가게의 것이 아니라 마을 전체의 것이므로 따로 뺀다.
 *
 * 아직 안 온 손님도 자리를 비워 보여준다 — 몇이 더 남았는지, 무엇을 하면
 * 오는지가 보여야 모으는 재미가 생긴다.
 */
function guestsHTML() {
  const rows = GUESTS.map((g) => {
    if (!sim.guests.includes(g.id)) {
      return `<div class="grow off"><span class="gf">?</span>
        <span class="gn">? ? ?</span>
        <span class="gl">누적 매출 🪙${fmt(g.at)}에 온다</span></div>`;
    }
    const lv = sim.regularLv(g.id), left = sim.regularLeft(g.id);
    const carry = g.qty <= 5 ? '맨손' : g.qty <= 9 ? '봇짐' : g.qty <= 12 ? '지게' : '달구지';
    const bought = sim.bought[g.id] || 0;
    return `<div class="grow">
      <span class="gf">${g.face}</span>
      <span class="gn">${g.name}</span>
      <span class="gr ${lv >= 15 ? 'top' : ''}">${lv + 1}성 ${sim.regularName(g.id)}</span>
      <span class="gl">${left === null ? '최고 등급' : `다음까지 ${fmt(left)}번`}</span>
      <div class="gsub">${g.desc}</div>
      <div class="gsub gnum">${carry} · ${g.every}초마다 ${g.qty}개 · 값 ×${g.pay}${
        g.spread === 1 ? ' · 한 종류만' : ''}${
        g.wild >= 0.6 ? ' · 언제 올지 모른다' : ''} · 누적 ${fmt(bought)}개 / ${fmt(sim.visits[g.id] || 0)}번</div>
    </div>`;
  }).join('');
  const have = sim.guests.length;
  return `<div class="gh2">마을에 온 손님 ${have} / ${GUESTS.length}
    · 단골 등급 합계 <b>${sim.regularSum()}</b></div>${rows}`;
}

/* ── 마을 의뢰 ──
 * 단위가 손님 한 마리가 아니라 **마을**이다. 그래서 아무것도 안 해도
 * 그 마을 손님이 올 때마다 눈금이 찬다 — 방치형에서 다시 켤 이유는
 * "가만히 뒀는데 뭔가 올라가 있다"에서 나온다.
 *
 * 실패도, 시간 제한도 없다. 있으면 지켜봐야 하는 숙제가 된다.
 */
function questsHTML() {
  const rows = sim.quests.map((q) => {
    const g = GUESTS.find((x) => x.id === q.gid);
    const p = Math.min(100, (q.got / q.need) * 100);
    return `<div class="qrow" data-q="${q.id}">
      <div class="qbar" style="width:${p}%"></div>
      <div class="qin">
        <span class="qv">${g.face} ${g.name}마을</span>
        <span class="qw">${sim.itemName(q.itemId)} ${fmt(q.need)}개</span>
        <span class="qg">💎${q.gems}</span>
      </div>
      <div class="qn">${fmt(q.got)} / ${fmt(q.need)} · ${
        sim.regularStar(q.gid)}성 ${sim.regularName(q.gid)}
        · 마치면 🪙${fmt(Math.floor(sim.price(q.itemId) * q.need * QUEST.payMul))}</div>
    </div>`;
  }).join('');

  const blank = sim.quests.length < QUEST.slots
    ? `<div class="qempty">다음 의뢰가 오는 중… (${Math.ceil(Math.max(0, sim._qCool))}초)</div>` : '';

  /* 젬 쓰는 곳. 지금은 **화면을 새로 안 만들어도 되는 것**만 있다 —
   * 뽑기·룰렛·스킨은 새 화면이 필요해서 엔진을 옮긴 뒤로 미뤘다. */
  const ups = GEM_UPGRADES.map((u) => {
    const lv = sim.upLv(u.id), cost = sim.gemCost(u.id);
    if (cost === null) {
      return `<div class="gup done"><span class="uf">${u.face}</span>
        <span class="un">${u.name}</span><span>${u.max}단계 — 끝까지 올렸다</span></div>`;
    }
    return `<div class="gup"><span class="uf">${u.face}</span>
      <span class="un">${u.name} ${lv}/${u.max}</span>
      <button data-gup="${u.id}" ${sim.gems >= cost ? '' : 'disabled'}>💎${cost}</button>
      <span class="ud">${u.desc}${lv ? ` · 지금 ${
        u.id === 'haggle' ? '+' + (lv * u.step * 100).toFixed(1) + '%' :
        u.id === 'forge' ? '−' + Math.round(lv * u.step * 100) + '%' :
        '−' + (lv * u.step).toFixed(1) + '초'}` : ''}</span></div>`;
  }).join('');

  return eventHTML() + `<div class="gh2">가진 젬 <b>💎${sim.gems}</b>
    · 의뢰를 마치거나, 품목을 만렙까지 올리거나, 나쁜 놈을 잡으면 모인다</div>
    ${rows}${blank}
    <div class="gh2" style="margin-top:14px">젬 쓰는 곳</div>
    <div class="gup"><span class="uf">👷</span>
      <span class="un">삯꾼 부르기</span>
      <button id="gemrush" ${sim.canRush() ? '' : 'disabled'}>💎${GEM.rush.cost}</button>
      <span class="ud">${sim.rush > 0 ? `삯꾼이 일하는 중… ${Math.ceil(sim.rush)}초` :
        `${GEM.rush.secs}초 동안 만드는 속도가 ${GEM.rush.mult}배`}</span></div>
    ${ups}
    <div class="qempty" style="margin-top:10px">뽑기 · 룰렛 · 스킨 상점은 다음 판에 붙는다</div>`;
}

/* 기간제 이벤트 카드.
 * 마감은 **실제 시간**이라 게임을 꺼도 줄어든다. 그게 "오늘 안에"라는
 * 말을 뜻있게 만드는 유일한 방법이다.
 * 못 깨도 잃는 게 없다 — 그래서 남은 시간을 빨갛게 쓰지 않는다. */
function hhmm(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? `${h}시간 ${m}분` : `${m}분`;
}

function eventHTML() {
  const skins = sim.skins.length
    ? `<div class="skins">받은 것: <b>${sim.skins.map((k) =>
        (EVENTS.find((e) => e.skin === k) || {}).skinName || k).join(' · ')}</b>
        <span style="font-weight:600">(그림은 나중에 붙는다)</span></div>` : '';
  const e = sim.eventDef();
  if (!e) {
    const w = sim.eventWait();
    return `<div class="evt off">${sim.shops.length < 2
      ? '가게를 둘 열면 장이 선다'
      : `다음 장까지 ${hhmm(w)}`}</div>${skins}`;
  }
  const got = Math.min(sim.event.got, e.need);
  return `<div class="evt">
    <div class="ebar" style="width:${(got / e.need) * 100}%"></div>
    <div class="eh"><span>${e.face}</span><span>${e.name}</span>
      <span class="et">${hhmm(sim.eventLeft())} 남음</span></div>
    <div class="ed">${e.desc} — <b>${fmt(got)} / ${fmt(e.need)}</b></div>
    <div class="er">깨면 💎${e.gems} · ${e.skinName} · 못 깨도 잃는 것은 없다</div>
  </div>${skins}`;
}

function bindQuests() {
  const gf = $('#gemrush');
  if (gf) gf.onclick = () => {
    if (sim.callRush()) { Sfx.win(); Juice.shake(6); } else Sfx.deny();
    $('#pbody').innerHTML = questsHTML(); bindQuests();
  };
  document.querySelectorAll('[data-gup]').forEach((b) => b.onclick = () => {
    if (sim.buyGemUp(b.dataset.gup)) { Sfx.reward(); Juice.shake(5); } else Sfx.deny();
    $('#pbody').innerHTML = questsHTML(); bindQuests();
  });
}

/* 승급 — 마을이 다 찬 뒤의 다음 목표.
 * 조건을 통과/미통과로 하나씩 보여준다. 못 하는 이유가 안 보이면
 * 목표가 되지 못하고 그냥 잠긴 버튼으로만 남는다. */
function promoteHTML(s) {
  const r = sim.promoteReqs(s.id);
  if (!r) return `<div class="promo done">${s.ranks[sim.rankOf(s.id)]} 등급 — 더 오를 곳이 없다</div>`;
  const ok = r.list.every((x) => x.ok);
  const lines = r.list.map((x) =>
    `<div class="req ${x.ok ? 'on' : ''}">${x.ok ? '✓' : '·'} ${x.text}</div>`).join('');
  const nextName = s.ranks[r.rank];
  return `<div class="promo">
    <div class="ph">${s.ranks[sim.rankOf(s.id)]} → <b>${nextName}</b> 등급으로 승급</div>
    <div class="pd">${s.items.slice(0, 4 + 2 * Math.min(2, r.rank))
      .map((it) => nextName + it.name).join(' · ')}</div>
    ${lines}
    <button class="up ${ok ? 'ms' : ''}" data-promote="${s.id}" ${ok ? '' : 'disabled'}>
      ${ok ? `승급하기 🪙${fmt(r.cost)}` : '조건을 채워야 한다'}</button>
  </div>`;
}

function bindShop() {
  document.querySelectorAll('[data-up]').forEach((b) => b.onclick = () => {
    const id = b.dataset.up;
    const want = b.dataset.n === 'max' ? sim.affordableLevels(id) : Number(b.dataset.n);
    const wasMs = Math.floor(sim.lv(id) / MILESTONE_EVERY);
    if (!sim.levelUpMany(id, want)) return;
    if (Math.floor(sim.lv(id) / MILESTONE_EVERY) > wasMs) { Sfx.win(); Juice.shake(7); }
    else Sfx.click();
    $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
  });
  const pb = document.querySelector('[data-promote]');
  if (pb) pb.onclick = () => {
    if (sim.promote(pb.dataset.promote)) {
      Sfx.win(); Juice.shake(10);
      $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
    }
  };
  document.querySelectorAll('[data-hire]').forEach((b) => b.onclick = () => {
    if (sim.hireStaff(b.dataset.hire)) { Sfx.reward(); Juice.shake(5); $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop(); }
  });
  document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => {
    if (sim.openItem(b.dataset.open)) {
      Sfx.reward(); Juice.shake(4);
      $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
    }
  });
}

/* ── 장부 정리(자동 강화) ── */
function renderAuto() {
  const bar = $('#autobar');
  bar.innerHTML =
    `<button id="openguests" class="ghost">손님 ${sim.guests.length}/${GUESTS.length}</button>` +
    `<button id="openquests" class="ghost">의뢰 ${sim.quests.length}</button>` +
    (sim.auto ? '' : `<button id="buyauto" ${sim.money >= AUTO_COST ? '' : 'disabled'}>
      장부 정리 🪙${fmt(AUTO_COST)}</button>`);
  $('#openguests').onclick = openGuests;
  $('#openquests').onclick = openQuests;
  const ba = $('#buyauto');
  if (ba) ba.onclick = () => {
    if (sim.buyAuto()) { Sfx.reward(); Juice.shake(5); renderAuto(); }
  };
}

/* ── 마을 장면 ── */
const eng = new Engine($('#cv'), { w: 480, h: 800, bg: '#8b9e74', fit: 'width' });
const village = new Village(sim, openPanel);

/* 장부(아래 로그)는 손님이 계산대에서 물건을 받는 **그 순간** 쓴다.
 * 예전엔 sim이 계산을 마치자마자 썼는데, 손님은 아직 걸어오는 중이라
 * "오기도 전에 사갔다고 나온다"가 됐다 — 유저 눈엔 그냥 버그다. */
village.onDelivered = (s) => {
  $('#guest').className = '';
  if (s.n === 0) {
    const what = s.grumbles && s.grumbles.length ? sim.itemName(s.grumbles[0].item.id) : '물건';
    $('#guest').innerHTML =
      `<span class="face">${s.guest.face}</span><span class="say">` +
      `${s.guest.name}: ${josa(what, '이', '가')} 없어 발길을 돌렸다 💢</span>`;
    return;
  }
  const head = sim.itemName(s.lines[0].item.id);
  const more = s.lines.length > 1 ? ` 외 ${s.lines.length - 1}종` : '';
  const waited = s.waited > 0.5 ? ' (기다렸다 받아갔다)' : '';
  $('#guest').innerHTML =
    `<span class="face">${s.guest.face}</span><span class="say">` +
    `${sim.regularLv(s.guest.id) ? sim.regularName(s.guest.id) + ' ' : ''}${s.guest.name}가 ` +
    `<b>${head}${more}</b> ${s.n}개를 사갔다 · <b>🪙${fmt(s.gain)}</b>${waited}</span>`;
};
/* '가게 안' 화면은 은퇴했다. 마당 방식이 되면서 안이 지도에서 다 보인다 —
 * 매대를 누르면 그 자리에서 강화되고, 마당을 누르면 가게 창이 열린다. */

let uiAcc = 0, saveAcc = 0, pestShown = false;
eng.add('village', {
  update(dt) {
    const r = sim.tick(dt);

    for (const s of r.sales) village.onSale(s);
    for (const d of r.done || []) village.onOrderDone(d);
    for (const p of r.pests || []) village.onPestGone(p);
    if (r.ask) {
      village.onAsk(r.ask);
      Sfx.deny();
      $('#guest').className = 'ask';
      $('#guest').innerHTML =
        `<span class="face">${r.ask.guest.face}</span><span class="say">${r.ask.guest.name}: ` +
        `"<b>${r.ask.line}</b>" — 없다고 하자 돌아갔다</span>`;
    }
    if (r.newGuest) Sfx.reward();

    if (r.event) {
      Sfx.win(); Juice.shake(10);
      $('#guest').className = 'catch';
      $('#guest').innerHTML = `<span class="face">${r.event.face}</span><span class="say">` +
        `<b>${r.event.name}</b>을(를) 깼다 — <b>💎${r.event.gems}</b> · <b>${r.event.skinName}</b></span>`;
    }

    /* 의뢰 완료 — 위쪽 띠로 알린다. 아래 버튼의 숫자만 바뀌면
     * 안 보고 있을 때 끝난 걸 알 방법이 없다. */
    for (const q of r.quests || []) {
      Sfx.win(); Juice.shake(6);
      $('#guest').className = 'catch';
      $('#guest').innerHTML = `<span class="face">${q.guest.face}</span><span class="say">` +
        `<b>${q.guest.name}마을</b> 의뢰를 마쳤다 · ${sim.itemName(q.item.id)} ${fmt(q.need)}개 ` +
        `— <b>🪙${fmt(q.coin)}</b> · <b>💎${q.gems}</b></span>`;
    }

    /* 나쁜 놈 — 화면 위쪽 띠로도 알린다. 마을을 밀어 다른 데를 보고 있으면
     * 캔버스의 쥐가 화면 밖일 수 있는데, 그때 알 방법이 없다. */
    if (sim.pest && !pestShown) {
      pestShown = true;
      Sfx.deny();
      const P = sim.pestKind();
      $('#guest').className = 'pest';
      $('#guest').innerHTML = `<span class="face">${P.face}</span><span class="say">` +
        `${josa(P.name, '이', '가')} <b>${sim.pest.what}</b> — <b>눌러서 잡아라!</b></span>`;
    } else if (!sim.pest && pestShown) {
      pestShown = false;
      /* 잡았는지 놓쳤는지는 sim이 남긴 사건으로 갈린다.
       * 잡는 조작은 캔버스에서 일어나므로 여기까지 따로 알려오지 않는다. */
      const e = sim.events[0];
      if (e && e.kind === 'catch') {
        Sfx.win();
        $('#guest').className = 'catch';
        $('#guest').innerHTML = `<span class="face">🎉</span><span class="say">${e.msg}</span>`;
      } else if (e && e.kind === 'guard') {
        Sfx.reward();
        $('#guest').className = 'catch';
        $('#guest').innerHTML = `<span class="face">🐕</span><span class="say">${e.msg}</span>`;
      } else if (e && e.kind === 'pest') {
        $('#guest').className = '';
        $('#guest').innerHTML = `<span class="face">💨</span><span class="say">${e.msg}</span>`;
      }
    }

    village.update(dt, eng.pointer, eng.viewH);

    // 화면 글자 갱신은 초당 8회면 충분하다. 매 프레임 DOM을 만지면 폰이 뜨거워진다.
    uiAcc += dt;
    if (uiAcc > 0.12) { uiAcc = 0; paint(); }

    saveAcc += dt;
    if (saveAcc > 5) { saveAcc = 0; Store.set(SAVE, { state: sim.save(), at: Date.now() }); }
  },
  draw(c) { village.draw(c); },
});

let lastMoney = -1, lastAuto = null, lastGuests = -1, lastQuests = -1, guestTick = 0;
function paint() {
  const m = $('#money');
  /* 계산 연출이 아직 안 끝난 몫은 빼고 보여준다 — 손님이 오기도 전에
   * 돈이 오르면 버그로 보인다. sim의 진짜 돈은 그대로다(버튼 계산엔 그걸 쓴다). */
  const shown = Math.max(0, sim.money - village.inTransit());
  m.textContent = '🪙 ' + fmt(shown);
  if (shown !== lastMoney) { m.classList.add('pop'); setTimeout(() => m.classList.remove('pop'), 120); }
  lastMoney = shown;
  $('#ips').textContent = '초당 🪙' + fmt(sim.incomePerSec());
  $('#shopcount').textContent = `가게 ${sim.shops.length}/${SHOPS.length} · 손님 ${sim.guests.length}`;
  $('#gems').textContent = '💎 ' + fmt(sim.gems);

  const canAuto = !sim.auto && sim.money >= AUTO_COST;
  if (sim.auto !== lastAuto || lastGuests !== sim.guests.length || lastQuests !== sim.quests.length) {
    lastAuto = sim.auto; lastGuests = sim.guests.length; lastQuests = sim.quests.length; renderAuto();
  }
  const ba = $('#buyauto');
  if (ba) ba.disabled = !canAuto;

  if (panelKind === 'guests') {
    guestTick += 1;
    if (guestTick > 8) { guestTick = 0; $('#pbody').innerHTML = guestsHTML(); }
  }
  /* 의뢰 창은 눈금이 차오르는 걸 보는 창이라 더 자주 고쳐 그린다.
   * 대신 버튼을 다시 묶어야 한다 — 안 묶으면 눌러도 아무 일이 없다. */
  if (panelKind === 'quests') {
    guestTick += 1;
    if (guestTick > 4) { guestTick = 0; $('#pbody').innerHTML = questsHTML(); bindQuests(); }
  }

  if (openShopId) {
    for (const el of document.querySelectorAll('.item[data-id]')) {
      const id = el.dataset.id, st = sim.items[id];
      if (!st) continue;
      el.querySelector('.bar').style.width = (st.prog / sim.craftTime(id)) * 100 + '%';
      const stk = el.querySelector('.stk');
      if (stk) stk.textContent = st.stock;
    }
    document.querySelectorAll('[data-up]').forEach((b) => {
      const id = b.dataset.up;
      if (!id) return;
      b.disabled = sim.atMax(id) || (b.dataset.n === '10'
        ? sim.money < sim.levelCostMany(id, 10)
        : sim.money < sim.levelCost(id));
    });
    document.querySelectorAll('[data-open]').forEach((b) => {
      b.disabled = sim.money < itemById(b.dataset.open).cost;
    });
  }
}

addEventListener('pointerdown', () => Sfx.unlock(), { once: true });

/* ── 소리 스위치 ──
 * 끈 상태는 저장과 별도 열쇠로 남긴다 — 게임 저장을 지워도(처음부터 하기)
 * "시끄러워서 껐다"는 취향은 지워질 이유가 없다. */
const MUTE = 'rs:mute';
function paintMute() {
  $('#mute').textContent = Sfx.muted ? '🔇' : '🔊';
  $('#mute').classList.toggle('off', Sfx.muted);
}
if (Store.get(MUTE)) Sfx.toggleMute();
paintMute();
$('#mute').addEventListener('click', () => {
  Store.set(MUTE, Sfx.toggleMute());
  paintMute();
  Sfx.click();      // 켰을 때만 들린다 — "다시 소리 난다"는 확인음
});
addEventListener('visibilitychange', () => {
  if (document.hidden) Store.set(SAVE, { state: sim.save(), at: Date.now() });
});

renderAuto(); paint();
eng.start('village');
</script>
</body>
</html>
