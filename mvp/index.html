<title>라쿤 마켓 첫 판</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{
  --paper:#E9DFC9; --paper2:#DED2B8; --card:#F7F1E1; --card2:#EFE6D0;
  --ink:#2A2018; --ink2:#6B5B47; --ink3:#9C8B72;
  --line:#CDBE9E; --clay:#9A6844; --jang:#B94F26; --leaf:#6E7C48;
  --coin:#C08A22; --coinbg:#F3E3BC; --ang:#C0392B;
  --shadow:0 1px 0 #FFFDF6 inset, 0 2px 6px rgba(60,42,22,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15110D; --paper2:#1D1813; --card:#241D16; --card2:#2C241B;
  --ink:#EDE1CA; --ink2:#B3A489; --ink3:#7E7059;
  --line:#3B3126; --clay:#B07A4E; --jang:#E0692F; --leaf:#93A164;
  --coin:#E7B54A; --coinbg:#332918; --ang:#E06A5A;
  --shadow:0 1px 0 rgba(255,240,210,.05) inset, 0 2px 8px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#15110D; --paper2:#1D1813; --card:#241D16; --card2:#2C241B;
  --ink:#EDE1CA; --ink2:#B3A489; --ink3:#7E7059;
  --line:#3B3126; --clay:#B07A4E; --jang:#E0692F; --leaf:#93A164;
  --coin:#E7B54A; --coinbg:#332918; --ang:#E06A5A;
  --shadow:0 1px 0 rgba(255,240,210,.05) inset, 0 2px 8px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
.wrap{max-width:460px; margin:0 auto; padding:0 12px 18px; min-height:100vh;
  display:flex; flex-direction:column; gap:10px}

/* 돈 띠 */
.top{position:sticky; top:0; z-index:5; background:var(--paper);
  padding:12px 0 8px; display:flex; align-items:center; gap:10px}
.purse{flex:1; display:flex; align-items:center; gap:8px;
  background:var(--coinbg); border:1px solid var(--line); border-radius:11px;
  padding:9px 13px; box-shadow:var(--shadow)}
.purse b{font-family:"Gowun Batang",serif; font-size:23px; color:var(--coin);
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.purse .coin{font-size:16px; line-height:1}
.clock{font-size:11.5px; color:var(--ink3); font-variant-numeric:tabular-nums;
  padding:9px 11px; border:1px solid var(--line); border-radius:11px}

/* 매장 카드 */
.shop{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:11px 12px 12px; box-shadow:var(--shadow); margin-bottom:9px}
.hd{display:flex; align-items:center; gap:9px}
.face{font-size:25px; line-height:1; filter:saturate(.92)}
.nm{flex:1; min-width:0}
.nm h3{margin:0; font-family:"Gowun Batang",serif; font-size:15.5px; font-weight:700;
  letter-spacing:-.01em}
.nm p{margin:1px 0 0; font-size:12px; color:var(--clay);
  font-family:"Gowun Batang",serif; font-variant-numeric:tabular-nums}
.nm p b{color:var(--coin); font-weight:700}
.tag2{color:var(--ink3); font-size:10.5px; font-family:"Gowun Dodum",sans-serif}
.stars{font-size:11px; letter-spacing:1.5px; color:var(--coin); text-align:right; line-height:1.1}
.stars b{display:block; font-size:10.5px; color:var(--ink3); letter-spacing:.04em;
  font-family:"Gowun Dodum",sans-serif; font-weight:400;
  font-variant-numeric:tabular-nums; margin-top:1px}

/* 마당 — 위는 줄, 아래는 계산대 */
.yard{margin-top:10px; display:flex; flex-direction:column; gap:7px}
.row{display:flex; align-items:center; gap:8px; min-height:30px}
.tag{font-size:10px; color:var(--ink3); width:32px; flex:none; letter-spacing:.04em}
.line{display:flex; align-items:center; gap:4px; height:30px; overflow:hidden; flex:1}
.cust{font-size:20px; line-height:1; animation:walkin .45s ease-out both;
  transform-origin:bottom center}
.cust.wait{animation:walkin .45s ease-out both, bob 1.1s ease-in-out infinite .45s}
.cust.mad{filter:hue-rotate(-18deg) saturate(1.5)}
.cust.far{opacity:.45; animation:comein .5s linear both}
@keyframes comein{from{transform:translateX(30px) scale(.85)}to{transform:none}}
@keyframes walkin{from{transform:translateX(26px); opacity:0}to{transform:none; opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.empty{flex:1; height:2px; border-bottom:1px dashed var(--line); opacity:.7}

.slots{display:flex; gap:5px; flex:1}
.slot{width:32px; height:32px; border:1px solid var(--line); border-radius:8px;
  background:var(--card2); position:relative; overflow:hidden;
  display:grid; place-items:center}
.slot i{position:absolute; left:0; right:0; bottom:0; background:var(--leaf);
  display:block; opacity:.42}
.slot u{position:relative; font-size:19px; text-decoration:none; line-height:1}
.slot.idle{border-style:dashed; background:transparent}
.slot.idle::after{content:"💤"; font-size:12px; opacity:.35}

/* 잠긴 자리는 한 줄로 얇게 */
.lockrow{display:flex; align-items:center; gap:9px; padding:9px 12px;
  border:1px dashed var(--line); border-radius:11px; margin-bottom:9px}
.lockrow .face{font-size:19px; opacity:.42}
.lockrow h3{margin:0; flex:1; font-family:"Gowun Batang",serif; font-size:14px;
  color:var(--ink3); font-weight:400}
.lockrow button{background:var(--clay); color:#FFF6EC; padding:7px 13px;
  font-size:12px; border-color:rgba(0,0,0,.12); font-variant-numeric:tabular-nums}
.lockrow button:disabled{background:transparent; color:var(--ink3);
  border:1px solid var(--line)}

/* 단추 줄 */
.acts{margin-top:10px; display:flex; gap:7px}
button{font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent;
  transition:transform .06s}
button:active{transform:translateY(1px)}
button:disabled{cursor:default; opacity:.42}
button:focus-visible{outline:2px solid var(--jang); outline-offset:2px}
.up{flex:1; background:var(--jang); color:#FFF6EC; border-color:rgba(0,0,0,.12);
  padding:10px 12px; display:flex; align-items:center; justify-content:space-between;
  gap:8px; font-size:13.5px; box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.up b{font-variant-numeric:tabular-nums; font-size:13px; opacity:.92}
.up:disabled{background:var(--card2); color:var(--ink3); border-color:var(--line);
  box-shadow:none; opacity:1}
.hire{background:var(--card2); color:var(--ink); border-color:var(--line);
  padding:10px 11px; font-size:12.5px; display:flex; gap:6px; align-items:center;
  font-variant-numeric:tabular-nums}
.star{background:var(--card2); color:var(--ink2); border-color:var(--line);
  padding:10px 9px; font-size:12px; display:flex; gap:4px; align-items:center;
  font-variant-numeric:tabular-nums}
.star b{font-weight:400; font-size:11.5px}
.star.ready{background:var(--coinbg); color:var(--coin); border-color:var(--coin)}
.buy{width:100%; background:var(--clay); color:#FFF6EC; padding:12px;
  font-size:13.5px; border-color:rgba(0,0,0,.12)}
.buy:disabled{background:transparent; color:var(--ink3); border:1px dashed var(--line)}

/* 눈금 */
.gauge{margin-top:2px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper2); padding:10px 12px}
.gauge h4{margin:0 0 7px; font-size:10.5px; letter-spacing:.09em; color:var(--ink3);
  font-weight:400}
.gr{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center}
.gr div b{display:block; font-family:"Gowun Batang",serif; font-size:16px;
  font-variant-numeric:tabular-nums}
.gr div span{font-size:10.5px; color:var(--ink3)}
.gr .bad b{color:var(--ang)}

/* 오프라인 창 */
.veil{position:fixed; inset:0; background:rgba(20,14,8,.55); display:grid;
  place-items:center; padding:20px; z-index:20}
.sheet{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:20px; max-width:340px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 4px; font-family:"Gowun Batang",serif; font-size:19px}
.sheet p{margin:0 0 14px; font-size:12.5px; color:var(--ink2); line-height:1.55}
.got{background:var(--coinbg); border:1px solid var(--line); border-radius:11px;
  padding:12px; text-align:center; margin-bottom:12px}
.got b{font-family:"Gowun Batang",serif; font-size:26px; color:var(--coin);
  font-variant-numeric:tabular-nums; display:block}
.got span{font-size:11px; color:var(--ink3)}
.dice{font-size:30px; text-align:center; margin:0 0 10px}
.foot{font-size:11px; color:var(--ink3); text-align:center; padding:4px 0 0; line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="purse"><span class="coin">🪙</span><b id="money">0</b></div>
    <div class="clock" id="clock">0:00</div>
  </div>
  <div id="shops"></div>
  <div class="gauge">
    <h4>25분 동안 손이 심심한가 — 재는 눈금</h4>
    <div class="gr">
      <div><b id="g-sold">0</b><span>판 것</span></div>
      <div><b id="g-tap">0</b><span>누른 횟수</span></div>
      <div class="bad"><b id="g-mad">0%</b><span>짜증</span></div>
      <div><b id="g-rate">0</b><span>초당 돈</span></div>
    </div>
  </div>
  <p class="foot">
    조선 저잣거리 · 1구역 네 곳<br>
    그림은 아직 없다 — 네모와 이모지로 먼저 굴려 본다
  </p>
</div>
<div id="modal"></div>

<script>
const B = {
  P0:1.0, INC:1.025, STAR:1.15, JUMP:2.0,
  C0:5.0, G:1.0551, TS:3.0,
  QMAX:4, WALK:0.5,
  // 시무룩해 보이기 시작하는 시간. 떠나지는 "않는다" — 이 게임에는 실패가 없다.
  FRET:10.0,
  BAND:[[1,5,3],[6,10,6],[11,15,12],[16,20,16]],
  PROC:[[1,2,1],[3,5,2],[6,10,3],[11,15,4],[16,20,6]],
  PER:0.985, FLOOR:0.5,
  OFF_SHARE:0.5, OFF_MIN:60, OFF_CAP:2*3600
};
const SHOPS = [
  {n:"떡집", e:"🍡", cost:0,
   it:["보리떡","콩떡","쑥떡","절편","가래떡","인절미","시루떡","백설기","송편","경단","무지개떡","꿀떡","진달래 화전","강정","유과","꿀 다식","정과","곶감","두텁떡","약과"]},
  {n:"국밥집", e:"🍲", cost:50,
   it:["주먹밥","보리밥","배춧국","콩나물국밥","국수","장국밥","순대국밥","만둣국","설렁탕","떡국","비빔밥","냉면","파전","잡채","삼계탕","갈비탕","불고기","구절판","신선로","갈비찜"]},
  {n:"나물집", e:"🥬", cost:200,
   it:["상추","흰 무","배추","콩나물","시금치","오이","미나리","참쑥","고사리","도라지","마늘","고추","참깨","팥","햅쌀","표고버섯","알밤","대추","인삼","송이버섯"]},
  {n:"생선집", e:"🐟", cost:800,
   it:["멸치","정어리","미역","다시마","구운 김","새우젓","참조기","고등어","갈치","명태","북어","오징어","낙지","문어","생대구","굴비","도미","민어","전복","생굴"]}
];
// 장부의 손님 열 종 그대로 — 조류·파충류는 안 넣는다(유저가 정했다).
// 너구리는 손님이 아니라 일꾼이라 여기 없다.
// 여기서 열 종이 다 나오는 건 MVP에 뽑기가 없어서다. 진짜 게임에서는
// 가진 손님만 나온다 — 시작 명단은 아직 안 정했다(장부의 미결정).
const FACES = ["🐰","🦊","🐱","🦔","🦦","🐷","🐑","🦌","🐻","🐯"];

const band = i => B.BAND.find(([a,b])=>i>=a&&i<=b)[2];
const proc = i => B.PROC.find(([a,b])=>i>=a&&i<=b)[2];
const itemOf = lv => Math.min(20, Math.floor((lv-1)/50)+1);
const craft = lv => band(itemOf(lv)) * Math.max(B.FLOOR, Math.pow(B.PER,(lv-1)%50));
const price = lv => B.P0*Math.pow(B.INC,lv-1)*Math.pow(B.STAR,Math.floor((lv-1)/10))*Math.pow(B.JUMP,Math.floor((lv-1)/50));
const lvCost = lv => B.C0*Math.pow(B.G,lv-1);
// 다음 별이 차는 레벨. 별은 11 · 21 · 31 … 에서 하나씩 찬다.
const starGoal = lv => (Math.floor((lv-1)/10)+1)*10 + 1;
// 거기까지 다 사려면 얼마인가. 못 사면 사는 데까지만 산다.
const starCost = lv => { let c=0; for(let L=lv; L<starGoal(lv); L++) c += lvCost(L); return c; };
const hireCost = (s,j) => Math.max(20, (SHOPS[j].cost||50)/2) * Math.pow(2, s.w-1);

// 작을 때는 소수점 둘까지 — 초반에는 0.4 차이로 단추가 열리고 닫힌다.
const won = n =>
    n < 100  ? n.toFixed(2)
  : n < 1e3  ? Math.floor(n).toLocaleString()
  : n < 1e6  ? (n/1e3).toFixed(2) + "K"
  : n < 1e9  ? (n/1e6).toFixed(2) + "M"
  : n < 1e12 ? (n/1e9).toFixed(2) + "B"
  :            (n/1e12).toFixed(2) + "T";

let S = null;
function fresh(){
  return {
    money:0, played:0, sold:0, taps:0, served:0, mad:0,
    shops: SHOPS.map((d,j)=>({
      open:j===0, lv:1, w:1, acc:0, q:[], mk:[null,null,null,null,null,null]
    }))
  };
}
try{
  const raw = localStorage.getItem("rm.mvp.v1");
  if(raw){ const p = JSON.parse(raw); S = p.s; S.leftAt = p.at; }
}catch(e){}
if(!S) S = fresh();

/* ── 자리를 비웠던 만큼 ───────────────────────────── */
function rateOf(){
  let r = 0;
  S.shops.forEach(s=>{
    if(!s.open) return;
    const it = itemOf(s.lv);
    const make = Math.min(s.w, proc(it)) / craft(s.lv);
    r += Math.min(make, 1/B.TS) * price(s.lv);   // 만드는 속도와 손님 속도 중 느린 쪽
  });
  return r;
}
if(S.leftAt){
  const gap = (Date.now() - S.leftAt)/1000;
  if(gap >= B.OFF_MIN){
    const capped = Math.min(gap, B.OFF_CAP);
    const base = rateOf()*capped*B.OFF_SHARE;
    const eye = 1 + Math.floor(Math.random()*6);
    const got = base*(1+eye);
    S.money += got;
    setTimeout(()=>offSheet(capped, base, eye, got), 60);
  }
  delete S.leftAt;
}
function offSheet(sec, base, eye, got){
  const m = Math.round(sec/60), h = Math.floor(m/60);
  const pips = "⚀⚁⚂⚃⚄⚅"[eye-1];
  document.getElementById("modal").innerHTML =
    `<div class="veil"><div class="sheet">
      <h2>다녀왔구나</h2>
      <p>${h?h+"시간 ":""}${m%60}분 자리를 비웠다. 그동안 너구리가 반만 벌어 뒀다.</p>
      <div class="dice">${pips}</div>
      <div class="got"><b>${won(got)}</b><span>기본 ${won(base)} × 주사위 ${eye}</span></div>
      <button class="buy" onclick="document.getElementById('modal').innerHTML=''">받는다</button>
    </div></div>`;
}

/* ── 한 바퀴 ─────────────────────────────────────── */
let last = performance.now(), accGauge = 0;
function tick(now){
  let dt = (now-last)/1000; last = now;
  if(dt > 0.5) dt = 0.5;
  S.played += dt;

  S.shops.forEach((s,j)=>{
    if(!s.open) return;
    const it = itemOf(s.lv), np = proc(it), act = Math.min(s.w, np), ct = craft(s.lv);

    // ① 손님이 나타난다 — 지도 어딘가에서 생겨 이 매장으로 걸어온다.
    //    줄이 꽉 차 있으면 아예 안 생긴다(떠나는 게 아니다 — 장부 파랑).
    //    걸어오는 손님도 4자리에 센다. 안 세면 지도에 손님이 무한정 쌓인다.
    s.acc += dt;
    while(s.acc >= B.TS){
      s.acc -= B.TS;
      if(s.q.length < B.QMAX)
        s.q.push({f:FACES[(Math.random()*FACES.length)|0], wait:0, walk:B.WALK});
      else { S.mad++; S.served++; }   // 못 들어온 손님 — 짜증 이모지가 뜰 자리
    }
    // ② 계산대가 비면 줄 맨 앞이 가서 주문한다
    for(let k=0;k<act;k++){
      if(s.mk[k]) continue;
      const i = s.q.findIndex(c=>c.walk<=0);   // 도착한 손님만. 생성 순이 아니라 도착 순이다
      if(i < 0) break;
      const c = s.q.splice(i,1)[0]; c.p = 0; s.mk[k] = c;
    }
    // 일꾼이 줄면 만들던 손님은 줄 앞으로 돌아간다
    for(let k=act;k<6;k++) if(s.mk[k]){ s.mk[k].p = 0; s.q.unshift(s.mk[k]); s.mk[k] = null; }
    // ③ 너구리가 만든다 → ④ 다 되면 받고 간다
    for(let k=0;k<act;k++){
      const c = s.mk[k]; if(!c) continue;
      c.p += dt;
      if(c.p >= ct){ S.money += price(s.lv); S.sold++; S.served++; s.mk[k] = null; }
    }
    // ⑤ 걸어오는 손님을 걸린다. 도착하면 그 순간의 줄 맨 뒤에 선다.
    //    손님은 안 떠난다 — 지쳐서 가버리는 일이 없다(장부 파랑). 기다리기만 한다.
    for(const c of s.q){
      if(c.walk > 0) c.walk -= dt;
      else c.wait += dt;
    }
  });

  accGauge += dt;
  if(accGauge >= 0.12){ accGauge = 0; paint(); }
  requestAnimationFrame(tick);
}

/* ── 그리기 ──────────────────────────────────────── */
const elShops = document.getElementById("shops");
let built = false;
function build(){
  elShops.innerHTML = S.shops.map((s,j)=>{
    const d = SHOPS[j];
    if(!s.open) return `<div class="lockrow" id="sh${j}">
      <span class="face">${d.e}</span><h3>${d.n}</h3>
      <button id="open${j}">자리를 연다 · ${won(d.cost)}</button>
    </div>`;
    return `<div class="shop" id="sh${j}">
      <div class="hd">
        <div class="face">${d.e}</div>
        <div class="nm"><h3>${d.n}</h3><p id="it${j}">—</p></div>
        <div class="stars" id="st${j}"></div>
      </div>
      <div class="yard">
        <div class="row"><span class="tag">줄</span>
          <span class="line" id="ln${j}"></span></div>
        <div class="row"><span class="tag">계산대</span>
          <span class="slots" id="sl${j}"></span></div>
      </div>
      <div class="acts">
        <button class="up" id="up${j}"><span>올리기</span><b>0</b></button>
        <button class="star" id="sf${j}">★<b>0</b></button>
        <button class="hire" id="hr${j}">🦝 <b>1</b></button>
      </div>
    </div>`;
  }).join("");
  S.shops.forEach((s,j)=>{
    const ob = document.getElementById("open"+j);
    if(ob) ob.onclick = ()=>{
      if(S.money < SHOPS[j].cost) return;
      S.money -= SHOPS[j].cost; s.open = true; S.taps++; build(); paint();
    };
    const ub = document.getElementById("up"+j);
    if(ub) hold(ub, ()=>{
      const c = lvCost(s.lv);
      if(S.money < c) return false;
      S.money -= c; s.lv++; S.taps++; return true;
    });
    // 장부 파랑: "한 번에 올리는 것은 별 하나까지다".
    // 돈 되는 데까지 사되 별 하나를 넘지 않는다 — 넘으면 물건이 여러 번 바뀌어
    // 못 보고 지나가는 물건이 생긴다.
    const sb = document.getElementById("sf"+j);
    if(sb) sb.onclick = ()=>{
      const goal = starGoal(s.lv);
      let bought = 0;
      while(s.lv < goal && S.money >= lvCost(s.lv)){ S.money -= lvCost(s.lv); s.lv++; bought++; }
      if(bought){ S.taps++; paint(); }
    };
    const hb = document.getElementById("hr"+j);
    if(hb) hb.onclick = ()=>{
      const np = proc(itemOf(s.lv));
      if(s.w >= 6) return;
      const c = hireCost(s,j);
      if(S.money < c) return;
      S.money -= c; s.w++; S.taps++; paint();
    };
  });
  built = true;
}
function hold(btn, fn){
  let timer = null, delay = 340;
  const go = ()=>{ if(fn()===false){ stop(); return; } paint();
    timer = setTimeout(go, delay); delay = Math.max(70, delay*0.72); };
  const stop = ()=>{ clearTimeout(timer); timer = null; delay = 340; };
  btn.addEventListener("pointerdown", e=>{ e.preventDefault(); go(); });
  ["pointerup","pointerleave","pointercancel"].forEach(k=>btn.addEventListener(k, stop));
}

function paint(){
  document.getElementById("money").textContent = won(S.money);
  const t = Math.floor(S.played);
  document.getElementById("clock").textContent =
    Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");

  S.shops.forEach((s,j)=>{
    if(!s.open){
      const ob = document.getElementById("open"+j);
      if(ob) ob.disabled = S.money < SHOPS[j].cost;
      return;
    }
    const it = itemOf(s.lv), np = proc(it), act = Math.min(s.w, np), ct = craft(s.lv);
    // 파는 값이 안 보이면 "올리기"가 이득인지 볼 수가 없다(규칙 5).
    document.getElementById("it"+j).innerHTML =
      `${SHOPS[j].it[it-1]} <span class="tag2">개당</span> <b>${won(price(s.lv))}</b>`
      + ` <span class="tag2">· ${ct.toFixed(1)}초</span>`;
    const filled = Math.floor(((s.lv-1)%50)/10);
    document.getElementById("st"+j).innerHTML =
      "★".repeat(filled) + "☆".repeat(5-filled) + `<b>Lv.${s.lv}</b>`;

    const ln = document.getElementById("ln"+j);
    if(!s.q.length) ln.innerHTML = `<span class="empty"></span>`;
    else{
      const want = s.q.map(c=> c.walk > 0
        ? `<span class="cust far">${c.f}</span>`
        : `<span class="cust wait${c.wait > B.FRET ? " mad" : ""}">${c.f}</span>`).join("");
      if(ln.dataset.k !== want){ ln.dataset.k = want; ln.innerHTML = want; }
    }

    let sl = "";
    for(let k=0;k<act;k++){
      const c = s.mk[k];
      sl += c
        ? `<span class="slot"><i style="height:${(Math.min(1,c.p/ct)*100).toFixed(0)}%"></i><u>${c.f}</u></span>`
        : `<span class="slot idle"></span>`;
    }
    const el = document.getElementById("sl"+j);
    if(el.dataset.k !== sl){ el.dataset.k = sl; el.innerHTML = sl; }

    const ub = document.getElementById("up"+j), c = lvCost(s.lv);
    ub.querySelector("b").textContent = won(c);
    ub.disabled = S.money < c;
    const sb = document.getElementById("sf"+j), sc = starCost(s.lv);
    sb.querySelector("b").textContent = won(sc);
    sb.disabled = S.money < c;          // 한 레벨도 못 사면 그때만 잠근다
    sb.classList.toggle("ready", S.money >= sc);
    const hb = document.getElementById("hr"+j);
    if(s.w >= 6){ hb.innerHTML = "🦝 <b>6</b>"; hb.disabled = true; }
    else{
      const hc = hireCost(s,j);
      hb.innerHTML = `🦝 <b>${s.w}</b> · ${won(hc)}`;
      hb.disabled = S.money < hc;
    }
  });

  document.getElementById("g-sold").textContent = S.sold.toLocaleString();
  document.getElementById("g-tap").textContent = S.taps.toLocaleString();
  document.getElementById("g-mad").textContent =
    (S.served ? Math.round(S.mad/S.served*100) : 0) + "%";
  document.getElementById("g-rate").textContent = rateOf().toFixed(1);
}

function save(){
  try{ localStorage.setItem("rm.mvp.v1", JSON.stringify({s:S, at:Date.now()})); }catch(e){}
}
addEventListener("visibilitychange", ()=>{ if(document.hidden) save(); });
addEventListener("pagehide", save);
setInterval(save, 5000);

build(); paint();
requestAnimationFrame(tick);
</script>
