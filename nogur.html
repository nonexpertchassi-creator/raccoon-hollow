<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#231c14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23a8763e%22/%3E%3C/svg%3E">
<title>너구리 만물상</title>
<style>
/* 조선시대 만물상 — 한지색 바탕에 먹색. 아트가 아니라 자리만 잡아둔 것. */
:root{
  --paper:#e8ddc8; --paper2:#ddd0b6; --line:#c4b291;
  --ink:#2b241b; --ink2:#5a4e3d; --ink3:#8a7a63;
  --gold:#a8763e; --jade:#4a7c59; --red:#a34a3a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:#1a150f;color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  background:var(--paper);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);
  box-shadow:0 0 60px rgba(0,0,0,.6)}

/* 상단 */
header{padding:10px 14px 8px;border-bottom:1.5px solid var(--line);flex-shrink:0;position:relative}
/* 머리띠 단추 — 손가락으로 누르는 물건이라 44px은 되어야 한다 */
#knobs{position:absolute;top:10px;right:12px;display:flex;gap:6px}
#knobs button{width:44px;height:44px;border-radius:12px;
  border:1.5px solid var(--line);background:rgba(0,0,0,.12);font-size:20px;line-height:1;
  cursor:pointer;color:inherit;padding:0}
#mute.off{opacity:.55}
.title{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--gold)}
.money{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;
  line-height:1.15;transition:transform .12s}
.money.pop{transform:scale(1.09)}
.sub{font-size:11.5px;color:var(--ink3);display:flex;gap:12px;margin-top:1px}

/* 로그 띠 — 높이를 **못 박는다.**
 * 글이 한 줄이었다 두 줄이었다 하면 이 띠가 늘었다 줄고, 그만큼 아래 캔버스가
 * 밀려서 마을 전체가 위아래로 튄다. 두 줄이 들어가는 높이로 고정하고,
 * 더 길면 두 줄에서 자른다. */
#guest{padding:8px 14px;background:var(--paper2);border-bottom:1.5px solid var(--line);
  font-size:13px;height:60px;display:flex;align-items:center;gap:8px;flex-shrink:0;
  overflow:hidden}
#guest .say{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.5}
#guest .face{font-size:19px;flex:0 0 auto}
#guest .say{color:var(--ink2)} #guest .say b{color:var(--ink)}
#guest.ask{background:#f2e4bd;animation:blink 1.4s ease}
/* 쥐가 들었다 — 몇 초짜리 사건이라 눈에 안 띄면 그냥 지나친다 */
#guest.pest{background:#efd0c6;animation:blink .5s ease infinite}
#guest.catch{background:#dbe8cf}
@keyframes blink{0%{background:#ffe89a}100%{background:#f2e4bd}}

/* 탭 */
nav{display:flex;gap:5px;padding:8px 10px 0;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;border:1.5px solid var(--line);border-bottom:none;
  background:var(--paper2);color:var(--ink2);border-radius:8px 8px 0 0;
  padding:7px 13px;font:700 12.5px inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--paper);color:var(--ink);border-color:var(--gold);
  box-shadow:inset 0 2.5px 0 var(--gold)}
nav button.locked{opacity:.5}

/* 본문 */
main{flex:1;overflow-y:auto;padding:10px 12px 16px;border-top:1.5px solid var(--line);
  margin-top:-1.5px}
.shopnote{font-size:11.5px;color:var(--ink3);margin:2px 2px 10px}

.item{background:var(--paper2);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden}
.item .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(168,118,62,.16);
  width:0;transition:width .1s linear}
.item .row{position:relative;display:flex;align-items:center;gap:10px}
.item .nm{font-weight:800;font-size:15px}
.item .lv{font-size:11px;color:var(--ink3);font-weight:600}
.item .stat{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;line-height:1.45}
.item .stat b{font-size:13px;color:var(--ink)}
.up{margin-top:8px;position:relative;width:100%;border:0;border-radius:8px;
  padding:9px;font:800 13px inherit;cursor:pointer;background:var(--gold);color:#fff8ec;
  transition:filter .12s,transform .06s}
.up:active{transform:translateY(1px)}
.up:disabled{background:#c9bb9f;color:#8d8069;cursor:default}
.up.ms{background:var(--jade)}
/* 묶음 강화. 6시간에 레벨업 클릭이 1945번 나와서 붙였다. */
.ups{display:flex;gap:6px;margin-top:8px}
.ups .up{margin-top:0}
.up.bulk{width:auto;flex:0 0 auto;padding:9px 13px;background:var(--ink2)}
.up.bulk:disabled{background:#c9bb9f;color:#8d8069}

/* 마을 장면. 목록 대신 이게 기본 화면이 된다. */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#8b9e74;overflow:hidden}
#cv{display:block;touch-action:none}
#autobar{padding:0 12px}
#autobar button{width:100%;margin:8px 0 0;border:0;background:var(--gold);color:#fff8ec;
  border-radius:9px;padding:9px;font:800 12.5px inherit;cursor:pointer}
#autobar button:disabled{background:#c9bb9f;color:#8d8069}

/* 가게를 누르면 아래에서 올라오는 창 */
#panel{position:fixed;inset:0;background:rgba(26,21,15,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
#panel[hidden]{display:none}
#panel .sheet{width:100%;max-width:480px;max-height:78%;overflow-y:auto;
  background:var(--paper);border-radius:16px 16px 0 0;padding:12px 12px 20px;
  border-top:2px solid var(--gold);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{display:flex;align-items:center;margin-bottom:10px}
.sheethead b{font-size:16px}
.sheethead button{margin-left:auto;border:0;background:var(--paper2);color:var(--ink2);
  border-radius:8px;padding:7px 13px;font:800 12.5px inherit;cursor:pointer}

.maxed{margin-top:8px;padding:8px;border-radius:8px;background:var(--paper);
  text-align:center;font:700 12px inherit;color:var(--ink3)}
/* 승급 — 마을이 다 찬 뒤의 다음 목표 */
.promo{margin-top:12px;border:1.5px solid var(--gold);border-radius:12px;
  padding:12px;background:var(--paper2)}
.promo.done{text-align:center;font:800 13px inherit;color:var(--gold);border-style:dashed}
.promo .ph{font:800 14px inherit;margin-bottom:3px}
.promo .ph b{color:var(--gold)}
.promo .pd{font-size:11.5px;color:var(--ink3);margin-bottom:9px}
.promo .req{font-size:12px;color:var(--ink3);padding:3px 0;font-weight:700}
.promo .req.on{color:var(--jade)}
.promo button{margin-top:9px}

/* 손님 도감 */
.gh2{font:800 13px inherit;color:var(--ink2);margin-bottom:9px}
.gh2 b{color:var(--gold)}
.grow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 11px;font-size:12.5px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper2);margin-bottom:7px}
.grow.off{border-style:dashed;background:transparent;color:var(--ink3)}
.grow .gf{font-size:19px;width:24px;text-align:center}
.grow.off .gf{color:var(--ink3);font-weight:800}
.grow .gn{font-weight:800;min-width:46px}
.grow .gr{font-weight:800;color:var(--gold)}
.grow .gr.top{color:var(--jade)}
.grow .gl{margin-left:auto;color:var(--ink3);font-size:11px}
.grow .gsub{flex-basis:100%;color:var(--ink2);font-size:11.5px;margin-left:31px}
.grow .gsub.gnum{color:var(--ink3);font-size:10.5px;margin-top:1px}

/* 마을 의뢰 · 젬 */
#gems{color:var(--jade);font-weight:800}
.qrow{position:relative;overflow:hidden;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper2);padding:10px 11px;margin-bottom:7px}
.qrow .qbar{position:absolute;left:0;top:0;bottom:0;background:rgba(60,140,110,.18);
  transition:width .3s}
.qrow .qin{position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px}
.qrow .qv{font-weight:800;min-width:76px}
.qrow .qw{font-weight:800;color:var(--gold)}
.qrow .qg{margin-left:auto;font-weight:800;color:var(--jade)}
.qrow .qn{position:relative;margin-top:4px;font-size:11px;color:var(--ink3);font-weight:700}
.qempty{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;
  font:700 12px inherit;color:var(--ink3);margin-bottom:7px}
.gup{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--paper2);padding:9px 11px;margin-bottom:7px;font-size:12.5px}
.gup .uf{font-size:19px;width:24px;text-align:center}
.gup .un{font-weight:800}
.gup .ud{flex-basis:100%;color:var(--ink2);font-size:11px;margin-left:33px;margin-top:-4px}
.gup{flex-wrap:wrap}
.gup button{margin-left:auto;border:0;background:var(--jade);color:#fff8ec;border-radius:8px;
  padding:8px 12px;font:800 12px inherit;cursor:pointer;white-space:nowrap}
.gup button:disabled{background:#c9bb9f;color:#8d8069}
.gup.done{border-style:dashed;background:transparent;color:var(--ink3)}
/* 버튼 줄. 앞선 규칙의 width:100%를 반드시 풀어야 한다 —
 * 안 풀면 한쪽이 396px를 먹고 다른 쪽이 40px로 눌려 글자가 줄바꿈되며
 * 줄 높이가 141px까지 늘어난다. */
#autobar{display:flex;gap:7px;padding:0 12px}
#autobar button{flex:1;width:auto;min-width:0;white-space:nowrap}
#autobar button.ghost{flex:0 0 auto;background:var(--paper2);color:var(--ink2);
  border:1.5px solid var(--line)}

.locked-item{background:transparent;border:1.5px dashed var(--line);color:var(--ink3)}
.locked-item .nm{color:var(--ink2)}
.open-btn{background:var(--jade)}
.hint{font-size:11.5px;color:var(--ink3);text-align:center;padding:18px 10px;line-height:1.6}

/* 마을 */
.village{display:grid;gap:8px}
.plot{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--paper2);
  display:flex;align-items:center;gap:11px}
.plot.ruin{border-style:dashed;background:transparent;opacity:.75}
.plot .sign{font-size:22px;width:34px;text-align:center;color:var(--gold);font-weight:800}
.plot.ruin .sign{color:var(--ink3)}
.plot .nm{font-weight:800;font-size:15px}
.plot .ds{font-size:11.5px;color:var(--ink3)}
.plot .act{margin-left:auto}
.plot button{border:0;background:var(--jade);color:#fff;border-radius:8px;padding:8px 13px;
  font:800 12.5px inherit;cursor:pointer}
.plot button:disabled{background:#c9bb9f;color:#8d8069}
/* 자동 강화. 손으로 1986번 누르던 걸 없애는 물건이라 마을 화면 맨 위에 둔다. */
.autobox{border:1.5px solid var(--gold);border-radius:10px;padding:11px 12px;
  background:var(--paper2);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.autobox .nm{font-weight:800;font-size:14px}
.autobox .ds{font-size:11.5px;color:var(--ink3)}
.autobox button{margin-left:auto;border:0;background:var(--gold);color:#fff8ec;
  border-radius:8px;padding:8px 13px;font:800 12.5px inherit;cursor:pointer;white-space:nowrap}
.autobox button:disabled{background:#c9bb9f;color:#8d8069}
.autobox.on{border-style:solid;border-color:var(--jade);color:var(--jade);
  font-weight:700;font-size:12.5px;display:block}

#log{font-size:11.5px;color:var(--ink3);padding:10px 2px 0;line-height:1.75}
#log div{padding:1px 0}
#log .ask{color:var(--gold);font-weight:700}
#log .shop{color:var(--jade);font-weight:700}
#log .milestone{color:var(--red);font-weight:700}

#float{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:5}
.fly{position:absolute;font:800 14px inherit;color:var(--jade);animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-38px)}}

#offline{position:fixed;inset:0;background:rgba(26,21,15,.82);display:flex;align-items:center;
  justify-content:center;z-index:20;padding:20px}
#offline .card{background:var(--paper);border:2px solid var(--gold);border-radius:14px;
  padding:22px;max-width:330px;text-align:center}
#offline h3{margin:0 0 8px;font-size:17px}
#offline p{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.6}
#offline button{width:100%;border:0;background:var(--gold);color:#fff8ec;border-radius:9px;
  padding:12px;font:800 14px inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="knobs">
      <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
    </div>
    <div class="title">너구리 만물상</div>
    <div class="money" id="money">0</div>
    <div class="sub">
      <span id="ips">초당 0</span>
      <span id="gems">💎 0</span>
      <span id="shopcount"></span>
    </div>
  </header>
  <div id="guest"><span class="face">🐰</span><span class="say">토끼가 가게를 기웃거린다…</span></div>
  <div id="autobar"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>
<div id="panel" hidden><div class="sheet">
  <div class="sheethead"><b id="ptitle"></b><button id="pclose">닫기</button></div>
  <div id="pbody"></div>
</div></div>

    const k = '__probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch (_) {
    return false;
  }
}

const persistent = typeof window !== 'undefined' && probe();

const Store = {
  persistent,

  get(key, fallback = null) {
    try {
      const raw = persistent ? window.localStorage.getItem(key) : memory.get(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (_) {
      return fallback;
    }
  },

  set(key, value) {
    const raw = JSON.stringify(value);
    try {
      if (persistent) window.localStorage.setItem(key, raw);
      else memory.set(key, raw);
    } catch (_) {
      memory.set(key, raw); // 용량 초과(QuotaExceeded)시 메모리로 강등
    }
    return value;
  },

  del(key) {
    try {
      if (persistent) window.localStorage.removeItem(key);
    } catch (_) {}
    memory.delete(key);
  },

  /** 여러 키를 한 번에 읽는다. 세이브 파일 전체를 통째로 다루고 싶을 때. */
  dump(prefix) {
    const out = {};
    const keys = persistent ? Object.keys(window.localStorage) : [...memory.keys()];
    for (const k of keys) if (k.startsWith(prefix)) out[k] = Store.get(k);
    return out;
  },
};

/* ===== core/juice.js ===== */
/* juice.js — 반응 레이어.
 *
 * 게임 로직은 하나도 안 바꾼다. 조작에 대한 "반응"만 얹는다.
 *   소리    · 오디오 파일 없이 Web Audio로 그때그때 합성 (에셋 0개 원칙 유지)
 *   흔들림  · 충돌·성공 순간 화면이 떨림
 *   파티클  · 부서지는 조각, 반짝이
 *   정지    · 충돌 순간 0.05~0.1초 전체 정지. "타격감"의 정체가 이거다
 *   튀어오름· 숫자·아이콘이 커졌다 돌아옴
 *
 * 없어도 게임은 돌아간다. 없으면 죽은 것처럼 느껴진다.
 */

/* ───────────────────────── 소리 ───────────────────────── */

let ac = null, master = null;

/** 브라우저는 사용자가 화면을 건드리기 전엔 소리를 막는다. 첫 입력 때 열어준다. */
function audio() {
  if (ac) {
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.5;
    master.connect(ac.destination);
    return ac;
  } catch (_) {
    return null; // 오디오를 못 써도 게임은 그대로 돌아가야 한다
  }
}

function blip(freq, { to = 0, dur = 0.12, type = 'square', vol = 0.18, delay = 0 } = {}) {
  if (Sfx.muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

/** 폭발·타격용 잡음. 필터를 아래로 쓸어내려 "쿵" 소리를 만든다. */
function noise({ dur = 0.32, vol = 0.3, from = 900, to = 110 } = {}) {
  if (Sfx.muted) return;
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass';
  const t = a.currentTime;
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(master);
  src.start(t);
}

const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28]; // 펜타토닉 — 아무렇게나 쳐도 안 어긋난다
const note = (i) => 220 * Math.pow(2, (SCALE[Math.min(i, SCALE.length - 1)] || 0) / 12);

const Sfx = {
  muted: false,

  /** 첫 사용자 입력에서 호출. 이걸 안 하면 브라우저가 소리를 막는다. */
  unlock() { audio(); },

  toggleMute() {
    Sfx.muted = !Sfx.muted;
    if (master) master.gain.value = Sfx.muted ? 0 : 0.5;
    return Sfx.muted;
  },

  click()   { blip(520, { to: 700, dur: 0.05, type: 'square', vol: 0.10 }); },
  deny()    { blip(150, { to: 90,  dur: 0.16, type: 'sawtooth', vol: 0.14 }); },

  /** 오브 획득 — 연속으로 먹으면 음이 올라가서 콤보처럼 들린다 */
  pickup(step = 0) {
    blip(note(4 + (step % 6)), { to: note(6 + (step % 6)), dur: 0.10, type: 'triangle', vol: 0.16 });
  },

  death() {
    noise({ dur: 0.42, vol: 0.32, from: 1100, to: 80 });
    blip(180, { to: 45, dur: 0.38, type: 'sawtooth', vol: 0.16 });
  },

  /** 머지 — 등급이 오를수록 음이 높아진다. 성장이 귀로 들린다 */
  merge(level = 1) {
    blip(note(level), { to: note(level + 2), dur: 0.13, type: 'square', vol: 0.16 });
    blip(note(level + 4), { dur: 0.10, type: 'triangle', vol: 0.10, delay: 0.06 });
  },

  forge()   { blip(300, { to: 420, dur: 0.09, type: 'square', vol: 0.13 }); },
  coin()    { blip(880, { dur: 0.07, type: 'square', vol: 0.14 });
              blip(1320, { dur: 0.12, type: 'square', vol: 0.12, delay: 0.06 }); },

  /** 칸 뒤집기 — 밝아지면 높은 음, 어두워지면 낮은 음 */
  toggle(on) { blip(on ? 660 : 380, { dur: 0.06, type: 'triangle', vol: 0.13 }); },

  /** 클리어 — 펜타토닉 상행. 3음이면 충분히 "해냈다"로 들린다 */
  win() {
    [0, 2, 4, 7].forEach((s, i) =>
      blip(note(s + 3), { dur: 0.16, type: 'triangle', vol: 0.15, delay: i * 0.075 }));
  },

  reward() {
    [0, 3, 5].forEach((s, i) =>
      blip(note(s + 5), { dur: 0.14, type: 'square', vol: 0.13, delay: i * 0.06 }));
  },
};

/* ─────────────────── 흔들림 · 정지 · 파티클 ─────────────────── */

const parts = [];
const MAX_PARTS = 220; // 무한히 쌓이면 프레임이 떨어진다

const Juice = {
  shakeAmt: 0,
  freezeT: 0,

  /** 화면 흔들림. 8~14가 충돌, 3~5가 작은 반응 */
  shake(a) { Juice.shakeAmt = Math.max(Juice.shakeAmt, a); },

  /** 전체 정지. 충돌 순간 0.05~0.1초. 이게 "타격감"이다 */
  freeze(t) { Juice.freezeT = Math.max(Juice.freezeT, t); },

  /**
   * 파티클 터뜨리기.
   * @param {object} o color(단색 또는 배열) · count · speed · life · size · gravity · spread
   */
  burst(x, y, o = {}) {
    const {
      color = '#fff', count = 12, speed = 160, life = 0.6,
      size = 4, gravity = 340, spread = Math.PI * 2, dir = 0, fade = true,
    } = o;
    for (let i = 0; i < count; i++) {
      if (parts.length >= MAX_PARTS) parts.shift();
      const ang = dir + (Math.random() - 0.5) * spread;
      const sp = speed * (0.45 + Math.random() * 0.75);
      parts.push({
        x, y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: life * (0.6 + Math.random() * 0.7), max: life,
        size: size * (0.6 + Math.random() * 0.8),
        gravity, fade,
        color: Array.isArray(color) ? color[(Math.random() * color.length) | 0] : color,
      });
    }
  },

  update(dt) {
    Juice.shakeAmt *= 0.84;
    if (Juice.shakeAmt < 0.25) Juice.shakeAmt = 0;

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  },

  draw(c) {
    for (const p of parts) {
      const k = Math.max(0, p.life / p.max);
      c.globalAlpha = p.fade ? Math.min(1, k * 1.6) : 1;
      c.fillStyle = p.color;
      const s = p.size * (0.35 + k * 0.65);
      c.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    c.globalAlpha = 1;
  },

  clear() { parts.length = 0; Juice.shakeAmt = 0; Juice.freezeT = 0; },
  count() { return parts.length; },
};

/* ───────────────────────── 튀어오름 ─────────────────────────
 * 값이 바뀐 순간 커졌다가 원래대로 돌아오는 배율을 계산한다.
 * G.text 의 size 에 곱해서 쓰면 숫자가 살아난다.
 */
class Pop {
  constructor() { this.t = 0; }
  hit(strength = 1) { this.t = strength; }
  /** @returns {number} 1.0 = 평상시, 1.0 초과 = 커진 상태 */
  scale(dt, amount = 0.35) {
    if (this.t > 0) this.t = Math.max(0, this.t - dt * 4.5);
    return 1 + this.t * amount;
  }
}

/* ===== core/engine.js ===== */
/* engine.js — 초경량 캔버스 엔진.
 * Unity/Godot을 안 쓴 이유: 이번 목표는 "게임 만들기"가 아니라 "출시 파이프라인 통과"다.
 * 엔진이 무거우면 빌드·용량·스토어 요구사항에서 시간을 다 잡아먹는다.
 * 이 파일 전체가 8KB 미만이고, 3개 게임이 이걸 공유한다. = 양산 가능한 구조.
 */


class Engine {
  /**
   * @param fit  'contain' 통째로 우겨넣는다 — 남는 쪽에 빈 띠가 생긴다
   *             'width'   가로만 맞추고 세로는 기기가 주는 대로 받는다
   *
   * 세로 게임은 'width'가 맞다. 'contain'으로 두면 iPhone SE에서 좌우 50px,
   * iPad에서 상하 98px씩 빈 띠가 생긴다. 가로만 맞추면 여백이 아예 없고,
   * 세로로 넘치거나 모자란 양은 화면을 밀어 훑는 것으로 흡수된다.
   */
  constructor(canvas, { w = 480, h = 800, bg = '#0b0d17', fit = 'contain' } = {}) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.W = w; this.H = h; this.bg = bg; this.fit = fit;
    // 실제로 보이는 범위(가상 단위). 기기마다 다르므로 장면이 이걸 보고 그린다.
    this.viewW = w; this.viewH = h;
    this.scenes = {}; this.scene = null;
    this.keys = new Set(); this.pointer = { x: 0, y: 0, down: false, justDown: false };
    this.running = false; this.t = 0; this.paused = false;
    this._fit();
    addEventListener('resize', () => this._fit());
    /* 창 크기 말고 **담는 상자**를 지켜본다.
     *
     * 처음엔 resize만 듣고 있었다. 그런데 캔버스를 처음 맞추는 시점이
     * 머리말·버튼 줄이 채워지기 전이라, 상자가 나중에 줄어들어도 캔버스는
     * 처음 잰 크기 그대로 남았다 — 실제로 46px이 더 커서 위 23px은 버튼 줄
     * 뒤로 숨고 아래 23px은 화면 밖으로 나가 있었다. 마을이 계속 잘려 있던 것이다.
     *
     * 상자를 직접 지켜보면 폴더블을 펴고 접거나 키보드가 올라와도 같이 따라간다. */
    if (typeof ResizeObserver !== 'undefined' && canvas.parentElement) {
      new ResizeObserver(() => this._fit()).observe(canvas.parentElement);
    }
    this._bindInput();
  }

  /* 화면 비율 유지 + DPR 대응. 모바일에서 흐릿하게 나오면 리뷰가 나빠진다. */
  _fit() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const box = this.cv.parentElement.getBoundingClientRect();
    const s = this.fit === 'width'
      ? box.width / this.W
      : Math.min(box.width / this.W, box.height / this.H);
    this.scale = s;
    const cw = this.fit === 'width' ? box.width : this.W * s;
    const ch = this.fit === 'width' ? box.height : this.H * s;
    this.viewW = cw / s;
    this.viewH = ch / s;
    this.cv.style.width = cw + 'px';
    this.cv.style.height = ch + 'px';
    this.cv.width = Math.round(cw * dpr);
    this.cv.height = Math.round(ch * dpr);
    this.ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }

  _bindInput() {
    addEventListener('keydown', (e) => {
      if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
      if (!this.keys.has(e.key)) this._justKey = e.key;
      this.keys.add(e.key);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.key));

    const pos = (e) => {
      const r = this.cv.getBoundingClientRect();
      const p = e.touches?.[0] || e;
      return { x: (p.clientX - r.left) / this.scale, y: (p.clientY - r.top) / this.scale };
    };
    const down = (e) => {
      Sfx.unlock(); // 브라우저는 첫 사용자 입력 전엔 소리를 막는다
      Object.assign(this.pointer, pos(e), { down: true, justDown: true });
      e.preventDefault();
    };
    const move = (e) => { Object.assign(this.pointer, pos(e)); };
    const up = () => { this.pointer.down = false; };

    this.cv.addEventListener('mousedown', down);
    this.cv.addEventListener('mousemove', move);
    addEventListener('mouseup', up);
    this.cv.addEventListener('touchstart', down, { passive: false });
    this.cv.addEventListener('touchmove', move, { passive: false });
    addEventListener('touchend', up);
  }

  keyPressed(k) { const j = this._justKey === k; return j; }
  add(name, scene) { this.scenes[name] = scene; scene.engine = this; return this; }

  go(name, data) {
    this.scene?.exit?.();
    this.scene = this.scenes[name];
    this.scene.enter?.(data);
    return this.scene;
  }

  start(name) {
    this.go(name);
    this.running = true;
    let last = performance.now();
    const frame = (now) => {
      if (!this.running) return;
      const dt = Math.min((now - last) / 1000, 0.05); // 탭 전환 후 점프 방지
      last = now; this.t += dt;

      // 히트스톱: 충돌 순간 전체를 멈춘다. 이게 "타격감"의 정체다.
      if (Juice.freezeT > 0) Juice.freezeT -= dt;
      else if (!this.paused) this.scene?.update?.(dt);
      Juice.update(dt);

      const c = this.ctx;
      c.save();
      if (Juice.shakeAmt > 0) {
        const s = Juice.shakeAmt;
        c.translate((Math.random() - 0.5) * s * 2, (Math.random() - 0.5) * s * 2);
      }
      // 흔들려도 가장자리가 비지 않도록 배경을 넉넉히 칠한다
      c.fillStyle = this.bg;
      c.fillRect(-60, -60, this.viewW + 120, this.viewH + 120);
      this.scene?.draw?.(c);
      Juice.draw(c);
      c.restore();

      this.pointer.justDown = false; this._justKey = null;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}

/* ── 그리기 헬퍼. 이미지 에셋 0개로 게임을 만들기 위한 최소 도구 ── */
const G = {
  rect(c, x, y, w, h, fill) { c.fillStyle = fill; c.fillRect(x, y, w, h); },

  round(c, x, y, w, h, r, fill) {
    c.fillStyle = fill; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill();
  },

  circle(c, x, y, r, fill) {
    c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  },

  text(c, s, x, y, { size = 20, fill = '#fff', align = 'center', weight = 600, font = 'system-ui' } = {}) {
    c.fillStyle = fill; c.textAlign = align; c.textBaseline = 'middle';
    c.font = `${weight} ${size}px ${font}`;
    c.fillText(s, x, y);
  },

  glow(c, x, y, r, color) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'transparent');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  },

  /** 버튼 그리고 눌렸는지 반환. 즉시모드 UI — 상태관리 없이 UI를 쓰는 가장 싼 방법 */
  button(c, p, { x, y, w, h, label, fill = '#3b82f6', text = '#fff', size = 20 }) {
    const over = p.x > x && p.x < x + w && p.y > y && p.y < y + h;
    const pressed = over && p.down;
    // 눌린 동안 살짝 작아지고 내려앉는다. 이 2px가 "눌렸다"는 느낌을 만든다.
    const d = pressed ? 2 : 0;
    G.round(c, x + d, y + d, w - d * 2, h - d * 2, 12, over ? lighten(fill) : fill);
    G.text(c, label, x + w / 2, y + h / 2 + d, { size, fill: text });
    const clicked = over && p.justDown;
    if (clicked) Sfx.click();
    return clicked;
  },
};

function lighten(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.min(255, Math.round(v * 1.25));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hit = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ===== art.js ===== */
/* art.js — 그림을 끼우는 자리.
 *
 * 규칙 하나: **그림이 없어도 게임은 그대로 돈다.**
 *
 * 이걸 지키면 32장을 다 그릴 때까지 기다릴 필요가 없다. 토끼 한 장이
 * 들어오면 토끼만 그림이 되고 나머지는 이모지로 남는다. 폰에서 실제
 * 크기로 확인해 가며 한 장씩 넣을 수 있다 — 24장을 다 그린 뒤에
 * "너무 작아서 뭔지 모르겠다"를 발견하면 24장을 다시 그려야 한다.
 *
 * 파일 자리:
 *   art/guests/rabbit.png   손님 12종      64×64
 *   art/items/pick.png      물건 17종      64×112
 *   art/pests/rat.png       나쁜 놈 2종    64×64
 *   art/pests/dog.png       삽살개         64×64
 *
 * 파일명은 content.js의 id 그대로다. 그것 말고 맞출 게 없다.
 *
 * 묶음 파일(artifact)로 낼 때는 그림을 못 불러온다 — 바깥 파일을 막기
 * 때문이다. 그래서 만드는 쪽에서 그림을 글자로 바꿔 심어 두고,
 * 여기서는 그 심어둔 것을 먼저 본다(window.ART_DATA).
 */

const cache = {};

const Art = {
  /** 이 id의 그림을 쓸 수 있으면 그림, 아니면 null. */
  get(kind, id) {
    const key = `${kind}/${id}`;
    const c = cache[key];
    if (c === undefined) { this._start(kind, id, key); return null; }
    return c && c.ok ? c.img : null;
  },

  _start(kind, id, key) {
    cache[key] = null;                        // 두 번 시도하지 않는다
    const data = (typeof window !== 'undefined' && window.ART_DATA) || null;
    const src = data ? data[key] : `art/${kind}/${id}.png`;
    if (data && !src) return;                 // 묶음 안에 없다 = 아직 안 그린 것
    if (typeof Image === 'undefined') return; // 브라우저가 아니면 그림도 없다
    const img = new Image();
    const rec = { img, ok: false };
    img.onload = () => { rec.ok = true; };
    img.onerror = () => { rec.ok = false; };  // 없어도 조용히 넘어간다
    img.src = src;
    cache[key] = rec;
  },
};

/** 그림이 있으면 그리고 true, 없으면 아무것도 안 하고 false.
 *  x·y는 **발끝 가운데**다 — 코드가 발끝 높이로 앞뒤를 가리기 때문이다. */
function drawArt(c, kind, id, x, footY, w, h) {
  const img = Art.get(kind, id);
  if (!img) return false;
  c.drawImage(img, x - w / 2, footY - h, w, h);
  return true;
}

/* ===== sim.js ===== */
/* sim.js — 경제 로직. 그리기 코드가 한 줄도 없다.
 *
 * 파이프라인이 아주 단순하다:
 *   열린 품목마다 각자 타이머가 돌아 재고가 쌓인다 → 손님이 와서 사간다 → 돈
 *
 * 이전 버전(줍기→씻기→팔기)은 버렸다. 손님이 요청하면 칸을 여는 구조가
 * 훨씬 단순하고, 무엇보다 "다음에 뭘 할지"를 게임이 알려준다.
 */


const ALL_ITEMS = SHOPS.flatMap((s) => s.items.map((i) => ({ ...i, shop: s.id })));
const itemById = (id) => ALL_ITEMS.find((i) => i.id === id);

/** 조사 붙이기. '쥐이(가)'처럼 나오면 글이 삭는다.
 *  한글 마지막 글자에 받침이 있으면 앞쪽, 없으면 뒤쪽을 쓴다. */
function josa(word, withJong, without) {
  const c = word.charCodeAt(word.length - 1) - 0xac00;
  const jong = c >= 0 && c <= 11171 && c % 28 !== 0;
  return word + (jong ? withJong : without);
}
const shopById = (id) => SHOPS.find((s) => s.id === id);
const GU = Object.fromEntries(GEM_UPGRADES.map((u) => [u.id, u]));

class Sim {
  constructor(save = null) {
    this.money = 0;
    this.revenue = 0;
    this.t = 0;

    this.shops = ['smith'];              // 되살린 가게
    this.rank = {};                      // 가게 등급 (가게id → 0·1·2). 없으면 0급
    this.items = { pick: { lv: 1, stock: 0, prog: 0 } };  // 열린 품목
    this.asked = [];                     // 손님이 물어본 적 있는(=열 수 있는) 품목
    this.guests = ['rabbit'];
    this.bought = {};                    // 손님별 누적 구매 개수 (화면 표시용)
    this.visits = {};                    // 손님별 누적 방문 횟수 → 단골 등급
    this.sold = 0;
    this.auto = false;                    // 자동 강화를 샀는가
    this.smalls = [];                     // 세워 둔 작은 건물의 번호
    this.guard = false;                   // 삽살개를 들였는가
    this.staff = {};                      // 가게별 직원 수 (점장은 안 센다)
    this.fair = 0;                        // 장이 서 있는 남은 시간(초)
    this.busy = -1;                       // 지금 북적이는 작은 건물 (없으면 -1)
    this._busyT = 0;
    this._fairAcc = 0;
    this._purse = 0;                     // 자동 강화가 쓸 수 있는 몫
    this.events = [];                    // 화면에 띄울 최근 사건

    /* 마을 의뢰와 젬. 의뢰는 마을 단위로 걸린다(손님 한 마리가 아니라).
     * { id, gid, itemId, need, got, gems, t } */
    this.quests = [];
    this.gems = 0;
    this.gemUp = {};                     // 젬으로 산 영구 강화 (id → 레벨)
    this.maxGem = {};                    // 만렙 젬을 이미 준 품목 ('id@등급')
    this._qid = 0;
    this._qCool = QUEST.first;           // 다음 의뢰가 붙기까지 남은 시간
    this.rush = 0;                       // 삯꾼이 남아 있는 시간(초)
    this._questDone = [];                // 이번 틱에 끝난 의뢰 (화면 표시용)

    /* 기다리는 주문. 재고가 모자라도 곧 나올 것 같으면 손님이 기다린다.
     * { id, gid, lines:[{id,n,rem,unit}], want, grumbles, t } */
    this.orders = [];
    this._oid = 0;
    this._hold = {};                     // 계산 중이라 생산이 멈춘 가게 (점장 혼자일 때만)
    this._pestEvents = [];               // 이번 틱에 도둑이 벌인 일 (화면 표시용)

    this._guestAcc = {};
    this._guestGap = {};
    /* 지금 나와 있는 나쁜 놈. 한 번에 하나만.
     * { kind, itemId?, qty?, amount?, left, life } */
    this.pest = null;
    this._pestAcc = {};
    this._pestGap = {};
    this._askAcc = 0;
    for (const g of GUESTS) this._guestAcc[g.id] = 0;

    if (save) Object.assign(this, save);

    /* 주문·계산 멈춤은 나중에 생겼다 — 옛 저장본엔 칸 자체가 없다 */
    if (!Array.isArray(this.orders)) this.orders = [];
    if (!this._hold || typeof this._hold !== 'object') this._hold = {};
    if (typeof this._oid !== 'number') this._oid = 0;

    /* 의뢰·젬도 나중에 생겼다. 옛 저장본엔 칸이 없어서 그냥 두면
     * quests.length가 터지고 gems가 NaN이 된다. */
    if (!Array.isArray(this.quests)) this.quests = [];
    if (typeof this.gems !== 'number') this.gems = 0;
    if (!this.gemUp || typeof this.gemUp !== 'object') this.gemUp = {};
    if (!this.maxGem || typeof this.maxGem !== 'object') this.maxGem = {};
    if (typeof this._qid !== 'number') this._qid = 0;
    if (typeof this._qCool !== 'number') this._qCool = QUEST.first;
    if (typeof this.rush !== 'number') this.rush = 0;
    this._questDone = [];

    /* 저장본에 없는 손님은 **영원히 안 온다.**
     *
     * 누적 시간은 손님별로 따로 센다. 그런데 저장본이 그 표를 통째로
     * 덮어쓰기 때문에, 저장한 뒤에 손님을 추가하면 새 손님 칸이 아예 없다.
     * 그러면 `undefined + dt`가 NaN이 되고, NaN은 어떤 비교도 통과 못 해
     * 그 손님은 한 번도 등장하지 않는다. 화면에는 '마을에 왔다'가 떴는데
     * 실제로는 오지 않는, 찾기 아주 나쁜 종류의 고장이다.
     *
     * 손님이 일곱에서 열둘로 늘었으니 옛 저장본은 전부 여기 걸린다. */
    for (const g of GUESTS) {
      if (typeof this._guestAcc[g.id] !== 'number') this._guestAcc[g.id] = 0;
    }

    /* 옛 저장본에는 visits가 없다. 단골 등급을 개수로 세던 시절이라
     * 그때 사가던 개수로 방문 횟수를 되짚어 준다. 없으면 전원 1성으로
     * 떨어져 몇 시간치 진행이 사라진다. */
    if (save && !save.visits) {
      this.visits = {};
      for (const g of GUESTS) {
        const n = this.bought[g.id];
        if (n) this.visits[g.id] = Math.round(n / (g.qty * 1.8));
      }
    }
  }

  /* ── 품목 ── */
  isOpen(id) { return !!this.items[id]; }
  lv(id) { return this.items[id]?.lv ?? 0; }

  /** 25레벨마다 2배. **판매가**에만 붙는다 — price()에서만 쓰인다.
   * 화면에는 오래도록 '생산 2배'라고 적혀 있었지만 생산은 한 번도 안 빨라졌다. */
  milestone(id) { return Math.pow(MILESTONE_MULT, Math.floor(this.lv(id) / MILESTONE_EVERY)); }

  /** 이 손님이 다음에 올 때까지의 간격(초).
   *
   *  wild가 0이면 every 그대로 — 시계처럼 온다.
   *  wild가 1이면 '초당 1/every 확률로 온다'와 같은 것(지수분포)이 된다.
   *  둘 사이는 섞는다. **어느 쪽이든 평균 간격은 every 그대로**라서
   *  밸런스 표를 다시 잴 필요가 없다. 흔들리기만 한다.
   */
  _gap(g, rng = Math.random) { return this._wildGap(g.every, g.wild || 0, rng); }

  _wildGap(every, w, rng = Math.random) {
    if (w <= 0) return every;
    const e = -Math.log(1 - rng() * 0.999);          // 평균 1인 지수분포
    return Math.max(every * 0.15, every * (1 - w + w * e));
  }

  /* ── 나쁜 놈들 ── */
  pestKind() { return this.pest ? PESTS.find((p) => p.id === this.pest.kind) : null; }

  _pests(dt, rng) {
    if (this.pest) {
      this.pest.left -= dt;
      if (this.pest.left <= 0) this._pestEscape(rng);
      return;
    }
    for (const P of PESTS) {
      if (this.revenue < P.at) continue;
      this._pestAcc[P.id] = (this._pestAcc[P.id] || 0) + dt;
      if (this._pestGap[P.id] == null) this._pestGap[P.id] = this._wildGap(P.every, P.wild, rng);
      if (this._pestAcc[P.id] < this._pestGap[P.id]) continue;
      this._pestAcc[P.id] = 0;
      this._pestGap[P.id] = this._wildGap(P.every, P.wild, rng);
      if (this.pest) continue;              // 이미 하나 나와 있으면 이번엔 거른다
      const born = this._pestBorn(P, rng);
      if (!born) continue;
      this.pest = born;
      this._ev(`${josa(P.name, '이', '가')} ${born.what} — 눌러서 잡아라`, 'pest');
    }
  }

  _pestBorn(P, rng) {
    if (P.steal === 'goods') {
      const pool = Object.keys(this.items).filter((id) => this.items[id].stock > 0);
      if (!pool.length) return null;        // 훔칠 것이 없으면 오지 않는다
      const itemId = pool[Math.floor(rng() * pool.length)];
      const qty = Math.max(1, Math.min(P.max, Math.floor(this.items[itemId].stock * P.take)));
      return { kind: P.id, itemId, qty, left: P.life, life: P.life,
               what: `${this.itemName(itemId)}에 손을 댔다` };
    }
    /* 엽전은 **초당 수입 몇 초치**로 잡는다. 가진 돈의 비율로 하면
     * 아껴 모은 사람만 크게 털린다 — 모으는 게 벌이 되면 안 된다. */
    const amount = Math.floor(this.incomePerSec() * P.take);
    if (amount < 1) return null;
    return { kind: P.id, amount, left: P.life, life: P.life,
             what: `엽전 ${fmt(amount)}닢을 노린다` };
  }

  /* ── 삽살개 ── */
  canBuyGuard() { return !this.guard && this.money >= GUARD.cost; }
  buyGuard() {
    if (!this.canBuyGuard()) return false;
    this.money -= GUARD.cost;
    this.guard = true;
    this._ev(`${GUARD.name}을 들였다 — 자리를 비워도 지켜준다`, 'shop');
    return true;
  }

  _pestEscape(rng = Math.random) {
    const t = this.pest;
    const P = PESTS.find((p) => p.id === t.kind);
    const where = { kind: t.kind, itemId: t.itemId || null };
    this.pest = null;

    /* 삽살개가 대신 문다. 직접 잡을 때보다 벌금이 훨씬 적고, 놓치기도 한다 —
     * 개가 더 잘 잡으면 아무도 화면을 안 보게 된다. */
    if (this.guard && rng() < GUARD.rate) {
      const worth = P.steal === 'goods' ? this.price(t.itemId) * t.qty : t.amount;
      const gain = Math.floor(worth * GUARD.fine);
      this.money += gain;
      this.revenue += gain;
      this._ev(`${GUARD.name}가 ${josa(P.name, '을', '를')} 물었다 — 벌금 엽전 ${fmt(gain)}닢`, 'guard');
      this._pestEvents.push({ ...where, result: 'guard', amount: gain });
      return;
    }
    if (P.steal === 'goods') {
      const it = this.items[t.itemId];
      const n = it ? Math.min(it.stock, t.qty) : 0;
      if (it) it.stock -= n;
      this._ev(`${josa(P.name, '이', '가')} ${this.itemName(t.itemId)} ${n}개를 훔쳐 달아났다`, 'pest');
      this._pestEvents.push({ ...where, result: 'stolen', amount: -Math.floor(this.price(t.itemId) * n) });
    } else {
      const n = Math.min(this.money, t.amount);
      this.money -= n;
      this._ev(`${josa(P.name, '이', '가')} 엽전 ${fmt(n)}닢을 채 갔다`, 'pest');
      this._pestEvents.push({ ...where, result: 'stolen', amount: -n });
    }
  }

  /** 잡았다. 훔치려던 것은 그대로 남고 벌금을 받는다.
   *  손해를 막는 게 아니라 이득을 줍는 구조여야 한다 — 안 보고 있어도
   *  잃는 건 작고, 보고 있으면 버는 게 크다. */
  catchPest(rng = Math.random) {
    const t = this.pest;
    if (!t) return null;
    const P = PESTS.find((p) => p.id === t.kind);
    this.pest = null;
    const worth = P.steal === 'goods' ? this.price(t.itemId) * t.qty : t.amount;
    const gain = Math.floor(worth * P.fine);
    this.money += gain;
    this.revenue += gain;
    /* 잡을 때 가끔 젬 한 알. 도둑질 자체는 게임 안의 자잘한 몸짓이라
     * 그것만으로는 목표가 못 된다 — 젬이 붙어야 잡을 이유가 생긴다. */
    let gem = 0;
    if (rng() < GEM.catchRate) { gem = 1; this.gems += 1; }
    this._ev(`${josa(P.name, '을', '를')} 잡았다 — 벌금 엽전 ${fmt(gain)}닢${gem ? ' · 💎1' : ''}`, 'catch');
    return { kind: t.kind, gain, gem };
  }

  /* ── 단골 20성 ── */
  /** i성에 오르는 데 필요한 **방문 횟수**.
   *
   *  개수로 세면 안 된다. 등급이 오르면 한 번에 사가는 개수가 늘고, 그러면
   *  다음 등급이 더 빨리 온다 — 눈덩이가 굴러서 두 시간 만에 12성이 됐다.
   *  실제로 그렇게 만들어 재보니 진열대가 다시 텅 비었다(못채움 28%).
   *  방문 횟수는 등급이 올라도 안 늘어나므로 눈덩이가 안 생긴다.
   *
   *  REGULARS[i].at은 초 단위라 손님의 오는 간격으로 나눈다. 그래서
   *  **누구든 마을에 온 뒤 같은 시간이 흐르면 같은 성**이 된다 —
   *  400초마다 오는 호랑이가 영원히 뜨내기로 남지 않는다. */
  regularNeed(gid, i) {
    const g = GUESTS.find((x) => x.id === gid);
    if (!g) return REGULARS[i].at;
    return Math.max(1, Math.round(REGULARS[i].at / g.every));
  }
  regularLv(gid) {
    const n = this.visits[gid] || 0;
    let lv = 0;
    for (let i = 1; i < REGULARS.length; i++) if (n >= this.regularNeed(gid, i)) lv = i;
    return lv;
  }
  regularName(gid) { return REGULARS[this.regularLv(gid)].name; }
  /** 몇 성인가 (1성부터 센다 — 화면에 그대로 보여준다) */
  regularStar(gid) { return this.regularLv(gid) + 1; }
  /** 다음 등급까지 남은 방문 횟수 (최고 등급이면 null) */
  regularLeft(gid) {
    const lv = this.regularLv(gid);
    return lv >= REGULARS.length - 1 ? null : this.regularNeed(gid, lv + 1) - (this.visits[gid] || 0);
  }
  /** 모든 손님의 단골 등급 합계. 가게 승급 조건에 쓴다. */
  regularSum() { return this.guests.reduce((a, g) => a + this.regularLv(g), 0); }

  /**
   * 이 가게에 **지금 들어가서 할 일**이 몇 개인가.
   *
   * 들락날락하는 수고 때문에 유저가 떠나는 걸 막는 방법은 하나다 —
   * **들어갈 이유가 없으면 안 들어가게 하는 것.** 지도에서 이 수를 표로
   * 띄우면 "혹시 뭐 있나" 하고 들여다볼 일이 없어진다.
   *
   * 강화는 안 센다. 그건 늘 할 수 있어서 표가 항상 켜져 있게 되고,
   * 항상 켜진 표는 없는 것과 같다. 자동 강화를 사면 아예 할 필요도 없다.
   */
  shopTodo(shopId) {
    const shop = SHOPS.find((s) => s.id === shopId);
    if (!shop || !this.shops.includes(shopId)) return 0;
    let n = 0;
    for (const it of shop.items) if (this.canOpenItem(it.id)) n++;
    if (this.canPromote(shopId)) n++;
    if (this.canHireStaff(shopId)) n++;
    return n;
  }

  /* ── 직원 ──
   * 점장 혼자 만들고 팔다가, 직원을 들이면 그 가게 생산이 빨라진다.
   * 한 명당 +22%. 자리 수는 등급이 정한다(무쇠 1 · 참쇠 2 · 강철 3). */
  staffOf(shopId) { return this.staff[shopId] || 0; }
  /* 고용은 **승급을 안 기다린다.** 예전엔 참쇠급부터 열었는데, 승급 조건이
   * 다섯 가지라 두 시간 가까이 걸린다 — 그동안 손님은 물건이 없어 빈손으로
   * 돌아간다. 일손이 필요한 건 바로 그 구간이다. 이제 돈만 있으면 뽑는다.
   *
   * 몇 명까지 두는가는 재서 정했다 — **한 명**이다. 자세한 수치는
   * content.js의 STAFF에 적어 뒀다(둘째부터는 매출도 기다림도 안 바뀐다). */
  staffMax(shopId) { return this.shops.includes(shopId) ? STAFF.max : 0; }

  staffCost(shopId) {
    const shop = SHOPS.find((s) => s.id === shopId);
    const n = this.staffOf(shopId);            // 다음이 n+1번째
    const base = n === 0 ? shop.promote[0] : shop.promote[1];
    return Math.floor(base * STAFF.costMul[n]);
  }

  canHireStaff(shopId) {
    return this.shops.includes(shopId) &&
           this.staffOf(shopId) < this.staffMax(shopId) &&
           this.money >= this.staffCost(shopId);
  }

  hireStaff(shopId) {
    if (!this.canHireStaff(shopId)) return false;
    this.money -= this.staffCost(shopId);
    this.staff[shopId] = this.staffOf(shopId) + 1;
    const shop = SHOPS.find((s) => s.id === shopId);
    this._ev(`${shop.name}에 일손을 들였다 (${this.staff[shopId]}명)`, 'shop');
    return true;
  }

  /** 이 가게에 매대가 몇 칸 있나 — 마당 크기가 정한다.
   *  무쇠급 3×3 마당 = 4칸, 참쇠급 4×4 = 6칸, 강철급 5×5 = 8칸.
   *  "품목을 늘리려면 대장간2를 지어야 하나"에 대한 답이 이것이다 —
   *  둘째 대장간이 아니라 **같은 마당이 넓어진다**. */
  stallCap(shopId) {
    return 4 + 2 * Math.min(2, this.rankOf(shopId));
  }

  /** 매대가 아직 없는 품목인가 (승급해야 자리가 생긴다) */
  _noStall(item) {
    const shop = SHOPS.find((s) => s.id === item.shop);
    const idx = shop.items.findIndex((i) => i.id === item.id);
    return idx >= this.stallCap(item.shop);
  }

  /* ── 가게 등급 ── */
  rankOf(shopId) { return this.rank[shopId] || 0; }
  rankOfItem(id) { return this.rankOf(itemById(id).shop); }

  /** 화면에 보이는 이름. 돌도끼 → 쇠도끼 → 강철도끼 */
  itemName(id) {
    const it = itemById(id);
    return shopById(it.shop).ranks[this.rankOf(it.shop)] + it.name;
  }

  /** 이 품목이 지금 등급에서 올릴 수 있는 최대 레벨 */
  maxLv(id) { return RANKS[this.rankOfItem(id)].maxLv; }
  atMax(id) { return this.lv(id) >= this.maxLv(id); }

  price(id) {
    const it = itemById(id);
    // 선형 증가 × 이정표 × 등급. 지수로 올리면 비용 곡선을 추월해 폭주한다.
    return Math.floor(it.price * RANKS[this.rankOfItem(id)].priceMul
      * (1 + LEVEL.priceStep * (this.lv(id) - 1)) * this.milestone(id) * this.haggle());
  }

  craftTime(id) {
    const it = itemById(id);
    const f = Math.max(LEVEL.timeFloor, Math.pow(LEVEL.timeReduce, this.lv(id) - 1));
    return it.time * f * this.forgeMul();
  }

  /** 이 품목의 진열대 상한. 직원 한 명이 진열대 10칸을 더 본다.
   *
   *  처음엔 직원을 '생산 +22%'로 만들었다 — 진열대의 25%가 꽉 찬 채
   *  생산이 멈췄다. 공급·수요를 몇 시간 재서 맞춰 놨는데 공급만 22%씩
   *  올리면 그 균형이 통째로 무너진다. 진열대 확장은 초반을 안 건드리고,
   *  쌓아둔 것이 후반 큰손(곰·호랑이)의 싹쓸이를 받아내게 한다. */
  capOf(id) {
    return STOCK_CAP + STAFF.capAdd * this.staffOf(itemById(id).shop);
  }

  /** 초당 수입 — 재고가 안 넘친다는 가정 하의 이론값 */
  incomePerSec() {
    let s = 0;
    for (const id of Object.keys(this.items)) s += this.price(id) / this.craftTime(id);
    return s;
  }

  /** lv레벨에서 다음 한 레벨을 올리는 값 */
  _stepCost(id, lv) {
    // 등급이 오르면 값도 같이 올라야 한다. 안 그러면 3급 레벨업이 공짜가 된다.
    const base = Math.max(20, itemById(id).price * RANKS[this.rankOfItem(id)].priceMul * 4);
    return Math.floor(base * Math.pow(LEVEL.costGrowth, lv - 1));
  }

  levelCost(id) { return this._stepCost(id, this.lv(id)); }

  /** n레벨을 한 번에 올리는 총액. 한 레벨씩 n번 올릴 때와 **정확히 같다** —
   * 묶음 버튼은 손가락을 아끼는 편의일 뿐, 할인도 손해도 아니어야 한다. */
  levelCostMany(id, n) {
    let sum = 0;
    const lv = this.lv(id);
    for (let k = 0; k < n; k++) sum += this._stepCost(id, lv + k);
    return sum;
  }

  /** 지금 가진 돈으로 몇 레벨까지 올릴 수 있나 */
  affordableLevels(id) {
    if (!this.isOpen(id)) return 0;
    let left = this.money, n = 0;
    const lv = this.lv(id);
    const room = this.maxLv(id) - lv;
    while (n < Math.min(MAX_BULK, room)) {
      const c = this._stepCost(id, lv + n);
      if (c > left) break;
      left -= c; n++;
    }
    return n;
  }

  /**
   * n레벨을 한 번에 올린다. 돈이 모자라면 살 수 있는 만큼만 올리고,
   * 실제로 오른 레벨 수를 돌려준다.
   *
   * 이게 필요한 이유: 6시간 플레이에 레벨업 클릭이 1945번 나왔다.
   * 의미 있는 선택(새 가게·새 품목)은 14번뿐이었다. 나머지는 전부 손가락 노동이다.
   */
  levelUpMany(id, want) {
    const n = Math.min(want, this.affordableLevels(id), this.maxLv(id) - this.lv(id));
    if (n <= 0) return 0;
    this.money -= this.levelCostMany(id, n);
    const before = Math.floor(this.lv(id) / MILESTONE_EVERY);
    this.items[id].lv += n;
    const after = Math.floor(this.lv(id) / MILESTONE_EVERY);
    if (after > before) this._ev(`${itemById(id).name} ${this.lv(id)}레벨 — 값이 2배!`, 'milestone');
    this._checkMax(id);
    return n;
  }

  levelUp(id) { return this.levelUpMany(id, 1) === 1; }

  /** 손님이 물어본 적 있는 품목만, 매대가 있어야 열 수 있다 */
  canOpenItem(id) {
    return !this.isOpen(id) && this.asked.includes(id) &&
           this.shops.includes(itemById(id).shop) && this.money >= itemById(id).cost &&
           !this._noStall(itemById(id));
  }

  openItem(id) {
    if (!this.canOpenItem(id)) return false;
    this.money -= itemById(id).cost;
    this.items[id] = { lv: 1, stock: 0, prog: 0 };
    this._ev(`${itemById(id).name} 칸을 열었다`, 'open');
    return true;
  }

  /* ── 자동 강화 ── */
  canBuyAuto() { return !this.auto && this.money >= AUTO_COST; }

  buyAuto() {
    if (!this.canBuyAuto()) return false;
    this.money -= AUTO_COST;
    this.auto = true;
    this._ev('장부를 정리했다 — 이제 알아서 강화된다', 'shop');
    return true;
  }

  /**
   * 버는 돈의 일부를 따로 모아, 그 몫으로 제일 싼 품목부터 알아서 강화한다.
   *
   * 기준이 '남은 돈'이 아니라 **버는 속도**인 게 핵심이다. 남은 돈을 기준으로
   * 하면 다음 목표가 비쌀수록 강화가 멈춰버린다 — 실제로 그렇게 만들었다가
   * 약재상(200억)을 모으는 동안 수입이 몇 시간째 제자리였다.
   * 지금은 6할이 강화로 나가고 4할은 늘 쌓이므로 저축과 성장이 같이 간다.
   */
  _autoLevel() {
    if (!this.auto) return 0;

    let budget = Math.min(this._purse, this.money);
    if (budget <= 0) return 0;

    let done = 0;
    while (done < AUTO_PER_TICK) {
      let best = null, bestCost = Infinity;
      for (const id of Object.keys(this.items)) {
        if (this.atMax(id)) continue;              // 만렙은 건드리지 않는다
        const c = this.levelCost(id);
        if (c < bestCost) { bestCost = c; best = id; }
      }
      if (!best || bestCost > budget) break;
      budget -= bestCost;
      this._purse -= bestCost;
      this.money -= bestCost;
      const before = Math.floor(this.lv(best) / MILESTONE_EVERY);
      this.items[best].lv++;
      if (Math.floor(this.lv(best) / MILESTONE_EVERY) > before) {
        this._ev(`${itemById(best).name} ${this.lv(best)}레벨 — 값이 2배!`, 'milestone');
      }
      this._checkMax(best);
      done++;
    }
    return done;
  }

  /* ── 가게 승급 ── */

  /**
   * 승급 조건을 하나씩 따져 목록으로 돌려준다.
   * 화면에서 "무엇이 모자란가"를 그대로 보여주기 위해 boolean이 아니라
   * 항목별 결과를 넘긴다 — 못 하는 이유가 안 보이면 목표가 되지 못한다.
   */
  promoteReqs(shopId) {
    const shop = shopById(shopId);
    const r = this.rankOf(shopId);
    const next = RANKS[r + 1];
    if (!next) return null;                       // 이미 최고 등급

    /* '모든 칸'은 **지금 있는 매대**까지다. 전 품목으로 걸면 5번째 칸이
     * 승급해야 생기는데 승급 조건이 5번째 칸이라 서로를 영원히 기다린다 —
     * 실제로 그렇게 잠겨서 10시간 내내 무쇠급에 머물렀다. */
    const have = shop.items.slice(0, this.stallCap(shopId));
    const allOpen = have.every((it) => this.isOpen(it.id));
    const allMax = allOpen && have.every((it) => this.atMax(it.id));
    const i = SHOPS.findIndex((x) => x.id === shopId);
    const after = SHOPS[i + 1];
    const ips = this.incomePerSec();
    const cost = shop.promote[r];
    return {
      rank: r + 1,
      cost,
      list: [
        { ok: allMax, text: `지금 있는 매대 ${have.length}칸을 전부 ${RANKS[r].maxLv}레벨까지` },
        { ok: !after || this.shops.includes(after.id), text: after ? `${after.name} 열기` : '—' },
        { ok: this.regularSum() >= next.guests,
          text: `손님 단골 등급 합계 ${next.guests} (지금 ${this.regularSum()})` },
        { ok: ips >= next.ips, text: `초당 🪙${fmt(next.ips)} (지금 🪙${fmt(ips)})` },
        { ok: this.money >= cost, text: `승급값 🪙${fmt(cost)}` },
      ].filter((x) => x.text !== '—'),
    };
  }

  canPromote(shopId) {
    const r = this.promoteReqs(shopId);
    return !!r && r.list.every((x) => x.ok);
  }

  /**
   * 승급. 레벨은 1로 돌아가지만 밑천이 통째로 좋아진다 — 이 가게만의 작은 환생이다.
   * 재고는 남긴다. 승급했다고 진열대가 비면 손해 본 느낌만 남는다.
   */
  promote(shopId) {
    if (!this.canPromote(shopId)) return false;
    const shop = shopById(shopId);
    this.money -= shop.promote[this.rankOf(shopId)];
    this.rank[shopId] = this.rankOf(shopId) + 1;
    for (const it of shop.items) {
      if (this.items[it.id]) this.items[it.id].lv = 1;
    }
    this._ev(`${josa(shop.name, '이', '가')} ${shop.ranks[this.rankOf(shopId)]} 등급으로 올라섰다`, 'milestone');
    return true;
  }

  /* ── 가게 ── */
  nextShop() { return SHOPS.find((s) => !this.shops.includes(s.id)) || null; }

  openShop(id) {
    const s = shopById(id);
    if (!s || this.shops.includes(id) || this.money < s.cost) return false;
    this.money -= s.cost;
    this.shops.push(id);
    const first = s.items[0];
    this.items[first.id] = { lv: 1, stock: 0, prog: 0 };
    if (!this.asked.includes(first.id)) this.asked.push(first.id);
    this._ev(`${josa(s.name, '이', '가')} 다시 문을 열었다`, 'shop');
    return true;
  }

  /* ── 작은 건물 ── */
  canBuildSmall(i) {
    return SMALL_SHOPS[i] && !this.smalls.includes(i) && this.money >= SMALL_SHOPS[i].cost;
  }

  buildSmall(i) {
    if (!this.canBuildSmall(i)) return false;
    this.money -= SMALL_SHOPS[i].cost;
    this.smalls.push(i);
    this._ev(`${josa(SMALL_SHOPS[i].name, '을', '를')} 세웠다`, 'shop');
    return true;
  }

  /** 아직 안 세운 것 중 제일 싼 것 */
  nextSmall() {
    for (let i = 0; i < SMALL_SHOPS.length; i++) if (!this.smalls.includes(i)) return i;
    return -1;
  }

  /**
   * 북적이는 작은 건물을 눌렀다 → 장이 선다.
   * 북적이지 않는 곳을 누르면 아무 일도 없다.
   */
  tapSmall(idx) {
    if (idx !== this.busy) return false;
    this.busy = -1;
    this.fair = FAIR.boost;
    this._ev('장이 섰다 — 손님이 몰린다!', 'shop');
    return true;
  }


  /* ── 젬 강화 ──
   * 지금은 화면을 새로 안 만들어도 되는 것만 판다. 뽑기·룰렛·스킨은
   * 새 화면이 필요해서 엔진을 옮긴 뒤로 미뤘다(PLAN.md 참고). */
  upLv(id) { return this.gemUp[id] || 0; }
  /** 다음 한 단계의 젬 값. 다 올렸으면 null */
  gemCost(id) {
    const u = GU[id]; const lv = this.upLv(id);
    return !u || lv >= u.max ? null : u.cost[lv];
  }
  canBuyGemUp(id) { const c = this.gemCost(id); return c != null && this.gems >= c; }
  buyGemUp(id) {
    if (!this.canBuyGemUp(id)) return false;
    this.gems -= this.gemCost(id);
    this.gemUp[id] = this.upLv(id) + 1;
    this._ev(`${GU[id].name} ${this.upLv(id)}단계`, 'gem');
    return true;
  }

  /** 모든 물건 값에 곱한다. **레벨업 비용에는 안 곱한다** —
   *  값이 오르는 만큼 비용도 오르면 아무것도 안 산 것과 같아진다. */
  haggle() { return 1 + GU.haggle.step * this.upLv('haggle'); }
  /** 만드는 시간을 줄인다. 곱으로만 줄이므로 0에 못 닿는다. */
  forgeMul() { return 1 - GU.forge.step * this.upLv('forge'); }
  /** 점장 혼자인 가게가 계산하느라 망치를 놓는 시간.
   *
   *  여기 붙인 이유: 장을 자주 열어 손님을 두 배로 부르면 매출이 오히려
   *  **떨어졌다.** 계산 횟수가 두 배가 되면서 이 멈춤도 두 배가 됐기
   *  때문이다(content.js의 ★ 참고). 이 게임의 진짜 병목이 여기다. */
  servePause() { return Math.max(0.2, SERVICE.servePause - GU.hands.step * this.upLv('hands')); }

  /** 삯꾼을 부른다 — 잠깐 생산이 두 배가 된다.
   *  이미 부려 놓았으면 못 부른다. 겹쳐 쓰면 시간만 덮어써서 손해인데
   *  유저는 그걸 모른 채 잃는다. */
  canRush() { return this.rush <= 0 && this.gems >= GEM.rush.cost; }
  callRush() {
    if (!this.canRush()) return false;
    this.gems -= GEM.rush.cost;
    this.rush = GEM.rush.secs;
    this._ev(`삯꾼을 불렀다 — ${GEM.rush.secs}초 동안 생산 ${GEM.rush.mult}배`, 'gem');
    return true;
  }

  /* ── 마을 의뢰 ── */

  /** 의뢰를 건 마을은 **그 물건을 먼저 집는다.** _buy에서 쓴다.
   *
   *  이게 없으면 의뢰가 마을마다 터무니없이 불공평해진다. 곰은 한 종류를
   *  통째로 쓸어가는(spread 1) 손님이라, 열린 칸이 15개면 원하는 물건을
   *  집을 확률이 15분의 1이다. 실제로 재보니 토끼마을 의뢰는 6분,
   *  곰마을은 25분, 소마을은 37분이 걸렸다 — 개수를 아무리 줄여도
   *  '언제 그 물건을 집느냐'가 시간을 정해버리기 때문에 안 고쳐진다.
   *
   *  먼저 집게 하면 개수가 곧 시간이 되고, 무엇보다 말이 된다 —
   *  토끼마을이 호미를 청했으면 토끼들이 호미를 사가야 한다. */
  questItemFor(gid) {
    const q = this.quests.find((x) => x.gid === gid);
    return q && this.items[q.itemId] ? q.itemId : null;
  }

  /** 의뢰를 건 마을이 그 품목을 **초당 몇 개** 사가는가.
   *
   *  먼저 집으므로 한 번 올 때 가져가는 개수는 '한 매대에서 집는 몫'
   *  (= 한 번에 사는 개수 ÷ 훑는 종류 수)이다. 오는 간격으로 나누면 속도다.
   *
   *  이 한 줄이 의뢰 설계의 전부다 — 개수를 손으로 정하는 대신 여기서
   *  뽑아내기 때문에, 까치마을이든 호랑이마을이든 걸리는 시간이 비슷해진다. */
  questRate(gid, itemId) {
    const g = GUESTS.find((x) => x.id === gid);
    if (!g || !this.items[itemId]) return 0;
    const qty = Math.max(1, Math.round(g.qty * REGULARS[this.regularLv(gid)].qty));
    return Math.max(1, Math.ceil(qty / (g.spread || BASKET_SPREAD))) / g.every;
  }

  /** 청하는 개수는 눈에 보기 좋게 끊는다. 계산해서 나온 195개보다
   *  200개가 낫다 — 숫자가 목표처럼 읽혀야 한다. */
  _roundNeed(n) {
    if (n < 20) return n;
    if (n < 100) return Math.round(n / 5) * 5;
    if (n < 500) return Math.round(n / 10) * 10;
    return Math.round(n / 50) * 50;
  }

  /** 한 마을에 하나씩만 건다. 같은 마을에 둘을 걸면 어느 쪽이 차는지 헷갈린다. */
  _newQuest(rng = Math.random) {
    const open = Object.keys(this.items);
    const taken = this.quests.map((q) => q.gid);
    const free = this.guests.filter((id) => !taken.includes(id));
    if (!open.length || !free.length) return null;

    const gid = free[Math.floor(rng() * free.length)];
    const itemId = open[Math.floor(rng() * open.length)];
    const rate = this.questRate(gid, itemId);
    if (rate <= 0) return null;

    const need = Math.max(QUEST.min, this._roundNeed(Math.round(QUEST.seconds * rate)));
    /* 젬은 **단골 등급**을 따른다. 걸리는 시간은 위에서 이미 마을마다
     * 같게 맞춰 놨으므로 시간으로 정하면 전부 똑같은 한 알이 된다.
     * 오래 사귄 마을이 더 크게 갚는 편이 '관계'라는 축과도 맞는다. */
    const gems = Math.max(1, Math.min(QUEST.gemCap,
      1 + Math.floor(this.regularLv(gid) / QUEST.gemPerStar)));
    const q = { id: ++this._qid, gid, itemId, need, got: 0, gems, t: 0 };
    this.quests.push(q);
    const g = GUESTS.find((x) => x.id === gid);
    this._ev(`${g.name}마을에서 ${this.itemName(itemId)} ${need}개를 청했다`, 'quest');
    return q;
  }

  /** 판 물건을 의뢰 눈금에 더한다. _settle에서만 부른다 —
   *  즉시 판매든 기다린 주문이든 돈이 오가는 곳은 거기 하나뿐이다. */
  _questGain(gid, itemId, n) {
    const q = this.quests.find((x) => x.gid === gid && x.itemId === itemId);
    if (!q) return;
    q.got += n;
    if (q.got < q.need) return;

    this.quests.splice(this.quests.indexOf(q), 1);
    this._qCool = QUEST.every;
    const coin = Math.floor(this.price(itemId) * q.need * QUEST.payMul);
    this.money += coin;
    this.revenue += coin;
    if (this.auto) this._purse += coin * AUTO_SHARE;
    this.gems += q.gems;
    const g = GUESTS.find((x) => x.id === gid);
    this._ev(`${g.name}마을 의뢰를 마쳤다 — 🪙${fmt(coin)} · 💎${q.gems}`, 'quest');
    this._questDone.push({ ...q, coin, guest: g, item: itemById(itemId) });
  }

  /** 몇 개 남았나 (화면용) */
  questLeft(q) { return Math.max(0, q.need - q.got); }

  /** 지금 등급의 만렙에 닿았으면 젬 한 알. 등급이 오르면 상한도 올라가므로
   *  '품목@등급'으로 따로 센다 — 승급할 때마다 다시 한 번 받는다. */
  _checkMax(id) {
    if (!this.atMax(id)) return;
    const key = `${id}@${this.rankOfItem(id)}`;
    if (this.maxGem[key]) return;
    this.maxGem[key] = 1;
    this.gems += GEM.onMax;
    this._ev(`${josa(this.itemName(id), '이', '가')} 만렙 — 💎${GEM.onMax}`, 'gem');
  }

  /* ── 한 틱 ── */
  tick(dt, rng = Math.random) {
    this.t += dt;

    // 0) 장 — 북적임이 떴다 사라지고, 장이 서 있으면 시간이 줄어든다
    if (this.fair > 0) this.fair = Math.max(0, this.fair - dt);
    if (this.busy >= 0) {
      this._busyT -= dt;
      if (this._busyT <= 0) this.busy = -1;
    } else if (this.fair <= 0 && this.smalls.length) {
      // 세워 둔 곳 중에서만 북적인다
      this._fairAcc += dt;
      if (this._fairAcc >= FAIR.every) {
        this._fairAcc = 0;
        this.busy = this.smalls[Math.floor(rng() * this.smalls.length)];
        this._busyT = FAIR.window;
      }
    }

    // 1) 생산 — 열린 품목이 각자 자기 타이머로 돈다. 손 댈 필요 없음.
    //    단, 점장 혼자인 가게는 계산하는 동안(_hold) 망치를 놓는다.
    //    직원이 있으면 계산 중에도 직원이 계속 만든다 — 고용의 이유 하나 추가.
    for (const k of Object.keys(this._hold)) {
      this._hold[k] -= dt;
      if (this._hold[k] <= 0) delete this._hold[k];
    }
    if (this.rush > 0) this.rush = Math.max(0, this.rush - dt);
    const speed = this.rush > 0 ? GEM.rush.mult : 1;
    for (const id of Object.keys(this.items)) {
      const st = this.items[id];
      const shop = itemById(id).shop;
      if (this.staffOf(shop) === 0 && (this._hold[shop] || 0) > 0) continue;  // 계산 중
      // 진열대가 꽉 차면 멈춘다 — 기다리는 주문이 있으면 그 몫은 계속 만든다
      if (st.stock >= this.capOf(id) && !this._orderRem(id)) continue;
      st.prog += dt * speed;
      const need = this.craftTime(id);
      while (st.prog >= need && (this._orderRem(id) > 0 || st.stock < this.capOf(id))) {
        st.prog -= need;
        // 갓 만든 물건은 기다리는 손님 먼저, 없으면 진열대로
        if (!this._giveToOrder(id)) st.stock++;
      }
    }

    // 1.2) 주문 시계 — 다 만들어졌으면 계산, 너무 오래 끌면 있는 만큼만 계산
    const done = [];
    if (this.orders.length) {
      const finished = [];
      for (const o of this.orders) {
        o.t += dt;
        if (o.lines.every((l) => l.rem <= 0) || o.t >= SERVICE.patience * 2) finished.push(o);
      }
      for (const o of finished) {
        this.orders.splice(this.orders.indexOf(o), 1);
        const g = GUESTS.find((x) => x.id === o.gid) || GUESTS[0];
        done.push(this._settle(g, o.lines, o.want, o.grumbles, o.t, o.id));
      }
    }

    /* 1.5) 나쁜 놈들 — 물건이나 엽전을 집어 들고 도망친다.
     * 이번 틱에 실제로 나가고 들어온 돈을 모아 화면에 넘긴다(−/+ 표). */
    this._pestEvents = [];
    this._questDone = [];
    this._pests(dt, rng);

    // 2) 손님 — 재고에서 여러 종류를 무작위로 담아간다
    const sales = [];
    for (const g of GUESTS) {
      if (!this.guests.includes(g.id)) continue;
      // 장이 서면 손님이 그만큼 자주 온다
      this._guestAcc[g.id] += dt * (this.fair > 0 ? FAIR.mult : 1);
      if (this._guestGap[g.id] == null) this._guestGap[g.id] = this._gap(g, rng);
      while (this._guestAcc[g.id] >= this._guestGap[g.id]) {
        this._guestAcc[g.id] -= this._guestGap[g.id];
        this._guestGap[g.id] = this._gap(g, rng);
        const s = this._buy(g, rng);
        if (s) sales.push(s);
      }
    }

    // 3) 자동 강화 — 다음 목표 값은 남기고 나머지로 알아서 올린다
    const autoLv = this._autoLevel();

    // 4) 손님이 없는 물건을 물어본다 → 그게 다음 목표가 된다
    let ask = null;
    this._askAcc += dt;
    if (this._askAcc >= ASK_EVERY) {
      this._askAcc = 0;
      ask = this._ask(rng);
    }

    // 4.5) 마을 의뢰 — 한 자리가 비면 잠시 뒤 새 의뢰가 붙는다
    for (const q of this.quests) q.t += dt;
    this._qCool -= dt;
    if (this._qCool <= 0) {
      if (this.quests.length < QUEST.slots) this._newQuest(rng);
      this._qCool = QUEST.every;
    }

    // 5) 새 손님이 마을에 온다
    let newGuest = null;
    const ng = GUESTS.find((g) => !this.guests.includes(g.id) && this.revenue >= g.at);
    if (ng) {
      this.guests.push(ng.id);
      newGuest = ng;
      this._ev(`${josa(ng.name, '이', '가')} 마을에 왔다`, 'guest');
    }

    return { sales, done, ask, newGuest, autoLv, pests: this._pestEvents,
             quests: this._questDone };
  }

  /** 이 품목을 기다리는 주문이 모두 몇 개나 남았나 */
  _orderRem(id) {
    let s = 0;
    for (const o of this.orders) for (const l of o.lines) if (l.id === id && l.rem > 0) s += l.rem;
    return s;
  }

  /** 갓 만든 물건 하나를 제일 오래 기다린 주문에 준다. 줄 곳이 없으면 false. */
  _giveToOrder(id) {
    for (const o of this.orders) {
      for (const l of o.lines) {
        if (l.id === id && l.rem > 0) { l.rem--; return true; }
      }
    }
    return false;
  }

  /**
   * 손님이 장바구니에 여러 품목을 **무작위로** 담아간다.
   *
   * 예전엔 제일 비싼 것 한 종류만 사갔다. 그러면 싼 품목은 아무도 안 사서
   * 재고가 상한에 박히고, tick()의 `stock >= STOCK_CAP` 때문에 생산까지 멈췄다.
   * 한 번 멈추면 팔릴 일이 없으니 영영 죽는다 — 15개 중 7개가 그 상태였다.
   *
   * 고친 건 순서가 아니라 **종류 수**였다. 시뮬로 무작위·재고순·재고가중을
   * 나란히 돌려보니 셋 다 정지 0%가 나왔다. 여러 종류를 사기만 하면 안 막힌다.
   * 그래서 제일 재미있는 쪽인 무작위를 고른다 — 손님이 매번 다른 조합을
   * 집어가야 가게가 살아있는 느낌이 난다.
   */
  _buy(g, rng = Math.random) {
    const have = Object.keys(this.items);
    if (!have.length) return null;

    // 단골일수록 많이 사가고 값도 후하게 쳐준다
    const reg = REGULARS[this.regularLv(g.id)];
    const qty = Math.max(1, Math.round(g.qty * reg.qty));
    const pay = g.pay * reg.pay;

    // 무작위로 섞는다 (Fisher-Yates)
    for (let i = have.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [have[i], have[j]] = [have[j], have[i]];
    }

    // 안전장치: 진열대가 꽉 찬 품목만 맨 앞으로 당긴다. 꽉 찬 품목은 생산이
    // 멈춰 있으므로 먼저 비워야 다시 돈다. 지금 수치로는 없어도 안 막히지만,
    // 앞으로 생산·손님 수치를 만지면 다시 막힐 수 있어 보험으로 남긴다.
    // sort는 안정 정렬이라 같은 그룹 안에서는 위에서 섞은 순서가 유지된다.
    have.sort((a, b) =>
      (this.items[b].stock >= this.capOf(b)) - (this.items[a].stock >= this.capOf(a)));

    /* 의뢰를 건 마을은 청한 물건을 **맨 먼저** 집는다.
     * 위 정렬 다음에 놓는 이유: 정렬이 안정 정렬이라 먼저 당겨 놓아도
     * 다시 뒤로 밀린다. 여기서 마지막으로 한 번 더 당긴다. */
    const wantQ = this.questItemFor(g.id);
    if (wantQ) {
      const i = have.indexOf(wantQ);
      if (i > 0) { have.splice(i, 1); have.unshift(wantQ); }
    }

    // 손님마다 훑는 종류 수가 다르다. 곰·멧돼지는 1이라 한 종류를 쓸어간다.
    const per = Math.max(1, Math.ceil(qty / (g.spread || BASKET_SPREAD)));
    const lines = [];      // { id, n(가져갈 총 개수), rem(아직 안 만들어진 것), unit(1개 값) }
    const grumbles = [];   // 너무 오래 걸려서 포기한 것들 — 💢
    let left = qty;

    for (const id of have) {
      if (left <= 0) break;
      const st = this.items[id];
      const wantN = Math.min(left, per);
      if (wantN <= 0) continue;
      const take = Math.min(wantN, st.stock);
      const rem = wantN - take;

      if (rem > 0) {
        /* 모자란 몫을 기다릴지 계산한다. 앞에 기다리는 다른 주문 몫까지
         * 합쳐서 본다 — 안 그러면 다들 기다리다 다 같이 터진다. */
        const waitT = (this._orderRem(id) + rem) * this.craftTime(id);
        if (waitT > SERVICE.patience) {
          if (take > 0) {
            // 있는 것만 사간다 — 기다리기엔 너무 길다
            st.stock -= take; left -= take;
            lines.push({ id, n: take, rem: 0, unit: this.price(id) * pay });
          } else {
            // 빈손 — 💢 남기고 다른 매대를 본다. 만들던 것은 진열대로 간다.
            grumbles.push({ item: itemById(id), n: wantN });
          }
          continue;
        }
        // 기다린다 — 있는 건 지금 집고, 나머지는 주문으로 건다
        st.stock -= take; left -= wantN;
        lines.push({ id, n: wantN, rem, unit: this.price(id) * pay });
        continue;
      }
      if (take <= 0) continue;
      st.stock -= take; left -= take;
      lines.push({ id, n: take, rem: 0, unit: this.price(id) * pay });
    }

    if (!lines.length) {
      if (!grumbles.length) return null;
      // 사고 싶은 게 하나도 없었다 — 가게 앞까지 왔다가 💢 하고 돌아간다
      return { guest: g, lines: [], gain: 0, n: 0, want: qty, grumbles };
    }

    if (lines.some((l) => l.rem > 0)) {
      // 주문 — 돈도 장부도 물건이 다 나온 다음에 움직인다
      const oid = ++this._oid;
      this.orders.push({ id: oid, gid: g.id, lines, want: qty, grumbles, t: 0 });
      return {
        guest: g, orderId: oid, waiting: true, gain: 0, n: 0, want: qty, grumbles,
        lines: lines.map((l) => ({ item: itemById(l.id), n: l.n, gain: Math.floor(l.unit * l.n) })),
      };
    }
    return this._settle(g, lines, qty, grumbles, 0);
  }

  /**
   * 계산대에서 실제로 돈이 오가는 순간. 즉시 판매든 기다린 주문이든
   * 마지막엔 전부 여기를 지난다 — 매출·단골·계산 멈춤이 전부 이 안에 있다.
   */
  _settle(g, lines, want, grumbles, waited, orderId) {
    let gain = 0, n = 0;
    const out = [];
    for (const l of lines) {
      const got = l.n - (l.rem || 0);          // 시간 초과면 못 받은 몫이 남는다
      if (got <= 0) continue;
      const money = Math.floor(l.unit * got);
      gain += money; n += got; this.sold += got;
      out.push({ item: itemById(l.id), n: got, gain: money });
    }
    this.money += gain;
    this.revenue += gain;
    if (this.auto) this._purse += gain * AUTO_SHARE;

    // 점장 혼자인 가게는 계산하는 동안 생산을 멈춘다
    for (const ln of out) {
      if (this.staffOf(ln.item.shop) === 0) this._hold[ln.item.shop] = this.servePause();
    }

    // 이 마을에 건 의뢰가 있으면 판 만큼 눈금이 오른다
    for (const ln of out) this._questGain(g.id, ln.item.id, ln.n);

    if (n > 0) {
      // 단골 등급이 올랐으면 알린다 — 손님이 굳어 있지 않다는 신호다
      const before = this.regularLv(g.id);
      this.bought[g.id] = (this.bought[g.id] || 0) + n;
      this.visits[g.id] = (this.visits[g.id] || 0) + 1;
      const after = this.regularLv(g.id);
      if (after > before) {
        this._ev(`${josa(g.name, '이', '가')} ${after + 1}성 ${josa(REGULARS[after].name, '이', '가')} 되었다`, 'guest');
      }
    }
    return { guest: g, lines: out, gain, n, want, grumbles, waited, orderId };
  }

  /**
   * 아직 안 열린 품목 하나를 물어본다. 이게 다음 목표를 지정한다.
   *
   * 중요: 이미 물어봤는데 아직 안 열어준 게 있으면 새로 안 물어본다.
   * 안 그러면 요청이 3개씩 쌓여서 "다음에 뭘 할지"가 다시 흐려진다 —
   * 요청 구조를 쓰는 이유가 목표를 하나로 좁히는 거였는데 그게 무너진다.
   */
  _ask(rng) {
    const pending = this.asked.some((id) => !this.isOpen(id));
    if (pending) return null;
    const cands = ALL_ITEMS.filter((i) =>
      !this.isOpen(i.id) && !this.asked.includes(i.id) && this.shops.includes(i.shop)
      && !this._noStall(i));   // 매대가 없는 물건을 손님이 조르면 살 수도 없는데 약만 오른다
    if (!cands.length) return null;
    const item = cands[0];                       // 가게 안에서는 순서대로
    const gs = this.guests;
    const guest = GUESTS.find((g) => g.id === gs[gs.length - 1]) || GUESTS[0];
    this.asked.push(item.id);
    const line = ASK_LINES[Math.floor(rng() * ASK_LINES.length)].replace('{item}', item.name);
    this._ev(`${guest.name}: "${line}"`, 'ask');
    return { guest, item, line };
  }

  /** 오프라인 수익. 껐다 켰을 때 쌓여 있어야 다시 켠다. */
  offline(seconds) {
    const real = Math.min(seconds, OFFLINE.capHours * 3600);
    if (real < 60) return null;
    const earned = Math.floor(this.incomePerSec() * real * OFFLINE.efficiency);
    this.money += earned;
    this.revenue += earned;
    if (this.auto) this._purse += earned * AUTO_SHARE;
    return { earned, seconds: real, capped: seconds > OFFLINE.capHours * 3600 };
  }

  _ev(msg, kind) {
    this.events.unshift({ t: this.t, msg, kind });
    this.events.length = Math.min(this.events.length, 40);
  }

  save() {
    const { events, _pestEvents, _questDone, ...rest } = this;
    return JSON.parse(JSON.stringify(rest));
  }
}

/** 큰 숫자. 방치형은 이게 없으면 화면이 터진다.
 *  K·M·B 하나로 간다 — 만·억과 고를 수 있게 해 봤지만, 고르는 게 일이지
 *  얻는 게 없었다. 세 자리마다 끊는 쪽이 게임에서 더 흔하다. */
function fmt(n) {
  n = Math.floor(n);
  if (n < 1000) return String(n);
  const U = ['', 'K', 'M', 'B', 'T', 'Qa'];
  let i = 0, v = n;
  while (v >= 1000 && i < U.length - 1) { v /= 1000; i++; }
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + U[i];
}

/* ===== iso.js ===== */
/* iso.js — 격자 마을. 그리기만 한다. scene.js(세로 두루마리)의 후임.
 *
 * 왜 갈아탔나:
 *   세로 두루마리는 가게가 늘 때마다 마을이 아래로만 길어졌다(1560 → 1750,
 *   가게 열이면 3000). 격자는 가로로도 퍼진다. 그리고 빈 칸이 눈에 보여서
 *   "폐허를 하나씩 채운다"가 지도 자체로 읽힌다.
 *
 * 시점은 비스듬히 내려다본 격자(아이소메트릭)다. 바닥 한 칸은 96×48 —
 * 가로:세로 2:1이 이 시점의 기본 비율이다. 건물은 코드로 그린 상자라서
 * 이 전환에 새 그림이 한 장도 안 들었다. 캐릭터는 그대로 정면을 본다.
 *
 * 여기엔 경제 계산이 한 줄도 없다. sim.js를 읽기만 하고 절대 고치지 않는다.
 */






const VW = 480;                       // 화면 가상 폭 (엔진이 가로를 여기에 맞춘다)
const TW = 96, TH = 48;               // 바닥 한 칸
const GW = 15, GH = 18;                // 마을 크기(칸)

/** 칸 좌표 → 세계 좌표. 정수는 칸의 모서리다. */
const iso = (tx, ty) => ({ x: (tx - ty) * TW / 2, y: (tx + ty) * TH / 2 });
/** 세계 좌표 → 칸 좌표 (iso의 역). 길찾기에 쓴다. */
const unIso = (x, y) => ({ tx: (x / (TW / 2) + y / (TH / 2)) / 2, ty: (y / (TH / 2) - x / (TW / 2)) / 2 });

/* ───────────── 길 ─────────────
 * 큰길 둘(세로, 두 칸 폭)과 골목 둘(가로, 한 칸 폭)이 마을을 여섯 구획으로 가른다.
 * 손님은 **길로만 다닌다** — 예전엔 목적지까지 직선으로 걸어서 남의 가게
 * 마당을 뚫고 지나갔다.
 */
const isRoad = (tx, ty) => tx === 5 || tx === 6 || tx === 12 || tx === 13 || ty === 5 || ty === 11;

/* ───────────── 가게 자리 ─────────────
 * ★ 여기 적는 칸은 마당의 **길 쪽 모서리**(계산대가 있는 앞 모서리)다.
 *   마당은 이 모서리를 붙박이로 두고 **길 반대쪽(뒤)으로 자란다.**
 *
 * 왜 뒤로 자라나: 예전엔 이 값이 마당의 뒷 모서리였고 마당이 앞으로 자랐다.
 * 그래서 승급할 때마다 계산대가 길에서 한 칸씩 멀어졌고, 3칸 마당에서는
 * 계산대가 아예 길에 닿지도 않았다. 가게를 넓힌다고 가게 앞이 옮겨 다니면
 * 안 된다 — 넓어지는 건 **뒷마당**이다.
 *
 * ★ 화면의 가로 위치는 tx가 아니라 (tx−ty)다. 이걸 놓치면 두 가게가
 * 같은 세로줄에 포개진다. 아래 배치는 같은 줄에 놓이는 짝(약재상·필방,
 * 대장간·옹기점)이 세로로 14칸(336px) 떨어지게 잡았다.
 */
const SHOP_T = [
  [5, 17],   // 대장간 — 시작 화면(아래 왼 구획, 왼 큰길가)
  [12, 17],  // 필방 — 아래 오른 구획
  [5, 11],   // 지물포 — 가운데 왼 구획
  [12, 5],   // 옹기점 — 위 오른 구획
  [5, 5],    // 약재상 — 위 왼 구획
];
/* 손님이 서는 길칸은 마당 생김새마다 다르다 → Village._door(i) 참고 */

/** 마당 안 배치 — 등급이 오르면 마당이 커지고 매대가 늘어난다.
 *
 *   무쇠급 3×3 → 매대 4칸    참쇠급 4×4 → 6칸    강철급 5×5 → 8칸
 *
 * "품목을 늘리려면 대장간2를 지어야 하나"의 답: 둘째 대장간이 아니라
 * **같은 마당이 넓어진다.** 매대는 뒤 두 담벼락을 따라 ㄱ자로 는다.
 * (가운데에 뭉치면 화면에서 마름모로 포개져 앞 계기가 뒤 매대를 덮는다.)
 */
function plotDim(sim, i) { return 3 + Math.min(2, sim.rankOf(SHOPS[i].id)); }

/* ───────────── 마당 생김새 네 가지 ─────────────
 * 다섯 가게가 전부 똑같이 생겼었다 — 계산대는 늘 마름모 아래 꼭짓점,
 * 매대는 늘 뒤 두 담벼락. 길이 둘로 늘어도 가게는 한 종류였다.
 *
 * 마당 안 좌표: (0,0)이 뒤 꼭짓점(화면 위), x가 늘면 오른쪽, y가 늘면 왼쪽,
 * (n-1,n-1)이 앞 꼭짓점(화면 아래). 네 변을 이렇게 부른다:
 *
 *            ▲ 뒤(0,0)
 *      TL ↙       ↘ TR          TL = x가 0인 변(위 왼쪽)
 *   왼(0,n-1)   오른(n-1,0)     TR = y가 0인 변(위 오른쪽)
 *      BL ↘       ↙ BR          BL = y가 n-1인 변(아래 왼쪽)
 *            ▼ 앞(n-1,n-1)      BR = x가 n-1인 변(아래 오른쪽)
 *
 * ★ 계산대는 반드시 **길에 닿는 변**(BR은 항상, BL은 가로 골목이 있을 때)에
 *   둔다. 담은 늘 뒤 두 변에만 세운다 — 앞쪽에 담을 세우면 마당 안이 가려지고,
 *   깊이 순서까지 뒤집어야 해서 얻는 것보다 잃는 게 크다.
 *
 *   A 마주보기 : 계산대 앞 꼭짓점 · 매대 뒤 두 변(Λ자) · 가마 뒤
 *   B 왼쪽살림 : 계산대 오른 변 가운데 · 매대 왼쪽 두 변 · 가마 오른 꼭짓점
 *   C 길가진열 : 계산대 오른 꼭짓점 · 매대 오른쪽 두 변(길 쪽으로 물건이 보인다)
 *   D 옆문     : 계산대 왼 변 가운데(가로 골목 쪽) · 매대 오른쪽 두 변
 */
const YARD_KIND = ['A', 'B', 'D', 'C', 'C'];   // 대장간·필방·지물포·옹기점·약재상

function yard(kind, n) {
  const m = Math.ceil((n - 1) / 2);                 // 변의 가운데
  const TR = [], TL = [], BR = [], BL = [];
  for (let x = 0; x < n; x++) { TR.push([x, 0]); BL.push([x, n - 1]); }
  for (let y = 0; y < n; y++) { TL.push([0, y]); BR.push([n - 1, y]); }
  const need = 2 * (n - 1);                         // 매대 칸수는 등급이 정한다
  if (kind === 'B') return { kind, gate: 'x', kiln: [n - 1, 0], counter: [n - 1, m],
    stalls: [...TL, ...BL.slice(1)].slice(0, need) };
  if (kind === 'C') return { kind, gate: 'x', kiln: [0, n - 1], counter: [n - 1, 0],
    stalls: [...TR.slice(0, n - 1), ...BR.slice(1)].slice(0, need) };
  if (kind === 'D') return { kind, gate: 'y', kiln: [0, 0], counter: [m, n - 1],
    stalls: [...TR.slice(1), ...BR.slice(1)].slice(0, need) };
  return { kind: 'A', gate: 'x', kiln: [0, 0], counter: [n - 1, n - 1],
    stalls: [...TR.slice(1), ...TL.slice(1)].slice(0, need) };
}

/** 작업대 — 가마 바로 안쪽 칸. 점장이 여기서 만든다. */
function workSpot(y, n) {
  const c = (v) => Math.max(1, Math.min(n - 2, v));
  return [c(y.kiln[0]), c(y.kiln[1])];
}
/** 직원 자리 — 안쪽 빈칸을 먼저, 모자라면 담벼락 빈칸까지.
 *
 *  ★ 3×3 마당은 안쪽 칸이 딱 하나뿐이고 그걸 작업대가 쓴다. 그래서
 *    무쇠급 가게는 **직원을 뽑아도 한 마리도 안 보였다** — 돈만 나가고
 *    화면에는 아무 일도 안 일어나는, 제일 나쁜 종류의 고장이다.
 *    매대·계산대·가마가 안 쓰는 담벼락 칸을 뒷자리로 내준다. */
function staffSpots(y, n) {
  const w = workSpot(y, n), out = [];
  for (let b = 1; b <= n - 2; b++) for (let a = 1; a <= n - 2; a++) {
    if (a === w[0] && b === w[1]) continue;
    out.push([a, b]);
  }
  const taken = new Set([...y.stalls, y.counter, y.kiln, w].map((t) => `${t[0]},${t[1]}`));
  for (let b = 0; b < n; b++) for (let a = 0; a < n; a++) {
    if (a > 0 && a < n - 1 && b > 0 && b < n - 1) continue;      // 안쪽은 위에서 넣었다
    if (!taken.has(`${a},${b}`)) out.push([a, b]);
  }
  return out;
}

/** 점장이 물건을 집을 때 서는 칸 — 매대 **옆 칸**(마당 안쪽).
 *
 *  예전엔 매대 칸 안에 서게 해서(+26,+14) 매대 상자가 점장을 통째로 덮었다.
 *  상자는 낮지만(14px) 점장이 그 칸 **뒤쪽**에 서는 셈이라 머리끝까지 가려졌다.
 *  옆 칸으로 물러서면 깊이가 같거나 한 칸 뒤라, 가려도 발끝뿐이다.
 */
function fetchSpot(y, n, stall) {
  const [lx, ly] = stall;
  const cand = [];
  if (ly === 0) cand.push([lx, ly + 1]);
  if (ly === n - 1) cand.push([lx, ly - 1]);
  if (lx === 0) cand.push([lx + 1, ly]);
  if (lx === n - 1) cand.push([lx - 1, ly]);
  const taken = new Set([...y.stalls, y.counter, y.kiln].map((t) => `${t[0]},${t[1]}`));
  const inside = (t) => t[0] >= 0 && t[0] < n && t[1] >= 0 && t[1] < n;
  return cand.find((t) => inside(t) && !taken.has(`${t[0]},${t[1]}`))
      || cand.find(inside) || [lx, ly];
}

/* 손님이 서는 쪽(길)과, 그 반대쪽(점장이 서는 마당 안). 한 칸 어치다. */
const GATE_OFF  = { x: { gx: 44, gy: 22 }, y: { gx: -44, gy: 22 } };
const SERVE_OFF = { x: { gx: -32, gy: -16 }, y: { gx: 32, gy: -16 } };
/* 줄은 길을 따라 늘어선다 — 큰길(세로)이면 아래왼쪽으로, 골목(가로)이면 아래오른쪽으로 */
const LINE_OFF  = { x: { gx: -42, gy: 21 }, y: { gx: 42, gy: 21 } };

/* 작은 건물 넷은 가운데 빈 구획(7~11열, 6~10행) — 사방이 길로 둘린 **장터**다.
 * 가게 마당 옆에 붙이면 화면에서 마당 모서리와 겹쳐 붙어 보인다(실제로 점포가
 * 대장간 마당에 얹힌 것처럼 나왔다). 네 채가 화면에서 136px 이상 벌어지도록
 * 스물다섯 칸을 전부 재서 골랐다. 삽살개는 마을 오른쪽 끝 풀밭. */
const SMALL_T = [[7, 7], [10, 6], [8, 10], [11, 9]];
const DOG_T = [14, 9];

const LINE_MAX = 4;                   // 한 가게 앞에 세우는 손님 수(줄+오는 중)
const ANGRY_AT = 0.75;                // 참을성의 이만큼을 넘기면 😠 (6초 중 4.5초)
const TAKE_LIFE = 1.5;                // 엽전 표가 떠 있는 시간(초)
const BUY_TIME = 2.3;                 // 손님이 가게 앞에 서 있는 시간
const HAND_OVER = 1.1;                // 이 시점에 물건이 건네진다
const WALK = 95;                      // 손님 걸음(세계 px/초)
const GUEST_PX = 34, CLERK_PX = 33;
const CLERK_SPEED = 130;

const C = {
  grass: '#8b9e74', grass2: '#849668', road: '#d9cba9', roadLine: 'rgba(0,0,0,.05)',
  paper: '#ece2cb', paper2: '#dccfb2', wood: '#8a6a45', wood2: '#6d5236',
  tile: '#4a4139', ink: '#2b241b', ink2: '#5a4e3d', ink3: '#8a7a63',
  gold: '#a8763e', jade: '#4a7c59', red: '#c7563f', ruin: '#5f6b4e',
};

const shade = (hex, d) => {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, v + d));
  return '#' + ((f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).padStart(6, '0');
};

/* 손님이 지고 온 짐 — qty를 눈에 보이게 하는 표시 */
const carryOf = (qty) => qty <= 5 ? 'hand' : qty <= 9 ? 'bojjim' : qty <= 14 ? 'jige' : 'cart';

class Village {
  constructor(sim, onShopTap) {
    this.sim = sim;
    this.onShopTap = onShopTap;
    this.onDelivered = null;               // 계산이 눈앞에서 끝났을 때 — 장부(로그)는 이때 쓴다
    this.t = 0;
    this.walkers = [];
    this.coins = [];
    this.takings = {};
    /* 한 번짜리 엽전 표 — 도둑맞은 손해(−)와 잡아서 받은 벌금(+).
     * 매상(takings)은 가게마다 한 장으로 합치지만, 이건 그때그때 한 장씩 뜬다. */
    this.floats = [];
    /* 아직 손님이 도착하지 않은 판매량 — sim은 사는 순간 재고를 깎지만
     * 화면에선 손님이 걸어오는 시간이 있다. 그릴 때만 도로 더한다. */
    this.pending = {};
    this.flash = {};
    this.bubble = null;
    this.busyShop = {};                    // 가게별 '방금 팔렸다' 여운(점장이 쫓는다)
    /* 가게 앞 줄 — 손님이 겹쳐 서면 주문 말풍선이 서로를 덮는다.
     * 먼저 온 손님이 0번(계산대 앞), 나머지는 길을 따라 뒤로 선다. */
    this.line = SHOPS.map(() => []);
    this.fetch = {};                       // 가게별 '집어올 물건' — 주문 받고 내오는 연출
    this.mgr = SHOPS.map((_, i) => ({ ...this._foot(i).work, at: 'work', face: 1 }));

    /* 카메라 — 이제 2차원이다. 가로로도 민다. */
    this.viewW = VW; this.viewH = 800;
    const s0 = this._foot(0).S;
    this.cam = { x: s0.x - VW / 2, y: s0.y - 800 * 0.62 };
    this.vel = { x: 0, y: 0 };
    this.drag = null;

    this.trees = this._trees();
  }

  /** 마당의 **뒷 모서리** 칸. SHOP_T는 앞(길 쪽) 모서리라 마당 크기만큼 뺀다.
   *  마당이 커져도 앞은 그대로, 뒤로만 밀린다. */
  _org(i) {
    const n = plotDim(this.sim, i);
    return [SHOP_T[i][0] - n, SHOP_T[i][1] - n];
  }

  /** 이 가게 마당의 생김새(가마·계산대·매대 자리). 등급마다 다시 계산한다. */
  _yard(i) { return yard(YARD_KIND[i] || 'A', plotDim(this.sim, i)); }

  /** 손님이 서는 길칸 — 계산대가 바라보는 쪽 한 칸. */
  _door(i) {
    const [tx, ty] = this._org(i);
    const y = this._yard(i);
    const [cx, cy] = y.counter;
    return y.gate === 'x' ? [tx + cx + 1, ty + cy] : [tx + cx, ty + cy + 1];
  }

  /** 가게 i의 요지(세계 좌표). 마당 크기·생김새는 등급이 정하므로 sim을 읽는다. */
  _foot(i) {
    const [tx, ty] = this._org(i);
    const n = plotDim(this.sim, i);
    const S = iso(tx + n, ty + n);
    const y = this._yard(i);
    const cc = iso(tx + y.counter[0] + 0.5, ty + y.counter[1] + 0.5);   // 계산대 가운데
    const g = GATE_OFF[y.gate], v = SERVE_OFF[y.gate];
    const wk = workSpot(y, n);
    return {
      n, S, yard: y,
      stand: { x: cc.x + g.gx, y: cc.y + g.gy },        // 손님 — 계산대 앞(길 위)
      work: iso(tx + wk[0] + 0.5, ty + wk[1] + 0.5),    // 작업대 — 가마에 붙은 안쪽 칸
      serve: { x: cc.x + v.gx, y: cc.y + v.gy },        // 점장 — 계산대 뒤(마당 안)
    };
  }

  /** 줄 k번째가 설 자리. 0번이 계산대 앞, 뒤로 갈수록 길을 따라 물러선다. */
  _spot(i, k) {
    const f = this._foot(i);
    if (!k) return f.stand;
    const l = LINE_OFF[f.yard.gate];
    return { x: f.stand.x + l.gx * k, y: f.stand.y + l.gy * k };
  }

  /* ── 길찾기 ──
   * 손님은 **길칸만 밟는다.** 예전엔 목적지까지 직선으로 걸어서 남의 가게
   * 마당을 뚫고, 대장간에서 필방으로 갈 땐 대장간을 관통해 나갔다.
   *
   * 길칸은 60칸 남짓이라 너비우선탐색이면 충분하다(A*까지 갈 일이 아니다).
   * 길 모양은 절대 안 변하므로 한 번 찾은 길은 그대로 넣어 두고 다시 쓴다.
   */
  _walkable(tx, ty) {
    return tx >= 0 && ty >= 0 && tx < GW && ty < GH && isRoad(tx, ty);
  }

  /** 길칸 a에서 b까지의 칸 목록. 못 가면 null. */
  _route(a, b) {
    const key = `${a[0]},${a[1]}>${b[0]},${b[1]}`;
    if (!this._routes) this._routes = new Map();
    if (this._routes.has(key)) return this._routes.get(key);

    const K = (tx, ty) => tx * 1000 + ty;
    const prev = new Map([[K(a[0], a[1]), null]]);
    const q = [a];
    let head = 0, found = a[0] === b[0] && a[1] === b[1];
    while (head < q.length && !found) {
      const [cx, cy] = q[head++];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (!this._walkable(nx, ny) || prev.has(K(nx, ny))) continue;
        prev.set(K(nx, ny), [cx, cy]);
        if (nx === b[0] && ny === b[1]) { found = true; break; }
        q.push([nx, ny]);
      }
    }
    let out = null;
    if (prev.has(K(b[0], b[1]))) {
      out = [];
      for (let cur = b; cur; cur = prev.get(K(cur[0], cur[1]))) out.push(cur);
      out.reverse();
    }
    this._routes.set(key, out);
    return out;
  }

  /** 길칸 목록을 걸어갈 점 목록으로. 곧게 이어지는 칸은 하나로 합친다. */
  _points(route, lane) {
    const pts = [];
    for (let i = 0; i < route.length; i++) {
      // 꺾이는 칸과 끝 칸만 남긴다 — 한 칸씩 찍으면 걸음이 잘게 끊긴다
      const a = route[i - 1], b = route[i], c = route[i + 1];
      const turn = !a || !c || (c[0] - b[0]) !== (b[0] - a[0]) || (c[1] - b[1]) !== (b[1] - a[1]);
      if (!turn) continue;
      const p = iso(b[0] + 0.5, b[1] + 0.5);
      pts.push({ x: p.x + lane, y: p.y });
    }
    return pts;
  }

  /** 이 가게는 그냥 지나친다(줄이 꽉 찼다). 계산은 이미 끝났으니
   *  장부만 빠뜨리지 않게 챙기고 다음 목적지로 보낸다. */
  _skip(w) {
    /* 도로 더해 둔 재고를 반드시 풀어 준다 — 안 풀면 그 몫이 진열대 숫자에
     * 영원히 얹혀 있어, 실제로는 빈 매대가 꽉 찬 것처럼 보인다. */
    const stop = w.stops[w.si];
    if (stop && stop.pend) {
      for (const it of stop.sold) {
        this.pending[it.id] = Math.max(0, (this.pending[it.id] || 0) - it.n);
      }
      stop.pend = false;
    }
    w.si++;
    if (w.si < w.stops.length) {
      const nx = w.stops[w.si];
      this._send(w, this._door(nx.idx), this._foot(nx.idx).stand);
      w.state = 'in'; w.paid = false; w.served = false;
    } else {
      if (!w.paid && w.sale && w.sale.n > 0 && this.onDelivered) this.onDelivered(w.sale);
      w.paid = true;
      this._send(w, w.exitTile, w.exitGate);
      w.state = 'out';
    }
  }

  /** 정해 준 길을 한 걸음 따라간다. 끝까지 갔으면 true. */
  _follow(w, speed) {
    if (!w.path || w.pi >= w.path.length) return true;
    let left = speed * w.speed;
    while (left > 0 && w.pi < w.path.length) {
      const t = w.path[w.pi];
      const dx = t.x - w.x, dy = t.y - w.y;
      const d = Math.hypot(dx, dy);
      if (d <= Math.max(2, left)) {            // 이번 걸음에 닿는다 → 다음 점으로
        w.x = t.x; w.y = t.y; w.pi++; left -= d;
        continue;
      }
      w.x += dx / d * left; w.y += dy / d * left;
      left = 0;
    }
    return w.pi >= w.path.length;
  }

  /** 손님에게 '여기까지 이 길로 가라'고 일러 준다. */
  _send(w, toTile, last) {
    const route = this._route(w.tile, toTile);
    w.path = route ? this._points(route, w.lane * 0.5) : [];
    if (last) w.path.push(last);
    if (!w.path.length) w.path = [last || { x: w.x, y: w.y }];
    w.pi = 0;
    w.tile = toTile;
  }

  /* 나무 — 빈 풀칸에 심는다. 매 프레임 난수를 쓰면 떨리므로 한 번만. */
  _trees() {
    let s = 20250819;
    const rng = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const used = new Set();
    // 마당은 최대 5×5까지 자라니 나무는 처음부터 그 밖에만 심는다
    for (const [mx, my] of SHOP_T) for (let a = 1; a <= 5; a++) for (let b = 1; b <= 5; b++) used.add(`${mx - a},${my - b}`);
    for (const [tx, ty] of SMALL_T) used.add(`${tx},${ty}`);
    used.add(`${DOG_T[0]},${DOG_T[1]}`);
    const out = [];
    for (let ty = 0; ty < GH; ty++) for (let tx = 0; tx < GW; tx++) {
      if (isRoad(tx, ty) || used.has(`${tx},${ty}`)) continue;
      const r = rng();
      if (r < 0.30) out.push({ tx, ty, k: r < 0.20 ? 'tree' : r < 0.26 ? 'rock' : 'flower', o: rng() });
    }
    return out;
  }

  /* ── 바깥에서 알려주는 사건 ── */

  /** 이 가게로 향하는 손님 수 — 줄에 선 사람 + 오는 중인 사람. */
  _load(idx) {
    let n = this.line[idx].length;
    for (const w of this.walkers) {
      if (w.state === 'in' && w.stops[w.si] && w.stops[w.si].idx === idx) n++;
    }
    return n;
  }

  onSale(sale) {
    /* 걸음이 느려 한 명이 10초쯤 머문다. 실측으로 열넷이면 거래의 96%가
     * 화면에 나온다. 넘치면 그 거래는 화면에 안 나온다(계산은 끝났다). */
    if (this.walkers.length > 14) {
      // 걸어올 사람이 없으니 장부라도 바로 쓴다 — 돈은 이미 움직였다
