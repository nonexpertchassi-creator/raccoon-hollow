      if (!sale.waiting && sale.n > 0 && this.onDelivered) this.onDelivered(sale);
      return;
    }
    const byShop = new Map();
    for (const ln of sale.lines) {
      const idx = SHOPS.findIndex((s) => s.id === ln.item.shop);
      if (idx < 0) continue;
      if (!byShop.has(idx)) byShop.set(idx, { idx, sold: [], gain: 0, pend: !sale.waiting });
      const g = byShop.get(idx);
      g.sold.push({ id: ln.item.id, n: ln.n });
      g.gain += ln.gain;
      /* 즉시 판매만 도로 더한다. 주문은 점장이 손에 들고 만드는 중이라
       * 진열대가 파인 게 오히려 맞는 그림이다. */
      if (!sale.waiting) this.pending[ln.item.id] = (this.pending[ln.item.id] || 0) + ln.n;
    }
    /* 빈손 손님 — 포기한 물건의 가게 앞까지는 가 본다. 💢는 거기서 나온다. */
    if (!byShop.size && sale.grumbles && sale.grumbles.length) {
      const idx = SHOPS.findIndex((s) => s.id === sale.grumbles[0].item.shop);
      if (idx >= 0) byShop.set(idx, { idx, sold: [], gain: 0 });
    }
    /* 줄이 이미 긴 가게는 이번 손님을 **화면에 안 세운다.**
     *
     * 계산대는 한 명에 1.4~2.3초가 걸리는데 잘되는 가게는 그보다 빨리 팔린다.
     * 그대로 두면 줄이 열넷까지 밀려서, 뒷사람은 십 초 넘게 기다리다 전부
     * 성난 얼굴이 된다(실측 44%). 화남이 그 지경이면 신호가 아니라 소음이다.
     * 줄은 눈에 보이라고 만든 연출이지 장부가 아니다 — 넘치는 몫은 조용히
     * 뺀다(돈은 이미 들어왔다). */
    const stops = [...byShop.values()].filter((x) => this._load(x.idx) < LINE_MAX);
    if (!stops.length) {
      if (!sale.waiting && sale.n > 0 && this.onDelivered) this.onDelivered(sale);
      for (const ln of sale.lines) {         // 도로 더해 둔 재고를 되돌린다
        if (!sale.waiting) this.pending[ln.item.id] = Math.max(0, (this.pending[ln.item.id] || 0) - ln.n);
      }
      return;
    }

    /* 큰길(세로, 5·6열) 양끝 중 첫 가게에 가까운 쪽에서 들어와, 가게들을
     * 훑고 반대쪽으로 나간다. 들어온 뒤로는 길칸만 밟는다. */
    const gate = (top) => iso(6, top ? -1.6 : GH + 1.6);
    const avgY = stops.reduce((a, x) => a + this._foot(x.idx).S.y, 0) / stops.length;
    const fromTop = Math.abs(gate(true).y - avgY) < Math.abs(gate(false).y - avgY);
    stops.sort((a, b) => fromTop
      ? this._foot(a.idx).S.y - this._foot(b.idx).S.y
      : this._foot(b.idx).S.y - this._foot(a.idx).S.y);
    const g0 = gate(fromTop);
    this.walkers.push({
      id: sale.guest.id, face: sale.guest.face,
      reg: this.sim.regularLv(sale.guest.id),
      speed: sale.guest.speed || 1,
      carry: carryOf(sale.guest.qty),
      stops, si: 0,
      sale, orderId: sale.orderId, settled: !sale.waiting,
      x: g0.x + (Math.random() - 0.5) * 40, y: g0.y,
      exitGate: gate(!fromTop),
      exitTile: [5, fromTop ? GH - 1 : 0],        // 반대쪽 끝 길칸
      tile: [5, fromTop ? 0 : GH - 1],            // 지금 서 있는 길칸
      path: null, pi: 0,
      state: 'in', wait: 0, paid: false, served: false, waitT: 0, lineT: 0, bob: Math.random() * 6,
      lane: (Math.random() - 0.5) * 34,
    });
    const w = this.walkers[this.walkers.length - 1];
    this._send(w, this._door(stops[0].idx), this._foot(stops[0].idx).stand);
  }

  /** 기다리던 주문이 다 나왔다 — sim이 방금 돈을 움직였다. 손님을 깨운다. */
  onOrderDone(done) {
    const w = this.walkers.find((x) => x.orderId === done.orderId);
    if (!w) {
      if (done.n > 0 && this.onDelivered) this.onDelivered(done);
      return;
    }
    w.sale = done;
    w.settled = true;
    // 실제로 받아가는 만큼으로 바꿔 단다 (시간 초과면 주문보다 적을 수 있다)
    const byShop = new Map();
    for (const ln of done.lines) {
      const idx = SHOPS.findIndex((s) => s.id === ln.item.shop);
      if (!byShop.has(idx)) byShop.set(idx, { sold: [], gain: 0 });
      const g = byShop.get(idx);
      g.sold.push({ id: ln.item.id, n: ln.n });
      g.gain += ln.gain;
    }
    for (const stop of w.stops) {
      const g = byShop.get(stop.idx);
      stop.sold = g ? g.sold : [];
      stop.gain = g ? g.gain : 0;
    }
  }

  /** 계산은 끝났는데 아직 계산대 연출이 안 끝난 돈.
   *  위쪽 엽전 표시는 이만큼 빼고 보여준다 — 돈이 미리 오르면 버그로 보인다. */
  inTransit() {
    let s = 0;
    for (const w of this.walkers) {
      if (!w.settled) continue;                 // 주문 대기 — 돈이 아직 안 움직였다
      for (let i = w.si; i < w.stops.length; i++) {
        if (i === w.si && w.paid) continue;
        s += w.stops[i].gain;
      }
    }
    return s;
  }

  /**
   * 도둑이 일을 끝냈다 — 나간 돈(−)과 물어온 벌금(+)을 눈에 보이게 한다.
   *
   * 아래 띠에 글로도 뜨지만, 글은 읽어야 알고 표는 보면 안다. 특히 손해는
   * '언제 얼마나 빠졌는지'가 안 보이면 도둑을 잡을 이유도 안 생긴다.
   */
  onPestGone(info) {
    if (!info || !info.amount) return;
    let x, y;
    const idx = info.itemId
      ? SHOPS.findIndex((sh) => sh.items.some((it) => it.id === info.itemId)) : -1;
    if (idx >= 0) {
      // 물건을 털렸다 — 그 가게 지붕 위에 뜬다
      const r = this._roofBase(idx);
      x = r.N.x; y = r.y - 32;                 // 매상 표와 안 겹치게 한 층 위
    } else {
      // 엽전을 털렸다 — 훔쳐 달아난 그 자리에 뜬다
      const p = this._pestPos;
      if (!p) return;
      x = p.screen ? p.x + this.cam.x : p.x;
      y = (p.screen ? p.y + this.cam.y : p.y) - 30;
    }
    // 손해는 조금 더 오래 남긴다 — 드물게 일어나고, 놓치면 안 되는 소식이다
    this.floats.push({ x, y, amount: info.amount, t: info.amount < 0 ? 2.1 : TAKE_LIFE });
  }

  onAsk(ask) {
    const idx = SHOPS.findIndex((s) => s.id === ask.item.shop);
    if (idx < 0) return;
    this.bubble = { idx, text: `${ask.item.name}?`, t: 4.5, face: ask.guest.face };
  }

  /* ── 매 프레임 ── */
  update(dt, pointer, viewH) {
    if (viewH && viewH !== this.viewH) {
      this.cam.y += (this.viewH - viewH) / 2;    // 보던 가운데를 붙잡는다
      this.viewH = viewH;
    }
    this.t += dt;
    if (this.bubble) { this.bubble.t -= dt; if (this.bubble.t <= 0) this.bubble = null; }
    for (const k of Object.keys(this.flash)) { this.flash[k] -= dt; if (this.flash[k] <= 0) delete this.flash[k]; }
    for (const k of Object.keys(this.busyShop)) { this.busyShop[k] -= dt; if (this.busyShop[k] <= 0) delete this.busyShop[k]; }

    // 손님 — 큰길을 따라 내려오다 가게 앞으로 꺾는다
    for (const w of this.walkers) {
      const stop = w.stops[w.si];
      /* 기다린 시간 — **제 차례가 왔는데 물건이 안 나온 시간**만 센다.
       * 4초(참을성 6초의 2/3)를 넘기면 얼굴이 굳는다(😠).
       *
       * ★ 줄 서서 기다린 시간은 안 센다. 줄까지 세어 재 봤더니 초반 4% ·
       *   중반 79% · 후반 97.5%가 성난 얼굴이 됐다. 이유는 단순하다 —
       *   잘되는 가게는 화면에 세울 수 있는 것보다 훨씬 빨리 팔린다. 줄은
       *   늘 꽉 차 있고, 그래서 '줄 시간'은 가게 사정이 아니라 **연출의 한계**를
       *   재는 셈이 된다. 그렇게 뜬 화남은 신호가 아니라 소음이다.
       *   지금 뜨는 😠는 하나만 뜻한다: **물건을 제때 못 만들고 있다.** */
      if (w.state === 'line') w.lineT += dt;
      else if (w.state === 'buy' && !w.settled) w.waitT += dt;
      if (w.state === 'in' && stop) {
        /* 길을 따라 걷는다. 예전엔 목적지까지 직선이라 남의 마당을 뚫고
         * 지나갔다 — 대장간에서 필방으로 갈 땐 대장간을 관통해서 나갔다. */
        if (this._follow(w, WALK * 1.3 * dt)) {
          // 길 끝 = 가게 앞. 줄에 서고, 제 차례가 오면 그때 계산한다.
          const q = this.line[stop.idx];
          if (q.length >= LINE_MAX) { this._skip(w); continue; }   // 줄이 꽉 찼다
          if (!q.includes(w)) q.push(w);
          w.state = 'line';
        }
      } else if (w.state === 'line') {
        const q = this.line[stop.idx];
        const k = q.indexOf(w);
        const spot = this._spot(stop.idx, Math.max(0, k));
        const dx = spot.x - w.x, dy = spot.y - w.y, d = Math.hypot(dx, dy);
        if (d > 1.5) {                                   // 앞이 비면 한 칸 당겨 선다
          const step = Math.min(d, WALK * 1.1 * w.speed * dt);
          w.x += dx / d * step; w.y += dy / d * step;
        }
        if (k === 0 && d < 4) {
          // 뒤에 줄이 섰으면 손이 빨라진다 — 줄이 끝없이 길어지지 않게
          w.rush = q.length > 2 ? 0.5 : q.length > 1 ? 0.7 : 1;
          w.state = 'buy'; w.wait = BUY_TIME * w.rush; w.paid = false; w.served = false;
        }
      } else if (w.state === 'buy') {
        /* 주문한 물건이 아직 안 나왔다 — 점장은 만드는 중, 손님은 서서 기다린다.
         * 계산 연출은 sim이 onOrderDone으로 깨워줄 때 시작한다.
         *
         * ★ 안전 빗장: 그 신호를 어떤 이유로든 놓치면 이 손님이 계산대를
         *   영원히 막고, 뒤에 선 사람들도 다 같이 갇힌다. sim은 아무리 늦어도
         *   참을성의 두 배(12초) 안에 주문을 끝내므로, 그보다 넉넉히 지나면
         *   신호가 없었어도 진행시킨다. 줄은 무슨 일이 있어도 흘러야 한다. */
        if (!w.settled) {
          if (w.waitT > SERVICE.patience * 2 + 4) w.settled = true;
          else continue;
        }
        if (!w.served) {
          w.served = true; w.wait = BUY_TIME * (w.rush || 1);
          this.busyShop[stop.idx] = w.wait + 1.2;
          /* 점장이 이 매대에 들러 물건을 집어 온다 — '주문 받고 내온다'가
           * 눈에 보이는 지점. 경제는 그대로다(재고에서 파는 것). */
          if (stop.sold.length) this.fetch[stop.idx] = stop.sold[0].id;
        }
        w.wait -= dt;
        if (!w.paid && w.wait <= (BUY_TIME - HAND_OVER) * (w.rush || 1)) {
          w.paid = true;
          if (stop.gain > 0) {
            for (const s of stop.sold) {
              if (stop.pend) this.pending[s.id] = Math.max(0, (this.pending[s.id] || 0) - s.n);
              this.flash[s.id] = 0.45;
            }
            for (let k = 0; k < Math.min(5, stop.sold.length + 2); k++) {
              this.coins.push({
                x: w.x + (Math.random() - 0.5) * 16, y: w.y - 10,
                vx: 20 + Math.random() * 30, vy: -80 - Math.random() * 40,
                t: 1.05, r: 8.5 + Math.random() * 2.5,
              });
            }
            const tk = (this.takings[stop.idx] ||= { amount: 0, t: 0 });
            tk.amount += stop.gain; tk.t = TAKE_LIFE;
            const sy = w.y - this.cam.y, sx = w.x - this.cam.x;
            if (sy > -20 && sy < this.viewH + 20 && sx > -20 && sx < VW + 20) {
              Juice.burst(sx, sy - 14, { n: 4, color: ['#f0d98b'], size: 2, speed: 52, life: 0.34 });
            }
            Sfx.coin();
          }
          /* 장부는 마지막 계산이 끝난 이 순간에 쓴다 — 미리 쓰면 버그로 보인다 */
          if (w.si === w.stops.length - 1 && this.onDelivered) this.onDelivered(w.sale);
        }
        if (w.wait <= 0) {
          const q = this.line[stop.idx];
          const at = q.indexOf(w);
          if (at >= 0) q.splice(at, 1);                  // 뒷사람이 한 칸씩 당겨 선다
          w.waitT = 0; w.lineT = 0;                      // 다음 가게에선 새로 센다
          w.si++;
          w.state = w.si < w.stops.length ? 'in' : 'out';
          if (w.state === 'in') {
            const nx = w.stops[w.si];
            this._send(w, this._door(nx.idx), this._foot(nx.idx).stand);
          } else {
            this._send(w, w.exitTile, w.exitGate);
          }
        }
      } else {
        if (this._follow(w, WALK * 1.25 * dt)) w.gone = true;
      }
    }
    this.walkers = this.walkers.filter((w) => !w.gone);
    for (const q of this.line) {
      for (let k = q.length - 1; k >= 0; k--) if (q[k].gone) q.splice(k, 1);
    }

    // 점장 — 주문이 오면 매대에서 집어서 계산대로, 아니면 작업대로
    for (let i = 0; i < SHOPS.length; i++) {
      const m = this.mgr[i];
      const f = this._foot(i);
      const serving = (this.busyShop[i] || 0) > 0;
      if (!serving) delete this.fetch[i];
      let t = serving ? f.serve : f.work;
      /* 집어올 물건이 있으면 그 매대부터 들른다 */
      const fid = serving ? this.fetch[i] : null;
      if (fid && this.sim.isOpen(fid)) {
        const shop = SHOPS[i];
        const k = shop.items.findIndex((x) => x.id === fid);
        const spots = this._yard(i).stalls;
        if (k >= 0 && k < spots.length) {
          const og = this._org(i);
          const nn = plotDim(this.sim, i);
          const [fx, fy] = fetchSpot(this._yard(i), nn, spots[k]);
          const sp = iso(og[0] + fx + 0.5, og[1] + fy + 0.5);
          const near = Math.hypot(sp.x - m.x, sp.y - m.y) < 5;
          if (near) delete this.fetch[i];            // 집었다 — 이제 계산대로
          else t = sp;
        }
      }
      const dx = t.x - m.x, dy = t.y - m.y, d = Math.hypot(dx, dy);
      if (d > 1.5) {
        const step = Math.min(d, CLERK_SPEED * dt);
        m.x += dx / d * step; m.y += dy / d * step;
        m.at = 'walk'; if (Math.abs(dx) > 1) m.face = Math.sign(dx);
      } else {
        m.x = t.x; m.y = t.y;
        m.at = serving ? 'sell' : 'work';
        if (m.at === 'sell') m.face = 1;                // 손님은 오른쪽에 선다
      }
    }

    for (const co of this.coins) {
      co.t -= dt; co.x += co.vx * dt; co.y += co.vy * dt; co.vy += 165 * dt;
    }
    this.coins = this.coins.filter((co) => co.t > 0);
    for (const k of Object.keys(this.takings)) {
      this.takings[k].t -= dt;
      if (this.takings[k].t <= 0) delete this.takings[k];
    }
    for (const f of this.floats) { f.t -= dt; f.y -= 17 * dt; }
    this.floats = this.floats.filter((f) => f.t > 0);

    this._camera(dt, pointer);
  }

  /* ── 카메라 — 2차원 끌기 ── */
  _camera(dt, p) {
    if (p.justDown) { this.drag = { x: p.x, y: p.y, moved: 0 }; this.vel.x = this.vel.y = 0; }
    if (this.drag && p.down) {
      const dx = p.x - this.drag.x, dy = p.y - this.drag.y;
      this.cam.x -= dx; this.cam.y -= dy;
      this.vel.x = -dx / Math.max(dt, 1 / 120);
      this.vel.y = -dy / Math.max(dt, 1 / 120);
      this.drag.moved += Math.abs(dx) + Math.abs(dy);
      this.drag.x = p.x; this.drag.y = p.y;
    } else if (this.drag) {
      if (this.drag.moved < 7) this._tap(p.x + this.cam.x, p.y + this.cam.y);
      this.drag = null;
    }
    if (!this.drag) {
      this.cam.x += this.vel.x * dt; this.cam.y += this.vel.y * dt;
      const f = Math.pow(0.0016, dt);
      this.vel.x *= f; this.vel.y *= f;
      if (Math.abs(this.vel.x) < 4) this.vel.x = 0;
      if (Math.abs(this.vel.y) < 4) this.vel.y = 0;
    }
    // 마을 밖으로 못 나가게. 창이 마을보다 크면 가운데 고정.
    const b = this._bounds();
    this.cam.x = clampAxis(this.cam.x, b.x0, b.x1, VW);
    this.cam.y = clampAxis(this.cam.y, b.y0, b.y1, this.viewH);
  }

  _bounds() {
    return {
      x0: iso(0, GH).x - 40, x1: iso(GW, 0).x + 40,
      y0: iso(0, 0).y - 150, y1: iso(GW, GH).y + 90,
    };
  }

  camMax() { const b = this._bounds(); return Math.max(0, b.y1 - b.y0 - this.viewH); }

  /** 이 가게가 지금 화면 어디에 있나 — 들어갈 때 확대의 중심 */
  shopScreenPos(i) {
    const S = this._foot(i).S;
    return { x: S.x - this.cam.x, y: S.y - 60 - this.cam.y };
  }

  /* ── 손가락 ── */
  _tap(wx, wy) {
    // 나쁜 놈이 제일 급하다
    const th = this._pestAt();
    if (th) {
      const hx = th.screen ? wx - this.cam.x : wx;
      const hy = th.screen ? wy - this.cam.y : wy;
      if (Math.hypot(hx - th.x, hy - th.y + 6) < th.r) {
        const got = this.sim.catchPest();
        if (got) {
          Sfx.win(); Juice.shake(7);
          const cx = th.screen ? th.x + this.cam.x : th.x;
          const cy = th.screen ? th.y + this.cam.y : th.y;
          this.floats.push({ x: cx, y: cy - 34, amount: got.gain, t: TAKE_LIFE });
          for (let i = 0; i < 6; i++) {
            this.coins.push({
              x: cx + (Math.random() - 0.5) * 14, y: cy - 8,
              vx: (Math.random() - 0.5) * 90, vy: -95 - Math.random() * 45,
              t: 1.2, r: 9 + Math.random() * 3,
            });
          }
          return;
        }
      }
    }

    // 삽살개 자리
    {
      const p = iso(DOG_T[0] + 1, DOG_T[1] + 1);
      if (!this.sim.guard && Math.abs(wx - p.x) < 60 && wy > p.y - 80 && wy < p.y + 26) {
        if (this.sim.buyGuard()) { Sfx.reward(); Juice.shake(5); } else Sfx.deny();
        return;
      }
    }

    // 곁가게
    for (let i = 0; i < SMALL_T.length; i++) {
      const p = iso(SMALL_T[i][0] + 1, SMALL_T[i][1] + 1);
      if (Math.abs(wx - p.x) < 62 && wy > p.y - 92 && wy < p.y + 24) {
        if (!this.sim.smalls.includes(i)) {
          if (this.sim.buildSmall(i)) { Sfx.reward(); Juice.shake(5); } else Sfx.deny();
        } else if (this.sim.tapSmall(i)) { Sfx.win(); Juice.shake(6); }
        else Sfx.click();
        return;
      }
    }

    // 가게 마당 — 매대는 그 자리에서 바로 강화/열기, 나머지는 가게 창
    for (let i = 0; i < SHOPS.length; i++) {
      const [tx, ty] = this._org(i);
      const shop = SHOPS[i];
      const open = this.sim.shops.includes(shop.id);
      if (open) {
        /* 이웃 칸은 화면에서 48px밖에 안 떨어진다. '먼저 맞은 것'을 고르면
         * 뒤 매대가 앞 매대의 몫을 삼킨다 — **제일 가까운 매대**를 고른다. */
        let best = null;
        const spots = this._yard(i).stalls;
        const cap = Math.min(this.sim.stallCap(shop.id), shop.items.length);
        for (let k = 0; k < cap; k++) {
          const [lx, ly] = spots[k];
          const p = iso(tx + lx + 0.5, ty + ly + 0.5);
          if (Math.abs(wx - p.x) > 52 || wy < p.y - 64 || wy > p.y + 28) continue;
          const d = Math.hypot(wx - p.x, (wy - (p.y - 18)) * 1.4);
          if (!best || d < best.d) best = { it: shop.items[k], d };
        }
        if (best) {
          const it = best.it;
          if (!this.sim.isOpen(it.id)) {
            if (this.sim.canOpenItem(it.id) && this.sim.openItem(it.id)) { Sfx.win(); Juice.shake(6); }
            else Sfx.deny();
            return;
          }
          /* 매대를 누르면 그 품목을 살 수 있는 만큼 강화한다 —
           * 가게 안 화면이 없어졌으니 강화가 지도에서 바로 돼야 한다 */
          const n = this.sim.affordableLevels(it.id);
          if (n > 0 && this.sim.levelUpMany(it.id, n)) { Sfx.click(); this.flash[it.id] = 0.35; }
          else Sfx.deny();
          return;
        }
      }
      // 마당 나머지(현판 포함) — 가게 창을 연다 (승급·자세한 숫자)
      const n2 = open ? plotDim(this.sim, i) : 3;
      const M = iso(tx + n2 / 2, ty + n2 / 2);
      const inPlot = Math.abs(wx - M.x) / (n2 * 50 + 4) + Math.abs(wy - M.y) / (n2 * 25 + 4) <= 1;
      const N = iso(tx, ty);
      const onSign = Math.abs(wx - N.x) < 90 && wy > N.y - 72 && wy < N.y - 40;
      if (inPlot || onSign) {
        this.onShopTap(shop.id, open);
        return;
      }
    }
  }

  /* ── 그리기 ── */
  draw(c) {
    c.save();
    c.translate(-this.cam.x, -this.cam.y);

    const left = this.cam.x - 60, right = this.cam.x + VW + 60;
    const top = this.cam.y - 120, bot = this.cam.y + this.viewH + 80;
    const vis = (p, pad = 0) =>
      p.x > left - pad && p.x < right + pad && p.y > top - pad && p.y < bot + pad;

    // 바닥
    for (let ty = 0; ty < GH; ty++) for (let tx = 0; tx < GW; tx++) {
      const p = iso(tx + 1, ty + 1);            // 칸의 아래 꼭짓점
      if (!vis(p, TW)) continue;
      this._tile(c, tx, ty, isRoad(tx, ty));
    }

    // 깊이 순서대로 — 아래 꼭짓점 y가 큰 것이 앞이다
    const layer = [];
    for (let i = 0; i < SHOPS.length; i++) {
      const [tx, ty] = this._org(i);
      const n = plotDim(this.sim, i);
      const S = iso(tx + n, ty + n);
      if (!vis(S, TW * 3)) continue;
      if (!this.sim.shops.includes(SHOPS[i].id)) {
        layer.push({ z: S.y, d: () => this._ruin(c, i) });
        continue;
      }
      /* 마당을 한 덩어리로 그리면 마당의 z(아래 꼭짓점)가 마당 **안에 서 있는**
       * 손님·점장보다 커서 가구가 동물을 덮었다. 바닥은 맨 뒤로 보내고,
       * 가구 하나하나를 자기 발끝 z로 따로 세운다 — 그래야 손님이 계산대
       * 뒤에 서면 가려지고 앞에 서면 가리는, 당연한 일이 당연하게 된다. */
      layer.push({ z: iso(tx, ty).y + 2, d: () => this._plotBase(c, i, n) });
      const kl = this._yard(i).kiln;
      layer.push({ z: iso(tx + kl[0] + 1, ty + kl[1] + 1).y, d: () => this._kiln(c, i) });
      const cap = Math.min(this.sim.stallCap(SHOPS[i].id), SHOPS[i].items.length);
      const spots = this._yard(i).stalls;
      for (let k = 0; k < cap; k++) {
        const [lx, ly] = spots[k];
        const kk = k;
        layer.push({ z: iso(tx + lx + 1, ty + ly + 1).y, d: () => this._stall(c, i, kk, spots[kk]) });
      }
      /* 계산대도 자기 발끝으로 선다. 마당 끝(S.y)에 세워 두면 마당 **안**에 있는
       * 점장·손님보다 항상 앞이 되어 너구리를 덮었다 — 가구를 따로 세운 이유가
       * 바로 이건데 계산대만 옛 z가 남아 있었다. */
      const ct = this._yard(i).counter;
      layer.push({ z: iso(tx + ct[0] + 0.84, ty + ct[1] + 0.7).y, d: () => this._counter(c, i) });
      /* 직원 — 늘 작업대 줄에 붙어 만든다. 점장이 계산대로 불려가도
       * 이쪽은 계속 만든다. '한 마리는 생산, 한 마리는 판매'가 이 그림이다. */
      const nst = this.sim.staffOf(SHOPS[i].id);
      const ss = staffSpots(this._yard(i), n);
      for (let sIdx = 0; sIdx < Math.min(nst, ss.length); sIdx++) {
        const sp = iso(tx + ss[sIdx][0] + 0.5, ty + ss[sIdx][1] + 0.5);
        const si = sIdx;
        layer.push({ z: sp.y + 0.5, d: () => this._staff(c, i, si, sp) });
      }
    }
    for (let i = 0; i < SMALL_T.length; i++) {
      const p = iso(SMALL_T[i][0] + 1, SMALL_T[i][1] + 1);
      if (vis(p, TW)) layer.push({ z: p.y, d: () => this._small(c, i) });
    }
    {
      const p = iso(DOG_T[0] + 1, DOG_T[1] + 1);
      if (vis(p, TW)) layer.push({ z: p.y, d: () => this._dog(c, p) });
    }
    for (const tr of this.trees) {
      const p = iso(tr.tx + 0.5, tr.ty + 0.5);
      if (vis(p, 60)) layer.push({ z: p.y + TH / 2, d: () => this._prop(c, tr, p) });
    }
    for (const w of this.walkers) if (vis(w, 60)) layer.push({ z: w.y, d: () => this._walker(c, w) });
    for (let i = 0; i < SHOPS.length; i++) {
      const k = this._clerk(i);
      if (k && vis(k, 60)) layer.push({ z: k.y + 0.5, d: () => this._clerkDraw(c, k) });
    }
    const th = this._pestAt();
    if (th && !th.screen && vis(th, 60)) layer.push({ z: th.y + 1, d: () => this._pest(c, th) });
    layer.sort((a, b) => a.z - b.z);
    for (const l of layer) l.d();

    // 말풍선·표는 깊이 정렬 밖 — 가려지면 못 읽는다
    for (const w of this.walkers) {
      if ((w.state !== 'buy' && w.state !== 'line') || !vis(w, 80)) continue;
      /* 주문표는 **맨 앞사람만**. 줄이 길 때 전부 띄우면 말풍선끼리 겹쳐
       * 어느 것도 안 읽힌다 — 줄을 세운 이유의 절반이 이것이다. */
      if (w.state === 'buy' && !w.paid) this._order(c, w);
      /* 💢 = **볼일이 끝났는데 못 샀다.** 반드시 계산이 끝난 뒤에만 띄운다.
       *
       * 예전엔 '살 게 하나도 없는 손님'을 sold가 비었다는 이유로 곧장 💢로
       * 그렸다. 그래서 그 손님은 마을에 **화난 채로 걸어 들어와** 줄까지 화난
       * 얼굴로 서 있었다. 아직 묻지도 않았는데 화가 나 있는 셈이었다.
       *
       * 😠는 기다림이 4초를 넘겼을 때 — 줄에 선 뒤부터 센다. */
      const bob = Math.sin(this.t * 5.2) * 2;
      /* 💢 = **빈손으로 돌아간다**(하나도 못 샀다). 몇 개 사고 한 종류를
       * 포기한 정도로는 안 띄운다 — 물건을 받아 들고 돌아서는 순간 화를 내면
       * '방금 샀는데 왜 화가 나지?'가 된다. */
      const empty = w.sale && w.sale.n === 0 && w.sale.grumbles && w.sale.grumbles.length;
      /* 😠 = **지금 기다리는 중**. 물건이 나와 계산이 시작되면 바로 푼다 —
       * 다 받고 나서도 화난 얼굴이 남아 있으면 그것도 '왜 화났지?'가 된다.
       * 줄에서는 9초, 계산대 앞(물건 기다림)에서는 6초의 3/4인 4.5초부터. */
      const waiting = (w.state === 'line' && w.lineT > SERVICE.linePatience)
        || (w.state === 'buy' && !w.settled && w.waitT > SERVICE.patience * ANGRY_AT);
      if (empty && w.paid) {
        G.text(c, '💢', w.x + 15, w.y - 46 + bob, { size: 19, fill: '#000' });
      } else if (waiting) {
        G.text(c, '😠', w.x + 15, w.y - 44 + bob, { size: 17, fill: '#000' });
      }
    }
    for (const k of Object.keys(this.takings)) this._takings(c, Number(k));
    for (const f of this.floats) if (vis(f, 90)) this._chip(c, f.x, f.y, f.amount, f.t);
    if (this.bubble) this._bubble(c);
    for (const co of this.coins) if (vis(co, 30)) this._coin(c, co);

    c.restore();

    // 화면에 붙는 것들
    if (th && th.screen) this._pest(c, th);
    if (this.sim.fair > 0) {
      G.round(c, VW / 2 - 76, 10, 152, 28, 10, C.red);
      G.text(c, `장이 섰다 · ${Math.ceil(this.sim.fair)}초`, VW / 2, 24,
        { size: 13.5, fill: '#fff3dd', weight: 800 });
    }
  }

  _tile(c, tx, ty, road) {
    const n = iso(tx, ty), e = iso(tx + 1, ty), s = iso(tx + 1, ty + 1), w2 = iso(tx, ty + 1);
    c.beginPath();
    c.moveTo(n.x, n.y); c.lineTo(e.x, e.y); c.lineTo(s.x, s.y); c.lineTo(w2.x, w2.y);
    c.closePath();
    c.fillStyle = road ? C.road : ((tx + ty) % 2 ? C.grass : C.grass2);
    c.fill();
    c.strokeStyle = road ? C.roadLine : 'rgba(0,0,0,.03)';
    c.lineWidth = 1; c.stroke();
  }

  _prop(c, tr, p) {
    if (tr.k === 'tree') {
      G.rect(c, p.x - 3, p.y - 10, 6, 12, C.wood2);
      G.circle(c, p.x, p.y - 22, 16 + tr.o * 5, '#6f8a5c');
      G.circle(c, p.x - 7, p.y - 15, 10, '#7fa070');
    } else if (tr.k === 'rock') {
      G.circle(c, p.x, p.y - 4, 8 + tr.o * 4, '#8f8f7a');
    } else {
      for (let k = 0; k < 3; k++) {
        G.circle(c, p.x + (k - 1) * 9, p.y - 4 - (k % 2) * 5, 3, k % 2 ? '#e5b8c4' : '#efe3a8');
      }
    }
  }

  /** 다진 흙마당 한 칸 — 작은 건물의 발밑. 이게 있어야 땅에 붙어 보인다. */
  _pad(c, tx, ty) {
    const N = iso(tx, ty), E = iso(tx + 1, ty), S = iso(tx + 1, ty + 1), W2 = iso(tx, ty + 1);
    c.beginPath();
    c.moveTo(N.x, N.y); c.lineTo(E.x, E.y); c.lineTo(S.x, S.y); c.lineTo(W2.x, W2.y);
    c.closePath();
    c.fillStyle = '#c2ad83'; c.fill();
    c.strokeStyle = 'rgba(60,50,30,.28)'; c.lineWidth = 1.5; c.stroke();
  }

  /** 건물 상자 — 윗면·왼면·오른면 */
  _box(c, tx, ty, w, d, h, topCol, sideCol) {
    const N = iso(tx, ty), E = iso(tx + w, ty), S = iso(tx + w, ty + d), W2 = iso(tx, ty + d);
    // 왼면(서쪽) · 오른면(동쪽)
    c.beginPath(); c.moveTo(W2.x, W2.y - h); c.lineTo(S.x, S.y - h); c.lineTo(S.x, S.y); c.lineTo(W2.x, W2.y);
    c.closePath(); c.fillStyle = sideCol; c.fill();
    c.beginPath(); c.moveTo(E.x, E.y - h); c.lineTo(S.x, S.y - h); c.lineTo(S.x, S.y); c.lineTo(E.x, E.y);
    c.closePath(); c.fillStyle = shade(sideCol, -18); c.fill();
    // 윗면
    c.beginPath(); c.moveTo(N.x, N.y - h); c.lineTo(E.x, E.y - h); c.lineTo(S.x, S.y - h); c.lineTo(W2.x, W2.y - h);
    c.closePath(); c.fillStyle = topCol; c.fill();
    return { N, E, S, W: W2 };
  }

  _ruin(c, i) {
    const shop = SHOPS[i];
    const [tx, ty] = this._org(i);
    const S = iso(tx + 3, ty + 3);
    const N = iso(tx, ty), E = iso(tx + 3, ty), W2 = iso(tx, ty + 3);
    c.save();
    c.setLineDash([8, 7]); c.lineWidth = 2; c.strokeStyle = 'rgba(50,44,30,.45)';
    c.beginPath(); c.moveTo(N.x, N.y); c.lineTo(E.x, E.y); c.lineTo(S.x, S.y); c.lineTo(W2.x, W2.y);
    c.closePath(); c.stroke(); c.restore();
    const M = iso(tx + 1.5, ty + 1.5);
    for (let k = 0; k < 3; k++) {
      G.round(c, M.x - 34 + k * 28, M.y - 14 + (k % 2) * 6, 8, 22 - k * 5, 3, '#6a6a55');
    }
    const next = this.sim.nextShop();
    const isNext = next && next.id === shop.id;
    G.text(c, isNext ? shop.name : '무너진 집', M.x, M.y - 34,
      { size: 14, fill: isNext ? '#4a4232' : C.ruin, weight: 800 });
    if (isNext) {
      const can = this.sim.money >= shop.cost;
      G.round(c, M.x - 50, M.y + 4, 100, 25, 9, can ? C.jade : '#77775f');
      G.text(c, `🪙${fmt(shop.cost)}`, M.x, M.y + 16.5, { size: 12.5, fill: '#fff', weight: 800 });
    }
  }

  /** 마당 바닥·담·현판·표 — 항상 맨 뒤에 깔린다 */
  _plotBase(c, i, n) {
    const shop = SHOPS[i];
    const [tx, ty] = this._org(i);
    const N = iso(tx, ty), E = iso(tx + n, ty), S = iso(tx + n, ty + n), W2 = iso(tx, ty + n);

    c.beginPath();
    c.moveTo(N.x, N.y); c.lineTo(E.x, E.y); c.lineTo(S.x, S.y); c.lineTo(W2.x, W2.y);
    c.closePath();
    c.fillStyle = '#d3c5a4'; c.fill();
    c.strokeStyle = shade(shop.color, 40); c.lineWidth = 2; c.stroke();

    for (const [A, B] of [[W2, N], [N, E]]) {
      c.beginPath();
      c.moveTo(A.x, A.y); c.lineTo(B.x, B.y);
      c.lineTo(B.x, B.y - 16); c.lineTo(A.x, A.y - 16);
      c.closePath(); c.fillStyle = shade(shop.color, -8); c.fill();
      c.beginPath(); c.moveTo(A.x, A.y - 16); c.lineTo(B.x, B.y - 16);
      c.strokeStyle = shade(shop.color, 26); c.lineWidth = 3; c.stroke();
    }

    // 현판 — 등급은 여기에만 적는다
    const rk = this.sim.rankOf(shop.id);
    const sTxt = rk > 0 ? `${shop.sign} ${shop.name} · ${shop.ranks[rk]}` : `${shop.sign} ${shop.name}`;
    const sw = 30 + sTxt.length * 12.5;
    G.rect(c, N.x - 3, N.y - 44, 6, 44, C.wood2);
    G.round(c, N.x - sw / 2, N.y - 66, sw, 26, 8, shop.color);
    G.text(c, sTxt, N.x, N.y - 53, { size: 14, fill: '#fff8ec', weight: 800 });

    // 매대가 모자라면 — 다음 승급이 매대를 늘린다는 걸 알린다
    const cap = this.sim.stallCap(shop.id);
    if (shop.items.length > cap) {
      G.text(c, `승급하면 매대 +2`, S.x, S.y + 20,
        { size: 11.5, fill: 'rgba(43,36,27,.55)', weight: 800 });
    }

    /* 들어가서 좋은 일이 있을 때만 표 — 숙제가 아니라 초대장 */
    const todo = this.sim.shopTodo(shop.id);
    if (todo > 0) {
      const bob = Math.sin(this.t * 4) * 3;
      const promo = this.sim.canPromote(shop.id);
      const txt = promo ? '승급!' : this.sim.canHireStaff(shop.id) ? '일손!' : '새 칸!';
      const tw = 26 + txt.length * 13;
      G.round(c, N.x - tw / 2, N.y - 100 + bob, tw, 25, 9, promo ? C.red : C.jade);
      G.text(c, txt, N.x, N.y - 87.5 + bob, { size: 14, fill: '#fff3dd', weight: 800 });
    }
  }

  _kiln(c, i) {
    const shop = SHOPS[i];
    const [tx, ty] = this._org(i);
    const [kx, ky] = this._yard(i).kiln;
    const p = iso(tx + kx + 0.5, ty + ky + 0.5);
    this._box(c, tx + kx + 0.22, ty + ky + 0.22, 0.56, 0.56, 26,
      shade(shop.color, 24), shade(shop.color, -16));
    const fl = 0.6 + Math.abs(Math.sin(this.t * 3 + i)) * 0.4;
    G.circle(c, p.x, p.y - 30, 5 * fl, '#f0a24b');
    G.circle(c, p.x, p.y - 36, 3 * fl, '#f6d27a');
  }

  /** 매대 한 칸 = 좌대 + 물건 + 재고·진행 계기 + 이름패 */
  _stall(c, i, k, spot) {
    const shop = SHOPS[i];
    const [tx, ty] = this._org(i);
    const [lx, ly] = spot;
    const p = iso(tx + lx + 0.5, ty + ly + 0.5);
    const it = shop.items[k];

    if (!this.sim.isOpen(it.id)) {
      c.save();
      c.setLineDash([5, 5]); c.strokeStyle = 'rgba(60,52,36,.45)'; c.lineWidth = 1.6;
      const n2 = iso(tx + lx, ty + ly), e2 = iso(tx + lx + 1, ty + ly),
            s2 = iso(tx + lx + 1, ty + ly + 1), w3 = iso(tx + lx, ty + ly + 1);
      c.beginPath(); c.moveTo(n2.x, n2.y); c.lineTo(e2.x, e2.y); c.lineTo(s2.x, s2.y); c.lineTo(w3.x, w3.y);
      c.closePath(); c.stroke(); c.restore();
      const asked = this.sim.asked.includes(it.id);
      if (asked) {
        const can = this.sim.money >= itemById(it.id).cost;
        G.text(c, itemById(it.id).name, p.x, p.y - 26, { size: 12.5, fill: C.ink2, weight: 800 });
        G.round(c, p.x - 36, p.y - 16, 72, 21, 7, can ? C.jade : 'rgba(60,52,36,.32)');
        G.text(c, `🪙${fmt(itemById(it.id).cost)}`, p.x, p.y - 5.5, { size: 11, fill: '#fff', weight: 800 });
      } else {
        G.text(c, '? ? ?', p.x, p.y - 8, { size: 12, fill: 'rgba(60,52,36,.5)', weight: 800 });
      }
      return;
    }

    const st = this.sim.items[it.id];
    const fl = this.flash[it.id] || 0;
    const cap = this.sim.capOf(it.id);
    const shown = Math.min(cap, st.stock + (this.pending[it.id] || 0));
    const capped = shown >= cap;

    this._box(c, tx + lx + 0.14, ty + ly + 0.14, 0.72, 0.72, 14,
      fl > 0 ? '#f2e0ae' : C.paper, C.wood);
    drawArt(c, 'items', it.id, p.x - 16, p.y - 14, 26, 42);

    const ry = p.y - 46, rr = 15;
    const pr = capped ? 1 : Math.max(0, Math.min(1, st.prog / this.sim.craftTime(it.id)));
    G.circle(c, p.x + 12, ry, rr - 3, 'rgba(252,246,232,.95)');
    c.save();
    c.lineWidth = 3.5; c.lineCap = 'round';
    c.strokeStyle = 'rgba(43,36,27,.30)';
    c.beginPath(); c.arc(p.x + 12, ry, rr, 0, Math.PI * 2); c.stroke();
    if (pr > 0.01) {
      c.strokeStyle = capped ? '#ff8a63' : '#e8b93f';
      c.beginPath(); c.arc(p.x + 12, ry, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr); c.stroke();
    }
    c.restore();
    G.text(c, String(shown), p.x + 12, ry, { size: fl > 0 ? 17 : 15.5, fill: C.ink, weight: 800 });

    const nm = itemById(it.id).name;
    const nw = 14 + nm.length * 11;
    G.round(c, p.x - nw / 2, p.y + 8, nw, 18, 5, 'rgba(43,36,27,.78)');
    G.text(c, nm, p.x, p.y + 17, { size: 11, fill: '#fff8ec', weight: 800 });
  }

  _counter(c, i) {
    const [tx, ty] = this._org(i);
    const [cx, cy] = this._yard(i).counter;
    this._box(c, tx + cx + 0.16, ty + cy + 0.3, 0.68, 0.4, 18, C.paper2, C.wood2);
    const p = iso(tx + cx + 0.5, ty + cy + 0.5);
    G.circle(c, p.x + 8, p.y - 24, 4.5, '#c9a227');    // 엽전 접시
  }

  _small(c, i) {
    const [tx, ty] = SMALL_T[i];
    const def = SMALL_SHOPS[i];
    const p = iso(tx + 1, ty + 1);

    if (!this.sim.smalls.includes(i)) {
      const N = iso(tx, ty), E = iso(tx + 1, ty), W2 = iso(tx, ty + 1);
      c.save();
      c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(60,52,36,.4)';
      c.beginPath(); c.moveTo(N.x, N.y); c.lineTo(E.x, E.y); c.lineTo(p.x, p.y); c.lineTo(W2.x, W2.y);
      c.closePath(); c.stroke(); c.restore();
      G.text(c, `${def.name} 자리`, p.x, p.y - TH - 16, { size: 11, fill: C.ruin, weight: 800 });
      const can = this.sim.money >= def.cost;
      G.round(c, p.x - 40, p.y - TH - 8, 80, 21, 7, can ? C.jade : 'rgba(60,52,36,.30)');
      G.text(c, `🪙${fmt(def.cost)}`, p.x, p.y - TH + 2.5, { size: 11, fill: can ? '#fff' : '#e6e0cf', weight: 800 });
      return;
    }

    /* 건물이 '땅에 서 있다'는 인상은 이 순서가 만든다:
     * 다진 흙마당(발 밑) → 벽 → 벽보다 넓게 나온 처마 지붕.
     * 예전엔 상자 밑에 그림자 타원을 깔았는데, 그림자가 바닥 밖으로
     * 삐져나오니 오히려 공중에 뜬 것처럼 보였다. 지붕도 길바닥과 같은
     * 미색이라 윗면이 '떠 있는 땅 한 칸'으로 읽혔다. */
    this._pad(c, tx, ty);
    this._box(c, tx + 0.16, ty + 0.16, 0.68, 0.68, 19, C.paper2, C.wood);
    c.save(); c.translate(0, -19);
    this._box(c, tx + 0.02, ty + 0.02, 0.96, 0.96, 9, '#8a6647', '#6b4c33');
    c.restore();
    G.round(c, p.x - 30, p.y - 46, 60, 17, 6, 'rgba(43,36,27,.85)');
    G.text(c, def.name, p.x, p.y - 37.5, { size: 10.5, fill: '#fff8ec', weight: 800 });

    if (this.sim.busy === i) {
      const bob = Math.sin(this.t * 5) * 4;
      G.glow?.(c, p.x, p.y - 46, 44, 'rgba(255,214,120,.34)');
      G.round(c, p.x - 30, p.y - 96 + bob, 60, 24, 9, C.red);
      G.text(c, '장 서다!', p.x, p.y - 84 + bob, { size: 12.5, fill: '#fff3dd', weight: 800 });
    }
  }

  _dog(c, p) {
    if (!this.sim.guard) {
      const [tx, ty] = DOG_T;
      const N = iso(tx, ty), E = iso(tx + 1, ty), W2 = iso(tx, ty + 1);
      c.save();
      c.setLineDash([6, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(60,52,36,.4)';
      c.beginPath(); c.moveTo(N.x, N.y); c.lineTo(E.x, E.y); c.lineTo(p.x, p.y); c.lineTo(W2.x, W2.y);
      c.closePath(); c.stroke(); c.restore();
      G.text(c, '삽살개 자리', p.x, p.y - TH - 16, { size: 11, fill: C.ruin, weight: 800 });
      const can = this.sim.money >= GUARD.cost;
      G.round(c, p.x - 38, p.y - TH - 8, 76, 21, 7, can ? C.jade : 'rgba(60,52,36,.30)');
      G.text(c, `🪙${fmt(GUARD.cost)}`, p.x, p.y - TH + 2.5, { size: 11, fill: can ? '#fff' : '#e6e0cf', weight: 800 });
      return;
    }
    // 개집 — 작은 가게와 같은 문법: 흙마당 → 벽 → 처마
    this._pad(c, DOG_T[0], DOG_T[1]);
    this._box(c, DOG_T[0] + 0.18, DOG_T[1] + 0.18, 0.64, 0.64, 19, C.paper2, '#d8c9a3');
    c.save(); c.translate(0, -19);
    this._box(c, DOG_T[0] + 0.06, DOG_T[1] + 0.06, 0.88, 0.88, 8, '#8a6647', '#6b4c33');
    c.restore();
    G.circle(c, p.x, p.y - 13, 6.5, '#2b241b');
    const alert = !!this.sim.pest;
    const bob = alert ? Math.abs(Math.sin(this.t * 12)) * 3 : Math.sin(this.t * 2) * 1.2;
    if (!drawArt(c, 'pests', 'dog', p.x - 26, p.y + 8 - bob, 24, 24))
      G.text(c, '🐕', p.x - 26, p.y - 4 - bob, { size: 24, fill: '#000' });
    if (alert) {
      G.round(c, p.x - 44, p.y - 34, 24, 15, 6, C.red);
      G.text(c, '멍!', p.x - 32, p.y - 26.5, { size: 9.5, fill: '#fff3dd', weight: 800 });
    }
  }

  /* ── 점장 ── */
  _clerk(i) {
    const shop = SHOPS[i];
    if (!this.sim.shops.includes(shop.id)) return null;
    const open = shop.items.filter((it) => this.sim.isOpen(it.id));
    if (!open.length) return null;
    const m = this.mgr[i];
    const full = open.every((it) => this.sim.items[it.id].stock >= this.sim.capOf(it.id));
    const mode = m.at === 'sell' ? 'sell' : m.at === 'walk' ? 'walk' : full ? 'sleep' : 'work';
    return { i, mode, x: m.x, y: m.y, face: m.face };
  }

  _clerkDraw(c, k) {
    const shop = SHOPS[k.i];
    const face = k.face || 1;
    const ph = (this.t / 2.4 + k.i * 0.37) % 1;
    const swing = Math.max(0, Math.sin(ph * Math.PI * 2));
    const bob = k.mode === 'work' ? swing * 3
      : k.mode === 'walk' ? Math.abs(Math.sin(this.t * 10)) * 3
      : k.mode === 'sell' ? Math.sin(this.t * 3) * 1.4 : 0;

    c.fillStyle = 'rgba(0,0,0,.15)';
    c.beginPath(); c.ellipse(k.x, k.y + 2, 10, 4, 0, 0, 7); c.fill();

    if (k.mode === 'work' || k.mode === 'sleep') {
      const ax = k.x - 15;                        // 작업대는 건물 쪽(왼편)
      G.round(c, ax - 6, k.y - 8, 12, 4.5, 2, '#6b6257');
      G.round(c, ax - 2.5, k.y - 4, 5, 5, 1, '#57504a');
      G.round(c, ax - 5, k.y + 1, 10, 2.5, 1, '#4a4139');
      if (k.mode === 'work' && swing > 0.96) for (let j = 0; j < 3; j++) {
        G.circle(c, ax + (j - 1) * 4, k.y - 11 - (j === 1 ? 3 : 0), 1.7, '#f0d98b');
      }
    }
    if (k.mode === 'sell') {
      const px = k.x + face * (CLERK_PX * (60 / 72 - 0.5));
      const py = k.y + 4 - CLERK_PX + CLERK_PX * (38 / 72);
      G.circle(c, px, py - bob, 5.5, '#c9a227');
      G.round(c, px - 2, py - bob - 6.5, 4, 4, 1, C.wood);
    }

    c.save();
    c.translate(k.x, k.y + 4);
    if (face < 0) c.scale(-1, 1);
    if (k.mode === 'walk') c.rotate(Math.sin(this.t * 9) * 0.11);
    const step = Math.sin(this.t * 9) > 0 ? 1 : 2;
    const names = k.mode === 'sell' ? [`${shop.id}-sell`]
      : k.mode === 'sleep' ? [`${shop.id}-sleep`]
      : k.mode === 'walk' ? [`${shop.id}-walk${step}`, `${shop.id}-walk1`, `${shop.id}-idle`, `${shop.id}-work`]
      : [`${shop.id}-work`];
    let drawn = false;
    for (const n of names) if (drawArt(c, 'clerks', n, 0, -bob, CLERK_PX, CLERK_PX)) { drawn = true; break; }
    if (!drawn && !drawArt(c, 'hero', k.mode === 'sell' ? 'raccoon-sell' : 'raccoon-make', 0, -bob, CLERK_PX, CLERK_PX))
      G.text(c, '🦝', 0, -13 - bob, { size: CLERK_PX, fill: '#000' });
    c.restore();

    if (k.mode === 'sleep') {
      const z = (this.t * 0.6) % 1;
      G.text(c, '💤', k.x + 11, k.y - 26 - z * 9, { size: 11 + z * 3, fill: '#000' });
    }
  }

  /** 직원 너구리 — 자리를 안 옮긴다. 자기 작업대만 지킨다. */
  _staff(c, i, k, sp) {
    const shop = SHOPS[i];
    const full = shop.items.filter((it) => this.sim.isOpen(it.id))
      .every((it) => this.sim.items[it.id].stock >= this.sim.capOf(it.id));
    const ph = (this.t / 2.4 + i * 0.37 + (k + 1) * 0.29) % 1;
    const swing = Math.max(0, Math.sin(ph * Math.PI * 2));
    const bob = full ? 0 : swing * 3;

    c.fillStyle = 'rgba(0,0,0,.15)';
    c.beginPath(); c.ellipse(sp.x, sp.y + 2, 9, 4, 0, 0, 7); c.fill();
    const ax = sp.x - 14;
    G.round(c, ax - 6, sp.y - 8, 12, 4.5, 2, '#6b6257');
    G.round(c, ax - 2.5, sp.y - 4, 5, 5, 1, '#57504a');
    if (!full && swing > 0.96) G.circle(c, ax, sp.y - 12, 1.7, '#f0d98b');
    c.save();
    c.translate(sp.x, sp.y + 4);
    const pose = full ? 'sleep' : 'work';
    if (!drawArt(c, 'clerks', `${shop.id}-${pose}`, 0, -bob, 30, 30)
     && !drawArt(c, 'hero', 'raccoon-make', 0, -bob, 30, 30))
      G.text(c, '🦝', 0, -12 - bob, { size: 30, fill: '#000' });
    c.restore();
    if (full) G.text(c, '💤', sp.x + 10, sp.y - 24, { size: 11, fill: '#000' });
  }

  /* ── 손님 ── */
  _walker(c, w) {
    const bob = Math.sin(this.t * 9 * w.speed + w.bob) * (w.state === 'buy' ? 0.8 : 2.4);
    c.fillStyle = 'rgba(0,0,0,.17)';
    c.beginPath(); c.ellipse(w.x, w.y + 8, 11, 4.5, 0, 0, 7); c.fill();
    this._carry(c, w, bob);
    c.save();
    if (w.state !== 'buy') c.translate(0, 0);
    if (!drawArt(c, 'guests', w.id, w.x, w.y + 6 + bob, GUEST_PX, GUEST_PX))
      G.text(c, w.face, w.x, w.y - 8 + bob, { size: GUEST_PX - 4, fill: '#000' });
    c.restore();

    // 단골 갓 — 20성을 네 계단으로 접는다
    if (w.reg > 0) {
      const tier = Math.min(4, Math.ceil(w.reg / 4));
      const y = w.y - 26 + bob, sw = 9 + tier * 2.2;
      const tone = ['', '#8a7a63', '#6d5236', '#3f3327', '#2b241b'][tier];
      G.round(c, w.x - sw, y, sw * 2, 3.5, 2, tone);
      G.round(c, w.x - sw * 0.42, y - 6.5, sw * 0.84, 8, 3, tone);
      if (tier >= 4) G.circle(c, w.x, y - 8.5, 2.4, '#e0c073');
    }
  }

  _carry(c, w, bob) {
    const x = w.x, y = w.y + bob * 0.4;
    if (w.carry === 'hand') return;
    if (w.carry === 'bojjim') {
      G.circle(c, x - 14, y - 13, 9.5, '#c07a56');
      G.round(c, x - 18.5, y - 24, 9, 7, 3, '#9c5c3c');
    } else if (w.carry === 'jige') {
      G.rect(c, x - 20, y - 28, 4, 28, C.wood2);
      G.rect(c, x - 12, y - 28, 4, 28, C.wood2);
      G.round(c, x - 24, y - 38, 22, 14, 4, '#bb8d55');
      G.round(c, x - 21, y - 47, 16, 10, 3, '#a1743f');
    } else {
      G.round(c, x - 34, y - 20, 26, 14, 3, '#a1743f');
      G.circle(c, x - 29, y - 3, 6.5, C.wood2);
      G.circle(c, x - 15, y - 3, 6.5, C.wood2);
      G.round(c, x - 32, y - 30, 22, 11, 3, '#bb8d55');
    }
  }

  /**
   * 손님 머리 위 주문표.
   *
   * 예전엔 '5개 · 2종'이라고 적었다. 그런데 **2종이 뭐였는지는 안 알려준다** —
   * 알려면 아래 장부를 봐야 하고, 그러면 머리 위에 띄운 뜻이 없어진다.
   * 지금은 물건 그림과 개수를 그대로 적는다: ⛏️3 🪓2.
   * 그림이 준비되면 이모지 자리에 그 그림이 들어간다(같은 자리, 같은 크기).
   */
  _order(c, w) {
    const stop = w.stops[w.si];
    if (!stop || !stop.sold.length) return;

    /* 세 가지까지만 적고 나머지는 +N으로 줄인다 — 넷을 넘기면 말풍선이
     * 손님보다 커져서 길을 덮는다. */
    const segs = stop.sold.slice(0, 3).map((x) => {
      const it = itemById(x.id);
      return { id: x.id, icon: it.icon || '📦', n: x.n, w: 19 + String(x.n).length * 7.8 };
    });
    const more = stop.sold.length - segs.length;
    const wait = !w.settled;                     // 아직 만드는 중이면 🔨

    const inner = segs.reduce((a, x) => a + x.w, 0) + (more > 0 ? 20 : 0) + (wait ? 17 : 0);
    const tw = inner + 16;
    const bx = w.x + 26, by = w.y - 40 + Math.sin(this.t * 3.4) * 1.6;
    G.round(c, bx - tw / 2, by - 12, tw, 22, 8, 'rgba(252,246,232,.96)');
    c.fillStyle = 'rgba(252,246,232,.96)';
    c.beginPath();
    c.moveTo(bx - 16, by + 9); c.lineTo(bx - 23, by + 16); c.lineTo(bx - 9, by + 9);
    c.closePath(); c.fill();

    let x = bx - inner / 2;                      // 왼쪽부터 차곡차곡
    if (wait) {
      G.text(c, '🔨', x + 8, by + 1, { size: 13, fill: '#000' });
      x += 17;
    }
    for (const sg of segs) {
      if (!drawArt(c, 'items', sg.id, x + 8, by + 6, 15, 15))
        G.text(c, sg.icon, x + 8, by + 1, { size: 13, fill: '#000' });
      G.text(c, String(sg.n), x + 19 + String(sg.n).length * 3.9, by + 1,
        { size: 12.5, fill: C.ink, weight: 800 });
      x += sg.w;
    }
    if (more > 0) G.text(c, `+${more}`, x + 10, by + 1, { size: 11.5, fill: C.ink3, weight: 800 });
  }

  /* ── 나쁜 놈 ── */
  _pestAt() {
    const t = this.sim.pest;
    if (!t) return null;
    const p = 1 - Math.max(0, t.left) / t.life;

    this._pestPos = null;
    if (t.kind === 'crow') {
      // 까마귀는 화면 기준으로 가로지른다 — 마을 어디를 보고 있든 눈에 들어온다
      const dir = t.amount % 2 ? 1 : -1;
      const u = p * 2 - 1;
      const e = 0.5 + 0.5 * (u * 0.3 + u * u * u * 0.7);
      const x = dir > 0 ? -40 + e * 560 : 520 - e * 560;
      return (this._pestPos = {
        kind: 'crow', face: '🐦‍⬛', screen: true,
        x, y: this.viewH * 0.3 + Math.sin(p * Math.PI * 2.4) * 46,
        left: t.left, life: t.life, r: 30, flip: dir < 0,
      });
    }

    const idx = SHOPS.findIndex((sh) => sh.items.some((it) => it.id === t.itemId));
    const f = this._foot(Math.max(0, idx));
    const heart = iso(GW / 2, GH / 2);           // 마을 안쪽으로 달아난다
    return (this._pestPos = {
      kind: 'rat', face: '🐀', screen: false,
      x: f.stand.x + (heart.x - f.stand.x) * p * 0.5,
      y: f.stand.y + (heart.y - f.stand.y) * p * 0.5,
      left: t.left, life: t.life, r: 32, flip: false,
    });
  }

  _pest(c, t) {
    const fly = t.kind === 'crow';
    const bob = fly ? Math.sin(this.t * 11) * 5 : Math.abs(Math.sin(this.t * 16)) * 4;
    const r = fly ? 27 : 25;
    c.save();
    G.circle(c, t.x, t.y - 6, r - 3, 'rgba(255,246,232,.55)');
    c.lineWidth = 4;
    c.strokeStyle = 'rgba(163,74,58,.28)';
    c.beginPath(); c.arc(t.x, t.y - 6, r, 0, 7); c.stroke();
    c.strokeStyle = '#a34a3a';
    c.beginPath(); c.arc(t.x, t.y - 6, r, -Math.PI / 2, -Math.PI / 2 + 7 * (t.left / t.life)); c.stroke();
    c.restore();
    if (fly) {
      c.fillStyle = 'rgba(0,0,0,.10)';
      c.beginPath(); c.ellipse(t.x, t.y + 34, 13, 4, 0, 0, 7); c.fill();
    } else {
      c.fillStyle = 'rgba(0,0,0,.17)';
      c.beginPath(); c.ellipse(t.x, t.y + 7, 10, 4, 0, 0, 7); c.fill();
      G.circle(c, t.x + 11, t.y - 10 - bob * 0.4, 7, '#a34a3a');
    }
    if (!drawArt(c, 'pests', t.kind, t.x, t.y + 8 - bob, 30, 30))
      G.text(c, t.face, t.x, t.y - 7 - bob, { size: 30, fill: '#000' });
    if (fly) {
      G.circle(c, t.x + 12, t.y + 2 - bob, 5.5, '#c9a227');
      G.rect(c, t.x + 10, t.y - bob, 4, 4, C.wood);
    }
  }

  /* ── 떠 있는 글자들 ── */
  /**
   * 매상 표 — **계산대에서 피어오른다.**
   *
   * 예전엔 지붕 위에 띄웠는데 거기엔 이미 현판과 '새 칸!/승급!' 표가 산다.
   * 가게가 다섯이 되면 지붕마다 표가 두 겹씩 쌓여 어느 것도 안 읽힌다.
   * 자리를 나눴다 — **지붕은 이름과 할 일(계속 있는 것), 계산대는 지금
   * 벌어지는 일(잠깐 있는 것).** 게다가 손님 주문표가 사라지는 그 자리에서
   * 매상이 피어오르니 '주문 → 계산 → 돈'이 한 자리에서 이어져 읽힌다.
   *
   * 같은 가게의 연속 판매는 **한 장으로 합친다**(tk.amount에 더한다).
   * 이게 화면이 안 복잡해지는 진짜 이유다 — 표가 늘지 않고 숫자만 커진다.
   */
  _takings(c, idx) {
    const tk = this.takings[idx];
    const r = this._roofBase(idx);
    this._chip(c, r.N.x, r.y - (TAKE_LIFE - tk.t) * 13, tk.amount, tk.t);
  }

  /**
   * 지붕 위 **층 정하기**.
   *
   * 지붕 위 빈 하늘은 표를 놓기 제일 좋은 자리다 — 매대도 동물도 안 가린다.
   * 그런데 여태 현판·'새 칸!' 배지·매상 표·손님 질문이 **전부 같은 높이**를
   * 노려서 서로 덮었다. 가게가 다섯이 되면 그게 다섯 배가 된다.
   * 그래서 순서를 못 박는다 — 아래에서 위로:
   *
   *     현판(이름)  →  배지(할 일)  →  매상 표(방금 번 돈)  →  손님 질문
   *
   * 계속 있는 것이 아래, 잠깐 있는 것이 위. 한 층이 비면 위층이 내려온다.
   */
  _roofBase(idx) {
    const og = this._org(idx);
    const N = iso(og[0], og[1]);
    const shop = SHOPS[idx];
    const todo = this.sim.shops.includes(shop.id) && this.sim.shopTodo(shop.id) > 0;
    return { N, y: N.y - 100 - (todo ? 34 : 0) };
  }

  /** 엽전 표 한 장. 엽전 → 부호 → 숫자 순 (🪙 +1,234 / 🪙 −900) */
  _chip(c, x, y, amount, t) {
    const neg = amount < 0;
    const label = `🪙 ${neg ? '−' : '+'}${fmt(Math.abs(amount))}`;
    const bw = 22 + label.length * 8.2;
    c.globalAlpha = Math.min(1, t / 0.4);
    G.round(c, x - bw / 2, y, bw, 24, 9, neg ? '#5e2a24' : '#3d3327');
    G.text(c, label, x, y + 12.5, { size: 13, fill: neg ? '#f2b3a6' : '#f2d88c', weight: 800 });
    c.globalAlpha = 1;
  }

  _bubble(c) {
    const b = this.bubble;
    const r = this._roofBase(b.idx);
    const N = r.N;
    const bw = 112, y = r.y + 2 - (this.takings[b.idx] ? 32 : 0);
    c.globalAlpha = Math.min(1, b.t);
    G.round(c, N.x - bw / 2, y, bw, 28, 9, '#fff6d8');
    c.fillStyle = '#fff6d8';
    c.beginPath();
    c.moveTo(N.x - 6, y + 27); c.lineTo(N.x + 6, y + 27); c.lineTo(N.x, y + 36);
    c.fill();
    G.text(c, `${b.face} ${b.text}`, N.x, y + 14, { size: 13, fill: C.ink, weight: 800 });
    c.globalAlpha = 1;
  }

  _coin(c, co) {
    c.globalAlpha = Math.min(1, co.t * 2.4);
    G.circle(c, co.x, co.y, co.r, '#b8873a');
    G.circle(c, co.x, co.y, co.r * 0.84, '#ecc264');
    c.fillStyle = '#b8873a';
    const q = co.r * 0.3;
    c.fillRect(co.x - q, co.y - q, q * 2, q * 2);
    c.globalAlpha = 1;
  }
}

/** 한 축을 마을 안에 가둔다. 창이 마을보다 크면 가운데 고정. */
function clampAxis(cam, lo, hi, view) {
  if (hi - lo <= view) return (lo + hi) / 2 - view / 2;
  return Math.max(lo, Math.min(hi - view, cam));
}

const $ = (s) => document.querySelector(s);
/* 저장 열쇠 v2 — 돈 단위 개편(경→억)으로 옛 저장과 물가가 안 맞는다.
 * 조냥이 든 지갑으로 새 물가에 들어오면 전부 공짜가 되므로 새로 시작한다. */
const SAVE = 'rs:save2';

const saved = Store.get(SAVE);
const sim = new Sim(saved?.state || null);

/* 오프라인 수익 — 방치형의 심장 */
if (saved?.at) {
  const away = (Date.now() - saved.at) / 1000;
  const r = sim.offline(away);
  if (r && r.earned > 0) showOffline(r);
}

function showOffline(r) {
  const el = document.createElement('div');
  el.id = 'offline';
  const h = Math.floor(r.seconds / 3600), m = Math.round((r.seconds % 3600) / 60);
  el.innerHTML = `<div class="card">
    <h3>다녀오신 동안</h3>
    <p>${h ? h + '시간 ' : ''}${m}분 동안 너구리들이 계속 만들었습니다.<br>
    ${r.capped ? '<b>(최대 4시간까지만 쌓입니다)</b>' : ''}</p>
    <div style="font-size:26px;font-weight:800;color:var(--gold);margin-bottom:16px">
      🪙${fmt(r.earned)}</div>
    <button id="ok">받기</button></div>`;
  document.body.appendChild(el);
  el.querySelector('#ok').onclick = () => { Sfx.coin(); el.remove(); };
}

/* ── 가게를 누르면 올라오는 창 ──
 * 장면이 기본 화면이 되면서 목록은 여기로 들어왔다. 강화·칸 열기는
 * 손가락으로 정확히 눌러야 하는 조작이라 캔버스보다 DOM이 낫다. */
let openShopId = null;
let panelKind = null;      // 'shop' | 'guests' | 'quests'

/** 손님 도감 열기 */
function openGuests() {
  panelKind = 'guests'; openShopId = null;
  $('#ptitle').textContent = '손님 도감';
  $('#pbody').innerHTML = guestsHTML();
  $('#panel').hidden = false;
  Sfx.click();
}

/** 마을 의뢰 열기 */
function openQuests() {
  panelKind = 'quests'; openShopId = null;
  $('#ptitle').textContent = '마을 의뢰';
  $('#pbody').innerHTML = questsHTML();
  $('#panel').hidden = false;
  bindQuests();
  Sfx.click();
}

function openPanel(id, isOpen) {
  const shop = shopById(id);
  if (!isOpen) {
    // 아직 무너진 집 — 다음 차례고 돈이 되면 바로 되살린다
    const next = sim.nextShop();
    if (next && next.id === id && sim.openShop(id)) {
      Sfx.win(); Juice.shake(7);
    } else {
      Sfx.deny();
    }
    return;
  }
  openShopId = id; panelKind = 'shop';
  $('#ptitle').textContent = `${shop.sign} ${shop.name}`;
  $('#pbody').innerHTML = shopHTML(shop);
  $('#panel').hidden = false;
  bindShop();
  Sfx.click();
}

function closePanel() { openShopId = null; panelKind = null; $('#panel').hidden = true; }
$('#pclose').onclick = () => { Sfx.click(); closePanel(); };
$('#panel').onclick = (e) => { if (e.target.id === 'panel') closePanel(); };

function shopHTML(s) {
  const rows = s.items.map((it) => {
    if (sim.isOpen(it.id)) {
      const lv = sim.lv(it.id), st = sim.items[it.id];
      const cost = sim.levelCost(it.id);
      const max = sim.maxLv(it.id), atMax = sim.atMax(it.id);
      const toMs = MILESTONE_EVERY - (lv % MILESTONE_EVERY);
      const ms = !atMax && toMs <= 3;
      return `<div class="item" data-id="${it.id}">
        <div class="bar"></div>
        <div class="row">
          <div><div class="nm">${sim.itemName(it.id)}</div><div class="lv">Lv.${lv}/${max}${
            atMax ? ' · 만렙' : ms ? ` · ${toMs}레벨 뒤 값이 2배` : ''}</div></div>
          <div class="stat"><b>🪙${fmt(sim.price(it.id))}</b><br>
            재고 <span class="stk">${st.stock}</span>/${sim.capOf(it.id)} · ${sim.craftTime(it.id).toFixed(1)}초</div>
        </div>
        ${atMax ? '<div class="maxed">더 올릴 수 없다 — 가게를 승급해야 한다</div>' : `<div class="ups">
          <button class="up ${ms ? 'ms' : ''}" data-up="${it.id}" data-n="1"
            ${sim.money >= cost ? '' : 'disabled'}>레벨업 🪙${fmt(cost)}</button>
          <button class="up bulk" data-up="${it.id}" data-n="10"
            ${sim.money >= sim.levelCostMany(it.id, 10) ? '' : 'disabled'}>×10</button>
          <button class="up bulk" data-up="${it.id}" data-n="max"
            ${sim.money >= cost ? '' : 'disabled'}>최대</button>
        </div>`}
      </div>`;
    }
    if (sim.asked.includes(it.id)) {
      return `<div class="item locked-item"><div class="row">
        <div><div class="nm">${sim.itemName(it.id)}</div><div class="lv">손님이 찾던 물건</div></div></div>
        <button class="up open-btn" data-open="${it.id}"
          ${sim.money >= it.cost ? '' : 'disabled'}>칸 열기 🪙${fmt(it.cost)}</button></div>`;
    }
    return `<div class="item locked-item"><div class="row">
      <div><div class="nm">? ? ?</div><div class="lv">아직 아무도 찾지 않았다</div></div></div></div>`;
  }).join('');
  return `<div class="shopnote">${s.desc}</div>${rows}${staffHTML(s)}${promoteHTML(s)}`;
}

/* 직원 — 점장 혼자 만들고 팔다가, 마당이 커지면(승급) 일손을 들인다.
 * 직원 한 명 = 이 가게 진열대 +10칸. */
function staffHTML(s) {
  const n = sim.staffOf(s.id), max = sim.staffMax(s.id);
  if (max === 0) {
    return `<div class="item locked-item"><div class="row">
      <div><div class="nm">일손 들이기</div>
      <div class="lv">가게를 승급하면 직원 자리가 생긴다</div></div></div></div>`;
  }
  const cost = sim.staffCost(s.id);
  const full = n >= max;
  return `<div class="item"><div class="row">
    <div><div class="nm">일손 ${'🦝'.repeat(n + 1)}</div>
    <div class="lv">점장 1 + 직원 ${n}/${max} · 계산 중에도 생산이 안 멈춘다</div></div></div>
    ${full ? '' : `<button class="up" data-hire="${s.id}"
      ${sim.money >= cost ? '' : 'disabled'}>직원 들이기 🪙${fmt(cost)}</button>`}
  </div>`;
}

/* 손님 도감.
 *
 * 단골 목록을 가게 창마다 붙였더니 다섯 곳에 똑같은 게 반복됐다. 손님은
 * 특정 가게의 것이 아니라 마을 전체의 것이므로 따로 뺀다.
 *
 * 아직 안 온 손님도 자리를 비워 보여준다 — 몇이 더 남았는지, 무엇을 하면
 * 오는지가 보여야 모으는 재미가 생긴다.
 */
function guestsHTML() {
  const rows = GUESTS.map((g) => {
    if (!sim.guests.includes(g.id)) {
      return `<div class="grow off"><span class="gf">?</span>
        <span class="gn">? ? ?</span>
        <span class="gl">누적 매출 🪙${fmt(g.at)}에 온다</span></div>`;
    }
    const lv = sim.regularLv(g.id), left = sim.regularLeft(g.id);
    const carry = g.qty <= 5 ? '맨손' : g.qty <= 9 ? '봇짐' : g.qty <= 12 ? '지게' : '달구지';
    const bought = sim.bought[g.id] || 0;
    return `<div class="grow">
      <span class="gf">${g.face}</span>
      <span class="gn">${g.name}</span>
      <span class="gr ${lv >= 15 ? 'top' : ''}">${lv + 1}성 ${sim.regularName(g.id)}</span>
      <span class="gl">${left === null ? '최고 등급' : `다음까지 ${fmt(left)}번`}</span>
      <div class="gsub">${g.desc}</div>
      <div class="gsub gnum">${carry} · ${g.every}초마다 ${g.qty}개 · 값 ×${g.pay}${
        g.spread === 1 ? ' · 한 종류만' : ''}${
        g.wild >= 0.6 ? ' · 언제 올지 모른다' : ''} · 누적 ${fmt(bought)}개 / ${fmt(sim.visits[g.id] || 0)}번</div>
    </div>`;
  }).join('');
  const have = sim.guests.length;
  return `<div class="gh2">마을에 온 손님 ${have} / ${GUESTS.length}
    · 단골 등급 합계 <b>${sim.regularSum()}</b></div>${rows}`;
}

/* ── 마을 의뢰 ──
 * 단위가 손님 한 마리가 아니라 **마을**이다. 그래서 아무것도 안 해도
 * 그 마을 손님이 올 때마다 눈금이 찬다 — 방치형에서 다시 켤 이유는
 * "가만히 뒀는데 뭔가 올라가 있다"에서 나온다.
 *
 * 실패도, 시간 제한도 없다. 있으면 지켜봐야 하는 숙제가 된다.
 */
function questsHTML() {
  const rows = sim.quests.map((q) => {
    const g = GUESTS.find((x) => x.id === q.gid);
    const p = Math.min(100, (q.got / q.need) * 100);
    return `<div class="qrow" data-q="${q.id}">
      <div class="qbar" style="width:${p}%"></div>
      <div class="qin">
        <span class="qv">${g.face} ${g.name}마을</span>
        <span class="qw">${sim.itemName(q.itemId)} ${fmt(q.need)}개</span>
        <span class="qg">💎${q.gems}</span>
      </div>
      <div class="qn">${fmt(q.got)} / ${fmt(q.need)} · ${
        sim.regularStar(q.gid)}성 ${sim.regularName(q.gid)}
        · 마치면 🪙${fmt(Math.floor(sim.price(q.itemId) * q.need * QUEST.payMul))}</div>
    </div>`;
  }).join('');

  const blank = sim.quests.length < QUEST.slots
    ? `<div class="qempty">다음 의뢰가 오는 중… (${Math.ceil(Math.max(0, sim._qCool))}초)</div>` : '';

  /* 젬 쓰는 곳. 지금은 **화면을 새로 안 만들어도 되는 것**만 있다 —
   * 뽑기·룰렛·스킨은 새 화면이 필요해서 엔진을 옮긴 뒤로 미뤘다. */
  const ups = GEM_UPGRADES.map((u) => {
    const lv = sim.upLv(u.id), cost = sim.gemCost(u.id);
    if (cost === null) {
      return `<div class="gup done"><span class="uf">${u.face}</span>
        <span class="un">${u.name}</span><span>${u.max}단계 — 끝까지 올렸다</span></div>`;
    }
    return `<div class="gup"><span class="uf">${u.face}</span>
      <span class="un">${u.name} ${lv}/${u.max}</span>
      <button data-gup="${u.id}" ${sim.gems >= cost ? '' : 'disabled'}>💎${cost}</button>
      <span class="ud">${u.desc}${lv ? ` · 지금 ${
        u.id === 'haggle' ? '+' + (lv * u.step * 100).toFixed(1) + '%' :
        u.id === 'forge' ? '−' + Math.round(lv * u.step * 100) + '%' :
        '−' + (lv * u.step).toFixed(1) + '초'}` : ''}</span></div>`;
  }).join('');

  return `<div class="gh2">가진 젬 <b>💎${sim.gems}</b>
    · 의뢰를 마치거나, 품목을 만렙까지 올리거나, 나쁜 놈을 잡으면 모인다</div>
    ${rows}${blank}
    <div class="gh2" style="margin-top:14px">젬 쓰는 곳</div>
    <div class="gup"><span class="uf">👷</span>
      <span class="un">삯꾼 부르기</span>
      <button id="gemrush" ${sim.canRush() ? '' : 'disabled'}>💎${GEM.rush.cost}</button>
      <span class="ud">${sim.rush > 0 ? `삯꾼이 일하는 중… ${Math.ceil(sim.rush)}초` :
        `${GEM.rush.secs}초 동안 만드는 속도가 ${GEM.rush.mult}배`}</span></div>
    ${ups}
    <div class="qempty" style="margin-top:10px">뽑기 · 룰렛 · 스킨 상점은 다음 판에 붙는다</div>`;
}

function bindQuests() {
  const gf = $('#gemrush');
  if (gf) gf.onclick = () => {
    if (sim.callRush()) { Sfx.win(); Juice.shake(6); } else Sfx.deny();
    $('#pbody').innerHTML = questsHTML(); bindQuests();
  };
  document.querySelectorAll('[data-gup]').forEach((b) => b.onclick = () => {
    if (sim.buyGemUp(b.dataset.gup)) { Sfx.reward(); Juice.shake(5); } else Sfx.deny();
    $('#pbody').innerHTML = questsHTML(); bindQuests();
  });
}

/* 승급 — 마을이 다 찬 뒤의 다음 목표.
 * 조건을 통과/미통과로 하나씩 보여준다. 못 하는 이유가 안 보이면
 * 목표가 되지 못하고 그냥 잠긴 버튼으로만 남는다. */
function promoteHTML(s) {
  const r = sim.promoteReqs(s.id);
  if (!r) return `<div class="promo done">${s.ranks[sim.rankOf(s.id)]} 등급 — 더 오를 곳이 없다</div>`;
  const ok = r.list.every((x) => x.ok);
  const lines = r.list.map((x) =>
    `<div class="req ${x.ok ? 'on' : ''}">${x.ok ? '✓' : '·'} ${x.text}</div>`).join('');
  const nextName = s.ranks[r.rank];
  return `<div class="promo">
    <div class="ph">${s.ranks[sim.rankOf(s.id)]} → <b>${nextName}</b> 등급으로 승급</div>
    <div class="pd">${s.items.map((it) => nextName + it.name).join(' · ')}</div>
    ${lines}
    <button class="up ${ok ? 'ms' : ''}" data-promote="${s.id}" ${ok ? '' : 'disabled'}>
      ${ok ? `승급하기 🪙${fmt(r.cost)}` : '조건을 채워야 한다'}</button>
  </div>`;
}

function bindShop() {
  document.querySelectorAll('[data-up]').forEach((b) => b.onclick = () => {
    const id = b.dataset.up;
    const want = b.dataset.n === 'max' ? sim.affordableLevels(id) : Number(b.dataset.n);
    const wasMs = Math.floor(sim.lv(id) / MILESTONE_EVERY);
    if (!sim.levelUpMany(id, want)) return;
    if (Math.floor(sim.lv(id) / MILESTONE_EVERY) > wasMs) { Sfx.win(); Juice.shake(7); }
    else Sfx.click();
    $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
  });
  const pb = document.querySelector('[data-promote]');
  if (pb) pb.onclick = () => {
    if (sim.promote(pb.dataset.promote)) {
      Sfx.win(); Juice.shake(10);
      $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
    }
  };
  document.querySelectorAll('[data-hire]').forEach((b) => b.onclick = () => {
    if (sim.hireStaff(b.dataset.hire)) { Sfx.reward(); Juice.shake(5); $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop(); }
  });
  document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => {
    if (sim.openItem(b.dataset.open)) {
      Sfx.reward(); Juice.shake(4);
      $('#pbody').innerHTML = shopHTML(shopById(openShopId)); bindShop();
    }
  });
}

/* ── 장부 정리(자동 강화) ── */
function renderAuto() {
  const bar = $('#autobar');
  bar.innerHTML =
    `<button id="openguests" class="ghost">손님 ${sim.guests.length}/${GUESTS.length}</button>` +
    `<button id="openquests" class="ghost">의뢰 ${sim.quests.length}</button>` +
    (sim.auto ? '' : `<button id="buyauto" ${sim.money >= AUTO_COST ? '' : 'disabled'}>
      장부 정리 🪙${fmt(AUTO_COST)}</button>`);
  $('#openguests').onclick = openGuests;
  $('#openquests').onclick = openQuests;
  const ba = $('#buyauto');
  if (ba) ba.onclick = () => {
    if (sim.buyAuto()) { Sfx.reward(); Juice.shake(5); renderAuto(); }
  };
}

/* ── 마을 장면 ── */
const eng = new Engine($('#cv'), { w: 480, h: 800, bg: '#8b9e74', fit: 'width' });
const village = new Village(sim, openPanel);

/* 장부(아래 로그)는 손님이 계산대에서 물건을 받는 **그 순간** 쓴다.
 * 예전엔 sim이 계산을 마치자마자 썼는데, 손님은 아직 걸어오는 중이라
 * "오기도 전에 사갔다고 나온다"가 됐다 — 유저 눈엔 그냥 버그다. */
village.onDelivered = (s) => {
  $('#guest').className = '';
  if (s.n === 0) {
    const what = s.grumbles && s.grumbles.length ? sim.itemName(s.grumbles[0].item.id) : '물건';
    $('#guest').innerHTML =
      `<span class="face">${s.guest.face}</span><span class="say">` +
      `${s.guest.name}: ${josa(what, '이', '가')} 없어 발길을 돌렸다 💢</span>`;
    return;
  }
  const head = sim.itemName(s.lines[0].item.id);
  const more = s.lines.length > 1 ? ` 외 ${s.lines.length - 1}종` : '';
  const waited = s.waited > 0.5 ? ' (기다렸다 받아갔다)' : '';
  $('#guest').innerHTML =
    `<span class="face">${s.guest.face}</span><span class="say">` +
    `${sim.regularLv(s.guest.id) ? sim.regularName(s.guest.id) + ' ' : ''}${s.guest.name}가 ` +
    `<b>${head}${more}</b> ${s.n}개를 사갔다 · <b>🪙${fmt(s.gain)}</b>${waited}</span>`;
};
/* '가게 안' 화면은 은퇴했다. 마당 방식이 되면서 안이 지도에서 다 보인다 —
 * 매대를 누르면 그 자리에서 강화되고, 마당을 누르면 가게 창이 열린다. */

let uiAcc = 0, saveAcc = 0, pestShown = false;
eng.add('village', {
  update(dt) {
    const r = sim.tick(dt);

    for (const s of r.sales) village.onSale(s);
    for (const d of r.done || []) village.onOrderDone(d);
    for (const p of r.pests || []) village.onPestGone(p);
    if (r.ask) {
      village.onAsk(r.ask);
      Sfx.deny();
      $('#guest').className = 'ask';
      $('#guest').innerHTML =
        `<span class="face">${r.ask.guest.face}</span><span class="say">${r.ask.guest.name}: ` +
        `"<b>${r.ask.line}</b>" — 없다고 하자 돌아갔다</span>`;
    }
    if (r.newGuest) Sfx.reward();

    /* 의뢰 완료 — 위쪽 띠로 알린다. 아래 버튼의 숫자만 바뀌면
     * 안 보고 있을 때 끝난 걸 알 방법이 없다. */
    for (const q of r.quests || []) {
      Sfx.win(); Juice.shake(6);
      $('#guest').className = 'catch';
      $('#guest').innerHTML = `<span class="face">${q.guest.face}</span><span class="say">` +
        `<b>${q.guest.name}마을</b> 의뢰를 마쳤다 · ${sim.itemName(q.item.id)} ${fmt(q.need)}개 ` +
        `— <b>🪙${fmt(q.coin)}</b> · <b>💎${q.gems}</b></span>`;
    }

    /* 나쁜 놈 — 화면 위쪽 띠로도 알린다. 마을을 밀어 다른 데를 보고 있으면
     * 캔버스의 쥐가 화면 밖일 수 있는데, 그때 알 방법이 없다. */
    if (sim.pest && !pestShown) {
      pestShown = true;
      Sfx.deny();
      const P = sim.pestKind();
      $('#guest').className = 'pest';
      $('#guest').innerHTML = `<span class="face">${P.face}</span><span class="say">` +
        `${josa(P.name, '이', '가')} <b>${sim.pest.what}</b> — <b>눌러서 잡아라!</b></span>`;
    } else if (!sim.pest && pestShown) {
      pestShown = false;
      /* 잡았는지 놓쳤는지는 sim이 남긴 사건으로 갈린다.
       * 잡는 조작은 캔버스에서 일어나므로 여기까지 따로 알려오지 않는다. */
      const e = sim.events[0];
      if (e && e.kind === 'catch') {
        Sfx.win();
        $('#guest').className = 'catch';
        $('#guest').innerHTML = `<span class="face">🎉</span><span class="say">${e.msg}</span>`;
      } else if (e && e.kind === 'guard') {
        Sfx.reward();
        $('#guest').className = 'catch';
        $('#guest').innerHTML = `<span class="face">🐕</span><span class="say">${e.msg}</span>`;
      } else if (e && e.kind === 'pest') {
        $('#guest').className = '';
        $('#guest').innerHTML = `<span class="face">💨</span><span class="say">${e.msg}</span>`;
      }
    }

    village.update(dt, eng.pointer, eng.viewH);

    // 화면 글자 갱신은 초당 8회면 충분하다. 매 프레임 DOM을 만지면 폰이 뜨거워진다.
    uiAcc += dt;
    if (uiAcc > 0.12) { uiAcc = 0; paint(); }

    saveAcc += dt;
    if (saveAcc > 5) { saveAcc = 0; Store.set(SAVE, { state: sim.save(), at: Date.now() }); }
  },
  draw(c) { village.draw(c); },
});

let lastMoney = -1, lastAuto = null, lastGuests = -1, lastQuests = -1, guestTick = 0;
function paint() {
  const m = $('#money');
  /* 계산 연출이 아직 안 끝난 몫은 빼고 보여준다 — 손님이 오기도 전에
   * 돈이 오르면 버그로 보인다. sim의 진짜 돈은 그대로다(버튼 계산엔 그걸 쓴다). */
  const shown = Math.max(0, sim.money - village.inTransit());
  m.textContent = '🪙 ' + fmt(shown);
  if (shown !== lastMoney) { m.classList.add('pop'); setTimeout(() => m.classList.remove('pop'), 120); }
  lastMoney = shown;
  $('#ips').textContent = '초당 🪙' + fmt(sim.incomePerSec());
  $('#shopcount').textContent = `가게 ${sim.shops.length}/${SHOPS.length} · 손님 ${sim.guests.length}`;
  $('#gems').textContent = '💎 ' + fmt(sim.gems);

  const canAuto = !sim.auto && sim.money >= AUTO_COST;
  if (sim.auto !== lastAuto || lastGuests !== sim.guests.length || lastQuests !== sim.quests.length) {
    lastAuto = sim.auto; lastGuests = sim.guests.length; lastQuests = sim.quests.length; renderAuto();
  }
  const ba = $('#buyauto');
  if (ba) ba.disabled = !canAuto;

  if (panelKind === 'guests') {
    guestTick += 1;
    if (guestTick > 8) { guestTick = 0; $('#pbody').innerHTML = guestsHTML(); }
  }
  /* 의뢰 창은 눈금이 차오르는 걸 보는 창이라 더 자주 고쳐 그린다.
   * 대신 버튼을 다시 묶어야 한다 — 안 묶으면 눌러도 아무 일이 없다. */
  if (panelKind === 'quests') {
    guestTick += 1;
    if (guestTick > 4) { guestTick = 0; $('#pbody').innerHTML = questsHTML(); bindQuests(); }
  }

  if (openShopId) {
    for (const el of document.querySelectorAll('.item[data-id]')) {
      const id = el.dataset.id, st = sim.items[id];
      if (!st) continue;
      el.querySelector('.bar').style.width = (st.prog / sim.craftTime(id)) * 100 + '%';
      const stk = el.querySelector('.stk');
      if (stk) stk.textContent = st.stock;
    }
    document.querySelectorAll('[data-up]').forEach((b) => {
      const id = b.dataset.up;
      if (!id) return;
      b.disabled = sim.atMax(id) || (b.dataset.n === '10'
        ? sim.money < sim.levelCostMany(id, 10)
        : sim.money < sim.levelCost(id));
    });
    document.querySelectorAll('[data-open]').forEach((b) => {
      b.disabled = sim.money < itemById(b.dataset.open).cost;
    });
  }
}

addEventListener('pointerdown', () => Sfx.unlock(), { once: true });

/* ── 소리 스위치 ──
 * 끈 상태는 저장과 별도 열쇠로 남긴다 — 게임 저장을 지워도(처음부터 하기)
 * "시끄러워서 껐다"는 취향은 지워질 이유가 없다. */
const MUTE = 'rs:mute';
function paintMute() {
  $('#mute').textContent = Sfx.muted ? '🔇' : '🔊';
  $('#mute').classList.toggle('off', Sfx.muted);
}
if (Store.get(MUTE)) Sfx.toggleMute();
paintMute();
$('#mute').addEventListener('click', () => {
  Store.set(MUTE, Sfx.toggleMute());
  paintMute();
  Sfx.click();      // 켰을 때만 들린다 — "다시 소리 난다"는 확인음
});
addEventListener('visibilitychange', () => {
  if (document.hidden) Store.set(SAVE, { state: sim.save(), at: Date.now() });
});

renderAuto(); paint();
eng.start('village');
</script>
</body>
</html>
